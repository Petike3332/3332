    function writeJob() {
      let target = job && jobById(job.id);
      const isNew = !target;
      if (isNew) target = { id: editId, createdAt: Date.now(), address: '', latitude: null, longitude: null, locationPrecision: null, locationPinMoved: false,
                            ratePence: JobRates.initialRate(S.settings.ratePence) };
      target.customerName = f.customerName.trim();
      target.jobDescription = f.jobDescription.trim();
      if (f.status === 'Completed' && target.status !== 'Completed') target.completedAt = Date.now();
      if (f.status !== 'Completed') target.completedAt = null;
      target.status = f.status;
      target.phone = f.phone.trim();
      target.email = f.email.trim();
      LocationEditing.apply(location, f.address, target);   // chosen location saved with precision; hand edits clear it
      target.notes = f.notes.trim();
      target.collectionDate = f.hasCollect ? f.collect : null;
      target.deliveryDate = f.hasDeliver ? f.deliver : null;
      target.collectionType = f.collectType;
      target.deliveryType = f.deliverType;
      // the time it actually happened (chosen when Done was tapped); falls back to now for older marks
      target.collectionDoneAt = f.hasCollect && f.collectDone ? (f.collectDoneAt || Date.now()) : null;
      target.deliveryDoneAt = f.hasDeliver && f.deliverDone ? (f.deliverDoneAt || Date.now()) : null;
      target.meetingDoneAt = f.hasMeeting && f.meetingDone ? (f.meetingDoneAt || Date.now()) : null;
      target.meetingDate = f.hasMeeting ? f.meeting : null;
      target.meetingPlace = f.meetingPlace === 'workshop' ? 'workshop' : 'customer';
      target.meetingTime = f.hasMeeting && /^\d{2}:\d{2}$/.test(f.meetingTime) ? f.meetingTime : null;
      target.meetingNote = f.hasMeeting ? f.meetingNote.trim() : '';
      target.meetingDone = f.hasMeeting && f.meetingDone;
      target.collectionDone = f.hasCollect && f.collectDone;
      target.deliveryDone = f.hasDeliver && f.deliverDone;
      target.collectionTime = f.hasCollect && /^\d{2}:\d{2}$/.test(f.collectTime) ? f.collectTime : null;
      target.deliveryTime = f.hasDeliver && /^\d{2}:\d{2}$/.test(f.deliverTime) ? f.deliverTime : null;
      // Quote and deposit: blank means "not set" (allowed); non-blank text that won't parse
      // is caught before we ever reach here, so these always parse cleanly at this point.
      const q = Money.parsePence(f.quote);
      target.quotePence = f.quote.trim() !== '' && q !== null && q >= 0 ? q : null;
      const dep = Money.parsePence(f.deposit);
      if (f.deposit.trim() !== '' && dep !== null && dep > 0) { target.depositPence = dep; target.depositDate = f.depositDate || todayISO(); }
      else { target.depositPence = null; target.depositDate = null; }
      target.ratePence = Math.max(0, Money.parsePence(f.rate));
      target.pricing = f.pricing === 'hourly' ? 'hourly' : 'fixed';
      if (!f.clientId && f.saveClient && target.customerName) {
        const c = { id: uid(), name: target.customerName, phone: target.phone || '', email: target.email || '', address: target.address || '', notes: '', createdAt: Date.now(),
                    latitude: target.latitude, longitude: target.longitude, locationPrecision: target.locationPrecision, locationPinMoved: !!target.locationPinMoved };
        S.clients.push(c);
        f.clientId = c.id;
      }
      target.clientId = f.clientId || null;   // the job keeps its own copy of the details; the link is for the client's history
      if (isNew) S.jobs.push(target);
      ensureJobNumbers();   // gives a new job (or an enquiry just turned into a job) the next number; enquiries get none
      saved = true;
      saveAll(); closeOverlay(ov);
    }
    ov.querySelector('[data-save]').onclick = () => {
      if (!(f.customerName.trim() && f.jobDescription.trim())) return;
      // Non-blank text that doesn't parse as an amount is refused rather than silently
      // dropped to £0.00 or "no quote" — the person gets a chance to fix a typo.
      const qv = Money.parsePence(f.quote), dv = Money.parsePence(f.deposit);
      const badQuote = f.quote.trim() !== '' && (qv === null || qv < 0);       // negative amounts are refused too,
      const badDeposit = f.deposit.trim() !== '' && (dv === null || dv < 0);   // not quietly dropped
      const rateVal = Money.parsePence(f.rate);
      const badRate = f.rate.trim() === '' || rateVal === null || rateVal < 0;
      if (badQuote) { toast('Enter a valid quoted price, or leave it blank.'); return; }
      if (badDeposit) { toast('Enter a valid deposit amount, or leave it blank.'); return; }
      if (badRate) { toast('Enter a valid hourly rate for this job.'); return; }
      if (rateVal === 0) {
        actionSheet(`Hourly rate is ${fmt(0)}`, `No labour value will be recorded for time logged to this job while its rate is ${fmt(0)}. You can still save it this way if that's what you want.`, [
          { label: `Save with ${fmt(0)} rate`, action: writeJob },
          { label: 'Go back and fix it', role: 'cancel' }
        ]);
        return;
      }
      writeJob();
    };
  }
  function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

  // Quote vs Actual panel (JobBudgetView.swift)
  function budgetRows(b) {
    const rows = [];
    const row = (l, v, extra = '') => `<div class="row"><span>${l}</span><span class="v num" ${extra}>${v}</span></div>`;
    rows.push(b.quotePence !== null ? row('Quoted price', fmt(b.quotePence)) : row('Quoted price', 'Not set'));
    rows.push(`<div class="row"><span>Labour recorded</span><b class="num">${fmt(b.recordedLaborPence)}</b></div>`);
    if (!b.rateHistory.length) rows.push(`<div class="row hint">No time recorded on this job yet.</div>`);
    else rows.push(`<div class="row ratehist" style="display:block"><div class="hint" style="font-weight:600;margin-bottom:4px">Rate history</div>
      ${b.rateHistory.map(l => `<div class="line"><span>${fmt(l.ratePence)}/hr</span><span>${Duration.decimalHours(l.workedSeconds)} h</span><span>${fmt(l.laborPence)}</span></div>`).join('')}
      <div class="hint" style="font-size:11px;margin-top:4px">Each time entry keeps the rate it was charged at.</div></div>`);
    if (b.runningShiftLaborPence > 0) rows.push(row('Current shift (not yet saved)', fmt(b.runningShiftLaborPence)));
    if (b.variancePence !== null) {
      const c = b.variancePence >= 0 ? 'var(--green-t)' : 'var(--red)';
      rows.push(`<div class="row"><span>Variance</span><span style="text-align:right;color:${c}"><b class="num">${Money.formatSigned(b.variancePence, cur())}</b>
        ${b.varianceBasisPoints !== null ? `<div style="font-size:11px">${Money.percent(Math.abs(b.varianceBasisPoints))} ${b.variancePence >= 0 ? 'under quote' : 'over quote'}</div>` : ''}</span></div>`);
    }
    if (b.jobRatePence !== null) {
      rows.push(row('Current job rate', fmt(b.jobRatePence) + '/hr'));
      if (b.historicalRatesDiffer) rows.push(`<div class="row hint">The current rate (${fmt(b.jobRatePence)}/hr) sets the time allowance and applies to new time. Time already logged stays at the rates shown in the rate history.</div>`);
    }
    if (b.allowanceSeconds !== null) rows.push(row('Time allowance', Duration.decimalHours(b.allowanceSeconds) + ' h'));
    rows.push(row('Time used', Duration.decimalHours(b.workedSeconds) + ' h'));
    if (b.remainingSeconds !== null) rows.push(`<div class="row"><span>${b.remainingSeconds >= 0 ? 'Time remaining' : 'Time over'}</span>
      <b class="num" style="color:${b.remainingSeconds >= 0 ? 'var(--text)' : 'var(--red)'}">${Duration.short(b.remainingSeconds)}</b></div>`);
    if (b.usedBasisPoints !== null) {
      const u = b.usedBasisPoints, c = u > 10000 ? 'var(--red)' : u >= 7500 ? 'var(--orange)' : 'var(--green)';
      rows.push(row('Budget used', Money.percent(u)));
      rows.push(`<div class="row" style="display:block"><div class="progress" style="margin:0"><div style="width:${Math.min(100, u / 100)}%;background:${c}"></div></div></div>`);
    } else if (b.quotePence !== null && b.jobRatePence === null) {
      rows.push(`<div class="row hint">Set a labour rate for this job to see its time allowance.</div>`);
    }
    return rows.join('');
  }

  // =========================================================================================
  // ADDRESS FINDER (AddressSearchView.swift) — free map data stands in for Apple's search
  // =========================================================================================
  async function fetchJson(url, ms = 9000) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
    try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  const fromNominatim = item => { const a = item.address || {}; return { houseNumber: a.house_number, street: a.road || a.pedestrian || a.footway || a.path,
    subLocality: a.village || a.hamlet || a.suburb || a.neighbourhood, locality: a.town || a.city || a.county, postcode: a.postcode, country: a.country,
    latitude: parseFloat(item.lat), longitude: parseFloat(item.lon) }; };
  const fromPhoton = ft => { const p = ft.properties || {}, g = (ft.geometry || {}).coordinates || [0, 0];
    return { houseNumber: p.housenumber, street: p.street || (p.osm_key === 'highway' ? p.name : null), subLocality: p.locality || p.district,
      locality: p.city || p.county, postcode: p.postcode, country: p.country, latitude: g[1], longitude: g[0] }; };
  function findPostcode(q) { const m = String(q).match(/([A-Za-z]{1,2}\d[A-Za-z\d]?)\s*(\d[A-Za-z]{2})/); return m ? (m[1] + ' ' + m[2]).toUpperCase() : null; }

  async function searchAddress(raw) {
    const q = raw.trim();
    if (q.length < 3) return [];
    const places = []; let attempts = 0, failures = 0, lastNom = 0;
    const nomWait = async () => { const gap = Date.now() - lastNom; if (lastNom && gap < 1100) await new Promise(r => setTimeout(r, 1100 - gap)); lastNom = Date.now(); };
    const run = async fn => { attempts++; try { places.push(...(await fn())); } catch (e) { failures++; } };
    const hasProperty = () => places.some(p => Place.precision(p) === 'property');
    const nominatim = (params, uk) => async () => { await nomWait();
      const d = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=en&limit=10' + (uk ? '&countrycodes=gb' : '') + '&' + params);
      return (d || []).map(fromNominatim); };
    // 1. Photon (good with house numbers), UK area
    await run(async () => { const d = await fetchJson('https://photon.komoot.io/api/?limit=10&lang=en&bbox=-8.7,49.8,1.9,60.9&q=' + encodeURIComponent(q));
      return ((d && d.features) || []).map(fromPhoton); });
    // 2. Nominatim free text, UK
    if (!hasProperty()) await run(nominatim('q=' + encodeURIComponent(q), true));
    // 3. A house number was typed but no exact property yet: structured search (street and town separate)
    const number = AddressText.typedHouseNumber(q);
    if (!hasProperty() && number) {
      const pc = findPostcode(q);
      const body = q.replace(/^\d+[A-Za-z]?[,\s]+/, '').replace(pc ? new RegExp(pc.replace(' ', '\\s*'), 'i') : /$^/, '').replace(/[,\s]+$/, '').trim();
      const bits = body.split(',').map(s => s.trim()).filter(Boolean);
      const words = body.split(/\s+/).filter(Boolean);
      const STREETWORD = /^(close|road|rd|street|st|lane|ln|avenue|ave|drive|dr|way|court|crescent|place|terrace|gardens?|hill|park|grove|rise|view|walk|green|row|square|mews)$/i;
      const guesses = [];
      if (bits.length > 1) guesses.push([number + ' ' + bits[0], bits.slice(1).join(', ')]);
      if (bits.length === 1 && words.length > 1 && !STREETWORD.test(words[words.length - 1])) guesses.push([number + ' ' + words.slice(0, -1).join(' '), words[words.length - 1]]);
      for (const [street, city] of guesses) {
        if (hasProperty()) break;
        const p = new URLSearchParams({ street }); if (city) p.set('city', city); if (pc) p.set('postalcode', pc);
        await run(nominatim(p.toString(), true));
      }
    }
    // 4. Nothing in the UK: search worldwide
    if (!places.length) await run(nominatim('q=' + encodeURIComponent(q), false));
    // 5. Postcode centre only as a last resort
    const pc = findPostcode(q);
    if (!places.length && pc) await run(async () => {
      const d = await fetchJson('https://api.postcodes.io/postcodes/' + encodeURIComponent(pc.replace(' ', '')));
      if (d.status !== 200 || !d.result) return [];
      const r = d.result;
      return [{ houseNumber: null, street: null, subLocality: r.admin_ward || r.parish, locality: r.admin_district, postcode: r.postcode, country: 'United Kingdom', latitude: r.latitude, longitude: r.longitude }];
    });
    if (!places.length && failures === attempts) throw new Error("Address search isn't available right now. Check your connection and try again.");
    return Candidates.make(places, q);
  }

  function openAddressSearch(initialQuery, onSave) {
    const ov = pushOverlay('sheet');
    let query = initialQuery || '', results = [], selected = null, searching = false, message = null, token = 0, timer = null, mini = null;
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>Cancel</button><div class="title">Find address</div><span></span></div>
      <div class="bigsearch"><span style="font-size:20px">🔍</span><input id="as-q" type="search" autocomplete="street-address" autocapitalize="words"
        placeholder="House number, street, town or postcode" enterkeyhint="search"></div>
      <div class="body" id="as-body"></div>`;
    const input = ov.querySelector('#as-q');
    input.value = query;
    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    ov.cleanup = () => { if (mini) mini.remove(); };
    input.addEventListener('input', () => { query = input.value; selected = null; schedule(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });

    function schedule() {
      clearTimeout(timer);
      const q = query.trim();
      if (q.length < 3) { results = []; searching = false; message = q ? 'Keep typing: house number, street and town work best.' : null; render(); return; }
      timer = setTimeout(async () => {
        const my = ++token; searching = true; message = null; render();
        try { const found = await searchAddress(q); if (my !== token) return; results = found; message = found.length ? null : 'No matching addresses. Try adding the town or postcode.'; }
        catch (e) { if (my !== token) return; results = []; message = e.message; }
        searching = false; render();
      }, 400);
    }
    const saveTitle = p => ({ property: 'Save this property', street: 'Save street location', postcode: 'Save postcode location', area: 'Save area location' }[p]);
    function save(c) { onSave(c); closeOverlay(ov); }
    function render() {
      if (mini) { mini.remove(); mini = null; }
      const box = ov.querySelector('#as-body');
      if (!selected) {
        box.innerHTML = `${searching ? '<div class="pad muted">Searching…</div>' : message ? `<div class="pad muted">${esc(message)}</div>` : ''}
          ${results.length ? `<div class="group">${results.map((c, i) => {
            const exact = Precision.isExact(c.precision), diff = Candidates.isDifferentHouse(c, query);
            return `<div class="result ${exact ? 'exact' : ''}" data-i="${i}" ${i ? 'style="border-top:.5px solid var(--sep)"' : ''}>
              <div class="ic">${exact ? '🏠' : '📍'}</div>
              <div style="flex:1"><div class="addr">${esc(c.formattedAddress)}</div><div style="margin-top:6px">${locationBadge(c.precision, false)}</div>
                ${diff ? '<div class="hint" style="color:var(--orange-t);margin-top:4px">Different house number from your search</div>' : ''}</div>
              <div class="chev"></div></div>`; }).join('')}</div>
            <div class="sf">Results come from OpenStreetMap in this web test. The iPhone app uses Apple's address search, which may find different houses.</div>` : ''}`;
        box.querySelectorAll('.result').forEach(r => r.onclick = () => { selected = results[+r.dataset.i]; input.blur(); render(); });
      } else {
        const c = selected, diff = Candidates.isDifferentHouse(c, query);
        box.innerHTML = `<div class="minimap" id="as-mini"></div>
          <div style="margin:0 16px 12px"><div style="font-size:20px;font-weight:600">${esc(c.formattedAddress)}</div><div style="margin-top:8px">${locationBadge(c.precision, false)}</div></div>
          ${Precision.notice[c.precision] ? `<div class="notice">⚠️ ${esc(Precision.notice[c.precision])}</div>` : '<div class="sf" style="margin:0 16px 12px">Check this is the right house before saving.</div>'}
          ${diff ? '<div class="sf" style="margin:0 16px 12px;color:var(--orange-t)">This house number is different from the one you searched for.</div>' : ''}
          <div style="margin:0 16px"><button class="btn ${Precision.isExact(c.precision) ? 'green' : 'orange'}" id="as-save">${saveTitle(c.precision)}</button>
          <button class="linkbtn" id="as-back" style="width:100%;margin-top:6px">Back to results</button></div>`;
        mini = miniMap(box.querySelector('#as-mini'), c.latitude, c.longitude, c.precision, false);
        box.querySelector('#as-back').onclick = () => { selected = null; render(); };
        box.querySelector('#as-save').onclick = () => {
          if (Ranking.requiresConfirmation(c)) {
            actionSheet(Precision.notice[c.precision], `It will be saved as a ${Precision.label[c.precision].toLowerCase()}, not an exact property. You can move the pin onto the right house afterwards.`,
              [{ label: saveTitle(c.precision), action: () => save(c) }, { label: 'Keep searching', role: 'cancel' }]);
          } else save(c);
        };
      }
    }
    render(); schedule();
    setTimeout(() => input.focus(), 300);
  }

  function openPinAdjust(lat, lng, precision, onSave) {
    const ov = pushOverlay('sheet');
    let satellite = true;
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>Cancel</button><div class="title">Move pin</div>
      <div class="r"><div class="seg" style="margin:0 8px 0 0;width:150px"><button data-s="0">Map</button><button data-s="1" class="on">Satellite</button></div></div></div>
      <div class="pinwrap"><div id="pinmap"></div><div class="centerpin">📍</div></div>
      <div class="panel"><div style="font-weight:600">Move the map until the pin sits on the right house.</div>
        ${precision && !Precision.isExact(precision) ? `<div class="hint" style="margin-top:4px">This location came from a ${esc(Precision.label[precision].toLowerCase())} result. Placing the pin yourself won't mark it as an exact property.</div>` : ''}
        <button class="btn prim" id="pin-save" style="margin-top:12px">Save pin here</button></div>`;
    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    if (!hasLeaflet()) { ov.querySelector('#pinmap').innerHTML = '<div class="pad hint">Map unavailable (no connection).</div>'; return; }
    const m = L.map(ov.querySelector('#pinmap'), { zoomControl: false }).setView([lat, lng], 19);
    const layers = { map: L.tileLayer(OSM, { maxZoom: 19, attribution: OSM_ATTR }), sat: L.tileLayer(SAT, { maxZoom: 19, attribution: SAT_ATTR }) };
    layers.sat.addTo(m);
    ov.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      satellite = b.dataset.s === '1';
      ov.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
      m.removeLayer(satellite ? layers.map : layers.sat); (satellite ? layers.sat : layers.map).addTo(m);
    });

  async function runExportBackup(includePhotos) {

    const parts = [

      ',"exportedAt":' + JSON.stringify(new Date().toISOString()) + ',"photosIncluded":' + (includePhotos ? 'true' : 'false') +

    ];

  async function readBackupFile(file) {

    catch (e) { toast("That file isn't a valid Jobwright backup (not readable JSON)."); return; }
    const problem = backupProblem(payload);
    if (problem) { toast(`Can't restore this file: ${problem}. Nothing on this device was changed.`); return; }
    const jobCount = payload.data.jobs.length, logCount = payload.data.logs.length, photoCount = (payload.photos || []).length;
    const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'an unknown date';
    const dataOnly = payload.photosIncluded === false;
    const timerNote = payload.data.shift && payload.data.shift.isRunning
      ? " The timer was running when this backup was made. It will be restored as stopped, and that unfinished shift won't be saved." : '';
    actionSheet('Replace everything on this device?',
      (dataOnly
        ? `This data-only backup is from ${when} and has ${jobCount} job${jobCount === 1 ? '' : 's'} and ${logCount} time log${logCount === 1 ? '' : 's'} (no photos). ` +
          `Restoring replaces all jobs, time logs and settings on this device. Photos already on this device are kept. This can't be undone.`
        : `This backup is from ${when} and has ${jobCount} job${jobCount === 1 ? '' : 's'}, ${logCount} time log${logCount === 1 ? '' : 's'} and ${photoCount} photo${photoCount === 1  ? '' : 's'}. ` +
          `Restoring replaces all jobs, time logs, settings and photos currently on this device. This can't be undone.`) + timerNote,
      [
        { label: dataOnly ? 'Restore jobs and time logs' : 'Restore and replace everything', role: 'destructive', action: () => doRestoreBackup(payload) },

  async function doRestoreBackup(payload) {
    const withPhotos = payload.photosIncluded !== false;   // data-only backups leave this device's photos alone
    // 1. Decode EVERY photo first. If any is damaged, stop here: nothing on the device has been touched yet.
    const incoming = [];
    if (withPhotos) {
      for (const p of (payload.photos || [])) {
        let blob = null;
        try { if (typeof p.data === 'string' && p.data.startsWith('data:')) blob = await base64ToBlob(p.data); } catch (e) { blob = null; }
        if (!blob) { toast("Couldn't restore: a photo in this backup is damaged. Nothing on this device was changed."); return; }
        incoming.push({ id: p.id || uid(), jobId: p.jobId, kind: p.kind, ts: p.ts || Date.now(), blob });
      }
      // 2. Clear and write all photos in ONE transaction: if any write fails, IndexedDB rolls the whole
      //    transaction back, including the clear, so the old photos survive.
      try {
        await idbTx('readwrite', st => { st.clear(); incoming.forEach(r => st.put(r)); });
      } catch (e) {
        toast("Couldn't restore the photos (storage may be full). Nothing on this device was changed.");
        return;
      }
      // 3. Photos are safely stored: now swap the in-memory photo cache.
      PH.urls.forEach(u => URL.revokeObjectURL(u));
      PH.urls.clear(); PH.byJob.clear();
      incoming.forEach(r => { if (!PH.byJob.has(r.jobId)) PH.byJob.set(r.jobId, []); PH.byJob.get(r.jobId).push(r); });
    }
    // 4. Only after the photo writes succeeded, replace jobs, logs, settings and the shift.
    try {
      S.jobs = payload.data.jobs;
      S.logs = payload.data.logs;
      S.clients = Array.isArray(payload.data.clients) ? payload.data.clients : [];
      S.settings = Object.assign({ businessName: '', ratePence: 3500, currency: 'GBP', appearance: 'system' }, payload.data.settings || {});
      S.settings.privacyNoticeSeen = true;   // don't re-show the first-launch notice after a restore
      // A shift that was running when the backup was made is NOT resumed (it may have "started" days ago,
      // which would become one huge log when stopped): restore the timer as stopped instead.
      S.shift = payload.data.shift && payload.data.shift.isRunning ? Shift.create() : Object.assign(Shift.create(), payload.data.shift || {});
      S.timerSel = null;
      ensureJobNumbers();
      const ok = saveAll();
      // Data-only restore: photos kept on the device whose job isn't in the restored data can't be seen
      // anywhere, so remove them. Only done once the restored data has actually been saved.
      let orphansRemoved = 0;
      if (!withPhotos && ok) {
        const jobIds = new Set(S.jobs.map(j => j.id));
        const orphans = [];
        PH.byJob.forEach((list, jobId) => { if (!jobIds.has(jobId)) orphans.push(...list); });
        for (const rec of orphans) {
          try { await deletePhoto(rec); orphansRemoved++; } catch (e) { /* keep going */ }
        }
        orphans.forEach(rec => { if (PH.byJob.has(rec.jobId) && !PH.byJob.get(rec.jobId).length) PH.byJob.delete(rec.jobId); });
      }
      applyTheme();
      showTab('account');
      refreshAll();
      renderAccount();
      const orphanNote = orphansRemoved ? ` ${orphansRemoved} photo${orphansRemoved === 1 ? '' : 's'} for jobs not in this backup ${orphansRemoved === 1 ? 'was' : 'were'} removed.` : '';
      toast(ok ? (withPhotos ? 'Backup restored.' : 'Backup restored.' + (orphanNote || ' Photos on this device were kept (the backup had none).'))
               : "Restored, but saving to this device failed — export a fresh backup once storage is freed up.");
    } catch (e) {
      toast("Couldn't restore that backup: " + (e && e.message ? e.message : 'unknown error'));
    }
  }

  // =========================================================================================
  // INCOME FORECAST — done + booked-in jobs per month
  // =========================================================================================
  function forecastInfo() {
    const info = {};
    S.jobs.forEach(j => { info[j.id] = { laborPence: 0, lastLogMs: null, workedSeconds: 0 }; });
    S.logs.forEach(l => {                         // one pass over the logs, however many jobs there are
      const i = l.jobId && info[l.jobId]; if (!i) return;
      i.laborPence += TM.entryEarnings(l);         // uses only isBillable, workedSeconds, ratePence
      i.workedSeconds += l.workedSeconds || 0;
      if (i.lastLogMs === null || l.start > i.lastLogMs) i.lastLogMs = l.start;
    });
    return info;
  }
  const monthTitle = key => { const [y, m] = key.split('-').map(Number); return `${MONTH[m - 1]} ${y}`; };
  const monthShort = key => MON[Number(key.split('-')[1]) - 1];

  function openForecast() {
    const ov = pushOverlay('page');
    let key = Forecast.keyOfMs(Date.now());
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>‹ Account</button><div class="title">Income forecast</div><span></span></div><div class="body" id="fc"></div>`;
    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    const jobRow = r => `<div class="row tap" data-job="${esc(r.job.id)}"><div style="min-width:0"><div>${esc(r.job.customerName)}</div>
        <div class="hint">${esc(r.job.jobDescription)} · ${esc(r.basis)}${r.from === 'labour' ? (Income.pricing(r.job) === 'hourly' ? ' · hourly, time × rate' : ' · no quote, labour value') : r.from === 'estimate' ? ' · hourly estimate' : ''}</div></div>
        ${r.pence === null ? '<span class="pill orange">No quote</span>' : `<b class="num">${fmt(r.pence)}</b>`}</div>`;
    function render() {
      const info = forecastInfo();
      const m = Forecast.month(S.jobs, info, key);
      const thisKey = Forecast.keyOfMs(Date.now());
      const strip = [0, 1, 2, 3, 4, 5].map(n => { const k = Forecast.shiftKey(thisKey, n); const mm = Forecast.month(S.jobs, info, k); return { k, done: mm.doneTotal, booked: mm.bookedTotal }; });
      const max = Math.max(1, ...strip.map(x => x.done + x.booked));
      const un = Forecast.unscheduled(S.jobs, info);
      ov.querySelector('#fc').innerHTML = `
        <div class="periodnav" style="margin-top:8px"><button data-n="-1" aria-label="Previous month">‹</button><span class="ptitle">${monthTitle(key)}</span><button data-n="1" aria-label="Next month">›</button></div>
        <div class="group"><div class="pad"><div class="hint" style="font-weight:600">Estimated income</div>
          <div class="num" style="font-size:36px;font-weight:700">${fmt(m.total)}</div>
          <div class="two" style="margin-top:10px">
            <div><div class="hint">✅ Done</div><div class="big" style="color:var(--green-t)">${fmt(m.doneTotal)}</div><div class="hint">${m.done.length} ${m.done.length === 1 ? 'job' : 'jobs'}</div></div>
            <div style="text-align:right"><div class="hint">📅 Booked in</div><div class="big" style="color:var(--blue)">${fmt(m.bookedTotal)}</div><div class="hint">${m.booked.length} ${m.booked.length === 1 ? 'job' : 'jobs'}</div></div>
          </div>
          ${m.unpriced ? `<div class="hint" style="color:var(--orange-t);margin-top:8px">⚠️ ${m.unpriced} ${m.unpriced === 1 ? 'job has' : 'jobs have'} no quoted price and ${m.unpriced === 1 ? "isn't" : "aren't"} included.</div>` : ''}
        </div></div>
        <div class="sh">Next 6 months</div><div class="group"><div class="fchart">${strip.map(x => `<button type="button" class="fcol ${x.k === key ? 'on' : ''}" data-k="${x.k}" aria-label="${monthTitle(x.k)}: ${fmt(x.done + x.booked)}">
            <span class="fv">${x.done + x.booked ? fmt(x.done + x.booked).replace(/\.00$/, '') : ''}</span>
            <span class="fstack"><span class="fb booked" style="height:${x.booked / max * 100}%"></span><span class="fb done" style="height:${x.done / max * 100}%"></span></span>
            <span class="fl">${monthShort(x.k)}</span></button>`).join('')}</div>
          <div class="fkey"><span><i class="done"></i>Done</span><span><i class="booked"></i>Booked in</span></div></div>
        <div class="sh">Done in ${monthTitle(key)}</div><div class="group">${m.done.length ? m.done.map(jobRow).join('') : '<div class="row hint">No completed jobs in this month.</div>'}</div>
        <div class="sh">Booked in for ${monthTitle(key)}</div><div class="group">${m.booked.length ? m.booked.map(jobRow).join('') : '<div class="row hint">No jobs booked in for this month.</div>'}</div>
        ${un.rows.length ? `<div class="sh">Not scheduled yet · ${fmt(un.total)}</div><div class="group">${un.rows.map(r => jobRow(Object.assign({ basis: 'add a date to include it', from: 'quote' }, r))).join('')}</div>` : ''}
        <div class="sf">Based on quoted prices. Booked-in jobs count in the month of their delivery or pick-up date, otherwise the collection, drop-off or meeting date. Completed jobs count in the month they were handed over or marked Completed. A completed job without a quote uses its recorded labour. Deposits are part of the price, so they aren't added again.</div>`;
      const body = ov.querySelector('#fc');
      body.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { key = Forecast.shiftKey(key, +b.dataset.n); render(); });
      body.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { key = b.dataset.k; render(); });
      body.querySelectorAll('[data-job]').forEach(r => r.onclick = () => openJobDetail(r.dataset.job));
    }
    ov.refresh = render;
    render();
  }

  // =========================================================================================
  // TIME LOGS (TimeLogListView.swift)
  // =========================================================================================
  function openTimeLogs(initialFilter) {
    const ov = pushOverlay('page');
    let filter = initialFilter || { type: 'all' };
    const PAGE = 150; let limit = PAGE;   // long histories are shown in batches
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>‹ Back</button><div class="title">Time logs</div>
      <button class="linkbtn r" data-add aria-label="Add time manually" style="font-size:26px">＋</button></div><div class="body" id="tl"></div>`;
    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    ov.querySelector('[data-add]').onclick = () => openLogEditor(null, filter);
    function render() {
      if (filter.type === 'job' && !jobById(filter.id)) filter = { type: 'all' };
      const all = S.logs.filter(l => Filter.includes(filter, entryOf(l))).sort((a, b) => b.start - a.start);
      const shown = all.slice(0, limit);
      const days = [], byDay = new Map();
      shown.forEach(l => { const d = startOfDay(l.start); let g = byDay.get(d); if (!g) { g = { d, logs: [] }; byDay.set(d, g); days.push(g); } g.logs.push(l); });
      const body = ov.querySelector('#tl');
      body.innerHTML = `<div class="group" style="margin-top:14px">${filterSelect('tl-f', filter)}</div>
        ${shown.length ? days.map(g => `<div class="sh" style="display:flex;justify-content:space-between;text-transform:none">
          <span>${new Date(g.d).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
          <span class="num">${Duration.decimalHours(g.logs.reduce((s, l) => s + l.workedSeconds, 0))} hrs</span></div>
          <div class="group" data-day="${g.d}">${g.logs.map(l => swipeRow(`<div class="row" style="align-items:flex-start">
            <div><div style="font-weight:600">${esc(displayName(l))} ${l.isManual ? '<span class="pill gray" style="font-size:10px">Manual</span>' : ''}</div>
            <div class="hint">${new Date(l.start).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · ${Duration.decimalHours(l.workedSeconds)} hrs${l.breakSeconds > 0 ? ' · ' + Duration.short(l.breakSeconds) + ' break' : ''}</div>
            ${l.notes ? `<div class="hint">${esc(l.notes)}</div>` : ''}</div>
            ${l.isBillable ? `<b class="num">${fmt(TM.entryEarnings(entryOf(l)))}</b>` : '<span class="hint">Non-billable</span>'}</div>`,
            [{ label: 'Edit', color: '#8e8e93' }, { label: 'Delete', color: '#ff3b30' }])).join('')}</div>`).join('')
          : '<div class="empty"><div class="ico">🕒</div><b>No time logged</b>Time from the timer and manual entries appears here.</div>'}
        ${all.length > shown.length ? `<div class="group" style="margin-top:14px"><div class="row btnrow tap" id="tl-more">Show older entries (${all.length - shown.length} more)</div></div>` : ''}`;
      const more = body.querySelector('#tl-more'); if (more) more.onclick = () => { limit += PAGE; const y = body.scrollTop; render(); body.scrollTop = y; };
      const fs = body.querySelector('#tl-f'); fs.value = Filter.key(filter); fs.onchange = () => { filter = Filter.parse(fs.value); limit = PAGE; render(); };
      body.querySelectorAll('[data-day]').forEach(groupEl => {
        const logs = byDay.get(Number(groupEl.dataset.day)).logs;
        bindSwipes(groupEl, { tap: i => openLogEditor(logs[i].id), action: (i, a) => a === 0 ? openLogEditor(logs[i].id) : confirmDeleteLog(logs[i]) });
      });
    }
    ov.refresh = render;
    render();
  }
  function confirmDeleteLog(log, after) {
    actionSheet('Delete this time log?', "This can't be undone.", [
      { label: 'Delete', role: 'destructive', action: () => { S.logs = S.logs.filter(l => l.id !== log.id); saveAll(); refreshAll(); if (after) after(); } },
      { label: 'Cancel', role: 'cancel' }]);
  }

  // =========================================================================================
  // LOG EDITOR (LogEditorView.swift)
  // =========================================================================================
  function openLogEditor(logId, presetFilter) {
    const log = logId ? S.logs.find(l => l.id === logId) : null;
    const ov = pushOverlay('sheet');
    let billing, start, wh, wm, bm, rate, notes;
    if (log) {
      billing = !log.isBillable ? { type: 'general' } : jobById(log.jobId) ? { type: 'job', id: log.jobId } : { type: 'deleted', name: log.customerNameSnapshot };
      start = log.start; wh = Math.floor(log.workedSeconds / 3600); wm = Math.floor(log.workedSeconds % 3600 / 60); bm = Math.floor(log.breakSeconds / 60);
      rate = Money.plain(log.ratePence); notes = log.notes || '';
    } else {
      billing = { type: 'general' }; rate = Money.plain(S.settings.ratePence);
      if (presetFilter && presetFilter.type === 'job' && jobById(presetFilter.id)) {
        billing = { type: 'job', id: presetFilter.id };
        rate = Money.plain(jobById(presetFilter.id).ratePence);
      }
      start = Date.now() - 3600000; wh = 1; wm = 0; bm = 0; notes = '';
    }
    const bkey = b => b.type === 'job' ? 'job:' + b.id : b.type === 'deleted' ? 'deleted' : 'general';
    const draft = () => ({ billing, start, workedSeconds: wh * 3600 + wm * 60, breakSeconds: bm * 60, ratePence: Money.parsePence(rate) === null ? -1 : Money.parsePence(rate), notes });
    const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>Cancel</button><div class="title">${log ? 'Edit time' : 'Add time'}</div>
      <button class="linkbtn bold r" data-save>Save</button></div><div class="body" id="le"></div>`;
    const body = ov.querySelector('#le');
    body.innerHTML = `<div class="sh">Customer / job</div><div class="group"><div class="row"><span>Job</span><select id="le-job" style="width:auto;max-width:65%"></select></div>
        <div class="row hint" id="le-gen">General time counts as hours worked but is never charged.</div></div>
      <div class="sh">When</div><div class="group"><div class="row"><span>Started</span><input type="datetime-local" id="le-start" style="width:auto" aria-label="Started at"></div>
        <div class="row"><span>Finished</span><span class="v" id="le-end"></span></div></div>
      <div class="sh">Time</div><div class="group">
        <div class="row"><span>Worked hours <b class="num" id="le-wh"></b></span>${stepper('wh')}</div>
        <div class="row"><span>Worked minutes <b class="num" id="le-wm"></b></span>${stepper('wm')}</div>
        <div class="row"><span>Break <b class="num" id="le-bm"></b></span>${stepper('bm')}</div></div>
      <div class="sh">Charging</div><div class="group"><div class="row"><span>Hourly rate</span><input class="inp right" inputmode="decimal" id="le-rate" style="max-width:40%" aria-label="Hourly rate for this entry"></div>
        <div class="row"><span>Earnings</span><b class="num" id="le-earn"></b></div></div>
      <div class="sf">Earnings = worked time × hourly rate. Break time is never charged.</div>
      <div class="sh">Notes</div><div class="group"><div class="row"><textarea id="le-notes" rows="2" placeholder="What was done"></textarea></div></div>
      <div id="le-issues"></div>
      ${log ? '<div class="group" style="margin-top:24px"><div class="row danger tap" id="le-del">Delete time log</div></div>' : ''}`;

    const jobSel = body.querySelector('#le-job');
    function fillJobs() {
      jobSel.innerHTML = `<option value="general">${GENERAL}</option>` + [...S.jobs].sort((a, b) => a.customerName.localeCompare(b.customerName))
        .map(j => `<option value="job:${esc(j.id)}">${esc(jobLabel(j))}</option>`).join('') +
        (billing.type === 'deleted' ? `<option value="deleted">${esc(billing.name)} (deleted job)</option>` : '');
      jobSel.value = bkey(billing);
    }
    fillJobs();
    jobSel.onchange = () => {
      const v = jobSel.value;
      const nb = v === 'general' ? { type: 'general' } : v === 'deleted' ? billing : { type: 'job', id: v.slice(4) };
      const nj = nb.type === 'job' ? jobById(nb.id) : null;
      const chosen = JobRates.rateAfterJobChange(billing, nb, Money.parsePence(rate) || 0, nj ? nj.ratePence : null);
      billing = nb;
      if (chosen !== Money.parsePence(rate)) { rate = Money.plain(chosen); body.querySelector('#le-rate').value = rate; }
      update();
    };
    const startIn = body.querySelector('#le-start');
    startIn.value = toLocalInput(start);
    startIn.onchange = () => { const t = new Date(startIn.value).getTime(); if (!isNaN(t)) start = t; update(); };
    const rateIn = body.querySelector('#le-rate'); rateIn.value = rate; rateIn.oninput = () => { rate = rateIn.value; update(); };
    const notesIn = body.querySelector('#le-notes'); notesIn.value = notes; notesIn.oninput = () => { notes = notesIn.value; };
    body.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
      const [k, dir] = b.dataset.st.split(':'); const d = +dir;
      if (k === 'wh') wh = Math.max(0, Math.min(24, wh + d));
      if (k === 'wm') wm = Math.max(0, Math.min(59, wm + d));
      if (k === 'bm') bm = Math.max(0, Math.min(1440, bm + 5 * d));
      update();
    });
    function update() {
      const d = draft();
      body.querySelector('#le-gen').style.display = billing.type === 'general' ? '' : 'none';
      body.querySelector('#le-wh').textContent = wh; body.querySelector('#le-wm').textContent = wm; body.querySelector('#le-bm').textContent = bm + ' min';
      body.querySelector('#le-end').textContent = new Date(Draft.end(d)).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      rateIn.disabled = billing.type === 'general';
      body.querySelector('#le-earn').textContent = billing.type === 'general' ? 'Non-billable' : fmt(Math.max(0, Draft.earnings(d)));
      const issues = Draft.issues(d);
      if (Money.parsePence(rate) === null && billing.type !== 'general') issues.push('Enter an hourly rate.');
      body.querySelector('#le-issues').innerHTML = issues.length ? `<div class="group" style="margin-top:20px">${issues.map(i => `<div class="row" style="color:var(--orange-t)">⚠️ ${esc(i)}</div>`).join('')}</div>` : '';
      ov.querySelector('[data-save]').disabled = issues.length > 0;
    }
    ov.refresh = () => { fillJobs(); update(); };
    update();

    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    if (log) body.querySelector('#le-del').onclick = () => confirmDeleteLog(log, () => closeOverlay(ov));
    ov.querySelector('[data-save]').onclick = () => {
      const d = draft();
      if (billing.type === 'general') d.ratePence = Math.max(0, d.ratePence);
      if (Draft.issues(d).length) return;
      const job = billing.type === 'job' ? jobById(billing.id) : null;
      const target = log || { id: uid(), isManual: true, editedAt: null };
      let worked = d.workedSeconds, brk = d.breakSeconds;
      if (log) {   // keep seconds the steppers can't show, unless the minutes were changed
        if (worked === Math.floor(log.workedSeconds / 60) * 60) worked = log.workedSeconds;
        if (brk === Math.floor(log.breakSeconds / 60) * 60) brk = log.breakSeconds;
        target.editedAt = Date.now();
      }
      target.start = d.start;
      target.end = d.start + (worked + brk) * 1000;
      target.workedSeconds = worked; target.breakSeconds = brk; target.ratePence = d.ratePence; target.notes = notes.trim();
      if (billing.type === 'general') { target.jobId = null; target.isBillable = false; target.customerNameSnapshot = GENERAL; }
      else if (billing.type === 'job') { if (job) { target.jobId = job.id; target.customerNameSnapshot = job.customerName; } target.isBillable = true; }
      else { target.jobId = null; target.isBillable = true; target.customerNameSnapshot = billing.name; }

  // =========================================================================================
  const PHOTO_LIMIT = 4;
  let photoDbPromise = null;
  function photoDb() {
    if (!photoDbPromise) photoDbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('Photo storage is not available')); return; }
      const r = indexedDB.open('tm3_photos', 1);
      r.onupgradeneeded = () => { const st = r.result.createObjectStore('photos', { keyPath: 'id' }); st.createIndex('jobId', 'jobId'); };
      r.onsuccess = () => resolve(r.result);

  }

    return new Promise((resolve, reject) => {

      if (req) req.onsuccess = () => { result = req.result; };

    try {
      const all = await idbTx('readonly', st => st.getAll()) || [];
      PH.byJob.clear();
      all.forEach(r => { if (!PH.byJob.has(r.jobId)) PH.byJob.set(r.jobId, []); PH.byJob.get(r.jobId).push(r); });
    } catch (e) { /* photos unavailable (private browsing) */ }
  }
  // Shrinks a camera photo to at most 1600 px on its longest side, saved as JPEG
  function resizeImage(file, max = 1600) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't read that photo")), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't read that photo")); };
      img.src = url;

  async function addPhoto(jobId, kind, file) {
    const blob = await resizeImage(file);
    const rec = { id: uid(), jobId, kind, ts: Date.now(), blob };

    if (!PH.byJob.has(jobId)) PH.byJob.set(jobId, []);
    PH.byJob.get(jobId).push(rec);
    return rec;
  }
  async function deletePhoto(rec) {
    await idbTx('readwrite', st => st.delete(rec.id));
    PH.byJob.set(rec.jobId, (PH.byJob.get(rec.jobId) || []).filter(r => r.id !== rec.id));
    const u = PH.urls.get(rec.id); if (u) { URL.revokeObjectURL(u); PH.urls.delete(rec.id); }
  }
  async function deletePhotosForJob(jobId) {
    for (const r of [...(PH.byJob.get(jobId) || [])]) { try { await deletePhoto(r); } catch (e) { /* keep going */ } }
    PH.byJob.delete(jobId);
  }

  // Full-screen photo viewer: swipe or use the arrows; Delete only where editing is allowed
  function openViewer(list, index, onDelete) {
    if (!list.length) return;
    let i = Math.max(0, Math.min(index, list.length - 1));
    const v = document.createElement('div');
    v.className = 'viewer';
    v.innerHTML = `<div class="vbar"><button class="vbtn" data-close aria-label="Close">✕</button><span class="vcount"></span>
      ${onDelete ? '<button class="vbtn vdel" data-del>Delete</button>' : '<span style="width:64px"></span>'}</div>
      <div class="vstage"><img alt=""><button class="varrow l" data-prev aria-label="Previous photo">‹</button><button class="varrow r" data-next aria-label="Next photo">›</button></div>
      <div class="vcap"></div>`;
    document.body.appendChild(v);
    const img = v.querySelector('img');
    const show = () => {
      const rec = list[i];
      img.src = photoUrl(rec);
      v.querySelector('.vcount').textContent = list.length > 1 ? `${i + 1} of ${list.length}` : '';
      v.querySelector('.vcap').textContent = `${rec.kind === 'after' ? 'After' : 'Before'} · ${sheetDate(rec.ts)}`;
      v.querySelector('[data-prev]').style.visibility = i > 0 ? 'visible' : 'hidden';
      v.querySelector('[data-next]').style.visibility = i < list.length - 1 ? 'visible' : 'hidden';
    };
    const close = () => v.remove();
    v.querySelector('[data-close]').onclick = close;
    v.querySelector('[data-prev]').onclick = () => { if (i > 0) { i--; show(); } };
    v.querySelector('[data-next]').onclick = () => { if (i < list.length - 1) { i++; show(); } };
    let x0 = null;
    v.querySelector('.vstage').addEventListener('touchstart', e => { x0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    v.querySelector('.vstage').addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (dx < -50 && i < list.length - 1) { i++; show(); } else if (dx > 50 && i > 0) { i--; show(); }
    });
    if (onDelete) v.querySelector('[data-del]').onclick = () => actionSheet('Delete this photo?', "This can't be undone.", [
      { label: 'Delete photo', role: 'destructive', action: async () => {
        const rec = list[i];
        try { await onDelete(rec); } catch (e) { toast("Couldn't delete the photo"); return; }
        list.splice(i, 1);
        if (!list.length) { close(); return; }
        i = Math.min(i, list.length - 1); show();
      } },
      { label: 'Cancel', role: 'cancel' }]);
    show();
  }

  // Thumbnails for a job card (read-only); tap to view full screen
  function photoStrip(j) {
    const kinds = ['before', 'after'].filter(k => photosOf(j.id, k).length);
    if (!kinds.length) return '';
    return `<div class="phstrip">${kinds.map(k => `<div class="phkind"><span class="phk">${k === 'before' ? 'Before' : 'After'}</span>
      ${photosOf(j.id, k).map((r, i) => `<button type="button" class="phthumb" data-view="${esc(j.id)}|${k}|${i}" aria-label="${k} photo ${i + 1}"><img src="${photoUrl(r)}" alt=""></button>`).join('')}</div>`).join('')}</div>`;
  }
  function bindPhotoViews(container) {
    container.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {

  // =========================================================================================
  // MAP — show my location (blue dot)
  // =========================================================================================
  let locWatch = null, meDot = null, meRing = null, lastFix = null;
  function showMe(ll, acc) {
    if (!jobMap) return;
    if (!meRing) meRing = L.circle(ll, { radius: acc, color: '#007aff', weight: 1, fillColor: '#007aff', fillOpacity: 0.12, interactive: false }).addTo(jobMap);
    else { meRing.setLatLng(ll); meRing.setRadius(acc); }
    if (!meDot) meDot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#007aff', fillOpacity: 1, interactive: false }).addTo(jobMap);
    else meDot.setLatLng(ll);
  }
  function stopLocating() {
    try { if (locWatch !== null) navigator.geolocation.clearWatch(locWatch); } catch (e) { /* ignore */ }
    locWatch = null;
    if (jobMap) { if (meDot) jobMap.removeLayer(meDot); if (meRing) jobMap.removeLayer(meRing); }
    meDot = meRing = lastFix = null;
    const b = $('locbtn'); if (b) { b.classList.remove('on'); b.classList.remove('busy'); }
  }
  // First tap: find you and zoom in. Later taps: jump back to you.
  function locateMe() {
    if (!jobMap) { toast("The map isn't ready yet"); return; }
    if (!navigator.geolocation) { toast("Location isn't available on this device"); return; }
    const btn = $('locbtn');
    if (locWatch !== null) { if (lastFix) jobMap.setView(lastFix, Math.max(jobMap.getZoom(), 17)); return; }
    btn.classList.add('busy');
    let first = true;
    try {
      locWatch = navigator.geolocation.watchPosition(pos => {
        const ll = [pos.coords.latitude, pos.coords.longitude];
        lastFix = ll;
        showMe(ll, pos.coords.accuracy);
        if (selectedMapJob) renderMapCard();   // update the distance on the open card
        if (first) { first = false; jobMap.setView(ll, 17); btn.classList.remove('busy'); btn.classList.add('on'); }
      }, err => {
        stopLocating();
        toast(err.code === 1
          ? 'Location is off for this site. Turn it on in iPhone Settings > Privacy & Security > Location Services > Safari Websites.'
          : "Couldn't get your location. Check your signal and try again.");
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    } catch (e) { stopLocating(); toast("Couldn't get your location on this device"); }
  }

  let markBytes = null;
  function markJpeg() {
    if (!markBytes) { const bin = atob(MARK_JPEG_B64); markBytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) markBytes[i] = bin.charCodeAt(i); }
    return markBytes;
  }
  const sheetDate = ms => { const d = new Date(ms); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
  const moneyPdf = p => Money.format(p, cur());

  /** Profit / loss wording shared by the preview and the PDF. */
  function varianceInfo(b) {
    if (b.variancePence === null) return { tag: 'NO QUOTE', value: '—', note: 'set a quoted price to compare', state: 'none' };
    if (b.variancePence > 0) return { tag: 'PROFIT', value: Money.formatSigned(b.variancePence, cur()), note: `${Money.percent(Math.abs(b.varianceBasisPoints))} under quote`, state: 'profit' };
    if (b.variancePence < 0) return { tag: 'LOSS', value: Money.formatSigned(b.variancePence, cur()), note: `${Money.percent(Math.abs(b.varianceBasisPoints))} over quote`, state: 'loss' };
    return { tag: 'ON QUOTE', value: Money.formatSigned(0, cur()), note: 'labour exactly on quote', state: 'even' };
  }

  async function buildJobPdf(job, logs, b) {
    const ops = [], images = [];
    const M = 34, W = PDF_W - 2 * M;
    const GREY = [102, 102, 102], BLUE = [27, 54, 93], INK = [17, 17, 17], EDGE = [190, 190, 197], SHADE = [243, 243, 248];
    const VAR_RED = [196, 32, 32], VAR_GREEN = [28, 128, 60], TINT_RED = [253, 236, 236], TINT_GREEN = [232, 246, 236];
    const Y = y => (PDF_H - y).toFixed(2), f = n => Number(n).toFixed(2);
    const hex = s => '<' + pdfWinAnsi(s).map(v => v.toString(16).padStart(2, '0')).join('') + '>';
    const col = (rgb, stroke) => rgb.map(v => (v / 255).toFixed(3)).join(' ') + (stroke ? ' RG' : ' rg');
    const text = (x, base, s, size, bold, rgb) => { ops.push(`BT ${col(rgb || INK)} /${bold ? 'F2' : 'F1'} ${size} Tf ${f(x)} ${Y(base)} Td ${hex(s)} Tj ET`); };
    const box = (x, top, w, h, fill, stroke, lw) => {
      ops.push(`q ${fill ? col(fill) + ' ' : ''}${stroke ? col(stroke, true) + ' ' + (lw || 0.5) + ' w ' : ''}${f(x)} ${Y(top + h)} ${f(w)} ${f(h)} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'} Q`);
    };
    const hline = (x1, x2, top, rgb, lw) => { ops.push(`q ${col(rgb, true)} ${lw} w ${f(x1)} ${Y(top)} m ${f(x2)} ${Y(top)} l S Q`); };
    const tw = pdfWidth;
    const fit = (s, maxW, size, bold) => {
      s = String(s || '');
      if (tw(s, size, bold) <= maxW) return s;
      while (s.length > 1 && tw(s + '…', size, bold) > maxW) s = s.slice(0, -1);
      return s + '…';
    };
    const wrap = (s, maxW, size, bold, maxLines) => {
      const lines = [];
      for (const para of String(s || '').split(/\r?\n/)) {
        let line = '';
        for (let word of para.split(/\s+/).filter(Boolean)) {
          while (tw(word, size, bold) > maxW) {
            let k = word.length;
            while (k > 1 && tw(word.slice(0, k), size, bold) > maxW) k--;
            if (line) { lines.push(line); line = ''; }
            lines.push(word.slice(0, k)); word = word.slice(k);
          }
          const t = line ? line + ' ' + word : word;
          if (tw(t, size, bold) <= maxW) line = t; else { lines.push(line); line = word; }
        }
        lines.push(line);
      }
      if (maxLines && lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = fit(lines[maxLines - 1] + '…', maxW, size, bold); }
      return lines.length ? lines : [''];
    };
    const heading = (x, y, w, s) => { text(x, y + 9, s, 8.5, true); hline(x, x + w, y + 13, INK, 1); };

    // Header
    let y = M;
    const mark = markJpeg(), inf = jpegInfo(mark);
    if (inf) { images.push({ bytes: mark, w: inf.w, h: inf.h, comps: inf.comps }); ops.push(`q 26 0 0 26 ${f(M)} ${Y(y + 26)} cm /Im${images.length} Do Q`); }
    text(M + 33, y + 13, fit(brandName(), W * 0.55, 15, true), 15, true, BLUE);
    text(M + 33, y + 25, 'Job sheet' + (jobNo(job) ? '  ·  Job ' + jobNo(job) : ''), 8.5, false, GREY);
    const printed = 'Printed ' + sheetDate(Date.now());
    text(PDF_W - M - tw(printed, 8.5, false), y + 13, printed, 8.5, false, GREY);
    hline(M, PDF_W - M, y + 31, BLUE, 2);
    y += 42;
    text(M, y + 15, fit(job.customerName, W, 19, true), 19, true);
    y += 22;
    text(M, y + 11, fit(job.jobDescription, W, 11.5, true), 11.5, true, BLUE);
    y += 19;

    // Customer details
    const LW = 112, dash = '—';
    const info = [
      ['Status', statusLabel(job.status)], ['Phone', job.phone || dash], ['Email', job.email || dash], ['Address', job.address || dash],
      ...(hasDeposit(job) ? [['Deposit paid', moneyPdf(job.depositPence) + (job.depositDate ? ' on ' + longDay(job.depositDate) : '')],
                             ...(balanceOf(job) !== null ? [['Balance to pay', moneyPdf(balanceOf(job))]] : [])] : []),
      ...(job.meetingDate ? [['Meeting', longWhen(job, 'meetingDate') + (job.meetingNote ? ' – ' + job.meetingNote : '')]] : []),
      [kindOf(job, 'collectionDate').long, job.collectionDate ? longWhen(job, 'collectionDate') : dash],
      [kindOf(job, 'deliveryDate').long, job.deliveryDate ? longWhen(job, 'deliveryDate') : dash],
      ['Notes / job spec', job.notes || dash]
    ];
    info.forEach(([k, v], i) => {
      const lines = wrap(v, W - LW - 12, 9, i === 0, k.startsWith('Notes') ? 4 : 2);
      const labels = wrap(k, LW - 12, 8.5, true, 2);          // long labels wrap inside their own column
      const h = Math.max(lines.length, labels.length) * 11.5 + 6;
      box(M, y, LW, h, SHADE, EDGE);
      box(M + LW, y, W - LW, h, null, EDGE);
      labels.forEach((ln, j) => text(M + 6, y + 12 + j * 11.5, ln, 8.5, true));
      lines.forEach((ln, j) => text(M + LW + 6, y + 12 + j * 11.5, ln, 9, i === 0 || k === 'Balance to pay'));
      y += h;
    });
    y += 12;

    // Time logged
    heading(M, y, W, 'TIME LOGGED');
    y += 19;
    const cols = [{ t: 'Date', w: 88 }, { t: 'Hours', w: 50, r: 1 }, { t: 'Break', w: 56, r: 1 }, { t: 'Notes', w: W - 194 }];
    const cell = (i, x, top, h, s, bold, fill) => {
      const cc = cols[i];
      box(x, top, cc.w, h, fill || null, EDGE);
      const t = fit(s, cc.w - 10, 8.5, bold);
      text(cc.r ? x + cc.w - 5 - tw(t, 8.5, bold) : x + 5, top + 10.5, t, 8.5, bold);
    };
    const rowOf = (vals, top, bold, fill) => { let x = M; vals.forEach((v, i) => { cell(i, x, top, 15, v, bold, fill); x += cols[i].w; }); };
    if (logs.length) {
      rowOf(cols.map(cc => cc.t), y, true, SHADE); y += 15;
      const MAXROWS = photoCount(job.id) ? 8 : 16, shown = logs.slice(-MAXROWS), hidden = logs.length - shown.length;
      if (hidden > 0) { text(M + 5, y + 10.5, `… ${hidden} earlier ${hidden === 1 ? 'entry' : 'entries'} not listed (included in the total)`, 8, false, GREY); y += 15; }
      shown.forEach(l => { rowOf([sheetDate(l.start), Duration.decimalHours(l.workedSeconds), Math.round(l.breakSeconds / 60) + ' min', l.notes || ''], y, false); y += 15; });
      rowOf(['Total', Duration.decimalHours(logs.reduce((s, l) => s + l.workedSeconds, 0)), '', ''], y, true, SHADE); y += 15;
    } else {
      text(M, y + 9, 'No time logged for this job yet.', 9, false, GREY); y += 14;
    }

    // Quote vs actual: quoted price, labour recorded (at each entry's saved rate), variance
    const v = varianceInfo(b);
    const vRgb = v.state === 'loss' ? VAR_RED : v.state === 'profit' ? VAR_GREEN : INK;
    const vFill = v.state === 'loss' ? TINT_RED : v.state === 'profit' ? TINT_GREEN : SHADE;
    const bw = (W - 12) / 3, bh = 44;
    y += 8;
    [
      { k: 'QUOTED PRICE (REVENUE)', v: b.quotePence === null ? 'Not set' : moneyPdf(b.quotePence), s: 'agreed with customer', rgb: b.quotePence === null ? GREY : INK },
      { k: 'LABOUR RECORDED', v: moneyPdf(b.recordedLaborPence), s: Duration.decimalHours(b.workedSeconds) + ' hrs logged', rgb: INK },
      { k: 'VARIANCE · ' + v.tag, v: v.value, s: v.note, rgb: vRgb, fill: vFill, edge: v.state === 'loss' || v.state === 'profit' ? vRgb : null }
    ].forEach((c, i) => {
      const x = M + i * (bw + 6);
      box(x, y, bw, bh, c.fill || SHADE, c.edge || EDGE, c.edge ? 1.2 : 0.5);
      text(x + 8, y + 12, c.k, 7, true, c.edge || GREY);
      text(x + 8, y + 29, fit(c.v, bw - 16, 15, true), 15, true, c.rgb);
      text(x + 8, y + 39, fit(c.s, bw - 16, 7, false), 7, false, GREY);
    });
    y += bh + 12;

    // Rate history and time budget
    if (b.rateHistory.length) {
      heading(M, y, W, 'RATE HISTORY');
      y += 19;
      b.rateHistory.forEach(l => {
        text(M, y + 9, `${moneyPdf(l.ratePence)}/hr`, 9, false);
        const hrs = Duration.decimalHours(l.workedSeconds) + ' h', amt = moneyPdf(l.laborPence);
        text(M + 180 - tw(hrs, 9, false), y + 9, hrs, 9, false, GREY);
        text(M + 290 - tw(amt, 9, false), y + 9, amt, 9, false);
        y += 13;
      });
      text(M, y + 8, 'Each time entry keeps the rate it was charged at.', 7.5, false, GREY);
      y += 16;
    }
    const facts = [];
    if (b.jobRatePence !== null) facts.push(`Current job rate ${moneyPdf(b.jobRatePence)}/hr`);
    if (b.allowanceSeconds !== null) facts.push(`Time allowance ${Duration.decimalHours(b.allowanceSeconds)} h`);
    facts.push(`Time used ${Duration.decimalHours(b.workedSeconds)} h`);
    if (b.remainingSeconds !== null) facts.push(b.remainingSeconds >= 0 ? `${Duration.short(b.remainingSeconds)} remaining` : `Over by ${Duration.short(b.remainingSeconds)}`);
    if (b.usedBasisPoints !== null) facts.push(`${Money.percent(b.usedBasisPoints)} of budget used`);
    text(M, y + 9, fit(facts.join('   ·   '), W, 8.5, false), 8.5, false, GREY);
    y += 20;

    // Before / After photos, sized to fit the space left on the page
    const photosBottom = PDF_H - M;   // the photos use the rest of the page (no workshop-notes box any more)
    const GAP_COL = 14, colW = (W - GAP_COL) / 2, photoTop = y + 20, avail = Math.max(40, photosBottom - 16 - photoTop), g = 5;
    const grid = n => {
      let best = null;
      for (let cs = 1; cs <= 4; cs++) {
        const cw = (colW - (cs - 1) * g) / cs, rows = Math.ceil(n / cs);
        const ch = Math.min(cw * 0.8, (avail - (rows - 1) * g) / rows);
        if (ch < cw * 0.5) continue;
        if (!best || cw * ch > best.area) best = { cs, cw, ch, cap: n, area: cw * ch };
      }
      if (best) return best;
      const cw = (colW - 3 * g) / 4, ch = cw * 0.75;
      return { cs: 4, cw, ch, cap: Math.max(1, Math.floor((avail + g) / (ch + g))) * 4 };
    };
    for (let k = 0; k < 2; k++) {
      const kind = k === 0 ? 'before' : 'after', x0 = M + k * (colW + GAP_COL);
      heading(x0, y, colW, kind.toUpperCase());
      const items = [];
      for (const r of photosOf(job.id, kind)) {
        try {
          const bytes = new Uint8Array(await r.blob.arrayBuffer());
          const info = jpegInfo(bytes);
          if (info) items.push({ bytes, w: info.w, h: info.h, comps: info.comps });
        } catch (e) { /* skip unreadable photo */ }
      }
      if (!items.length) { text(x0, photoTop + 9, 'No photos', 9, false, GREY); continue; }
      const L2 = grid(items.length);
      items.slice(0, L2.cap).forEach((it, i) => {
        const x = x0 + (i % L2.cs) * (L2.cw + g), top = photoTop + Math.floor(i / L2.cs) * (L2.ch + g);
        box(x, top, L2.cw, L2.ch, SHADE, EDGE, 0.5);
        const sc = Math.min((L2.cw - 2) / it.w, (L2.ch - 2) / it.h), dw = it.w * sc, dh = it.h * sc;
        images.push(it);
        ops.push(`q ${f(dw)} 0 0 ${f(dh)} ${f(x + (L2.cw - dw) / 2)} ${Y(top + (L2.ch - dh) / 2 + dh)} cm /Im${images.length} Do Q`);
      });
      if (items.length > L2.cap) {
        const rows = Math.ceil(L2.cap / L2.cs);
        text(x0, photoTop + rows * (L2.ch + g) + 8, `+ ${items.length - L2.cap} more photo${items.length - L2.cap === 1 ? '' : 's'} in the app`, 8, false, GREY);
      }
    }


    // Assemble the PDF
    const enc = new TextEncoder();
    const chunks = [new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2D, 0x31, 0x2E, 0x34, 0x0A, 0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A])];
    let offset = chunks[0].length;
    const offsets = [];
    const push = d => { const u = typeof d === 'string' ? enc.encode(d) : d; chunks.push(u); offset += u.length; };
    const obj = (n, parts) => { offsets[n] = offset; push(`${n} 0 obj\n`); parts.forEach(push); push('\nendobj\n'); };
    const content = enc.encode(ops.join('\n'));
    const imgRefs = images.map((_, i) => `/Im${i + 1} ${7 + i} 0 R`).join(' ');
    obj(1, ['<< /Type /Catalog /Pages 2 0 R >>']);
    obj(2, ['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
    obj(3, [`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PDF_W} ${PDF_H}] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> /XObject << ${imgRefs} >> >> /Contents 6 0 R >>`]);
    obj(4, ['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
    obj(5, ['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>']);
    obj(6, [`<< /Length ${content.length} >>\nstream\n`, content, '\nendstream']);
    images.forEach((im, i) => {
      const cs = im.comps === 1 ? '/DeviceGray' : im.comps === 4 ? '/DeviceCMYK' : '/DeviceRGB';
      obj(7 + i, [`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace ${cs} /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`, im.bytes, '\nendstream']);
    });
    const total = 7 + images.length;
    const xref = offset;
    push(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let n = 1; n < total; n++) push(String(offsets[n]).padStart(10, '0') + ' 00000 n \n');
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  function openJobDetail(id) {
    const ov = pushOverlay('page');
    function render() {
      const j = jobById(id);
      if (!j) { closeOverlay(ov); return; }
      const info = forecastInfo()[j.id] || { workedSeconds: 0, laborPence: 0 };
      const tel = phoneUrl(j.phone), sms = tel ? tel.replace('tel:', 'sms:') : null, dir = directionsUrl(j);
      const act = (href, icon, label, extra = '') => href
        ? `<a class="dact" href="${esc(href)}" ${extra}>${icon}<span>${label}</span></a>`
        : `<span class="dact off" aria-disabled="true">${icon}<span>${label}</span></span>`;
      // progress: Booked → Collected → In progress → Delivered
      const enq = isEnquiry(j), done = j.status === 'Completed';
      const steps = [
        ['Booked', !enq],
        [j.collectionDate ? kindOf(j, 'collectionDate').done : 'Started', j.collectionDate ? isDone(j, 'collectionDate') : (j.status === 'In Progress' || done)],
        ['In progress', done || !!j.readyAt || (j.deliveryDate && isDone(j, 'deliveryDate'))],
        ['Ready', done || !!j.readyAt || (j.deliveryDate ? isDone(j, 'deliveryDate') : false)],
        [j.deliveryDate ? kindOf(j, 'deliveryDate').done : 'Completed', done || (j.deliveryDate ? isDone(j, 'deliveryDate') : false)]];
      for (let k = 1; k < steps.length; k++) steps[k][1] = steps[k][1] && steps[k - 1][1];
      let nowIdx = steps.findIndex(x => !x[1]);
      // the one next action, in order: collect → start → ready → deliver → complete
      const hasCol = !!j.collectionDate, colDone = hasCol && isDone(j, 'collectionDate'), hasDel = !!j.deliveryDate, delDone = hasDel && isDone(j, 'deliveryDate');
      let next = null;
      if (!enq && !done) {
        if (hasCol && !colDone) next = { key: 'collect', label: kindOf(j, 'collectionDate').mark };
        else if (j.status === 'New') next = { key: 'start', label: 'Start job' };
        else if (!j.readyAt) next = { key: 'ready', label: 'Mark as ready' };
        else if (hasDel && !delDone) next = { key: 'deliver', label: kindOf(j, 'deliveryDate').mark };
        else next = { key: 'complete', label: 'Mark job as completed' };
      }
      const stepper = steps.map(([label, ok], k) => `<div class="dstep ${ok ? 'ok' : k === nowIdx ? 'now' : ''}"><div class="dot">${ok ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ''}</div><span>${esc(label)}</span></div>`).join('');
      // money
      const q = j.quotePence, dep = j.depositPence > 0 ? j.depositPence : 0, fixed = Income.pricing(j) === 'fixed';
      const balance = q !== null && q !== undefined ? Math.max(0, q - dep) : null;
      const moneyCell = (k, v, sub, cls = '') => `<div class="dm"><div class="k">${k}</div><div class="v ${cls}">${v}</div><div class="s">${sub}</div></div>`;
      // time vs quote
      const allow = q !== null && q !== undefined && j.ratePence > 0 ? Money.allowanceSeconds(q, j.ratePence) : 0;
      const worked = info.workedSeconds || 0, pct = allow ? Math.min(100, Math.round(worked / allow * 100)) : 0;
      const rateSoFar = q !== null && q !== undefined && worked > 0 ? Income.rate(q, worked) : null;
      // dates
      const dates = dateFields(j).filter(([f]) => j[f]).map(([f, k]) => {
        const ok = isDone(j, f), diff = dayDiff(j[f]);
        const note = ok ? 'Done' : diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff < 0 ? `${-diff} day${diff === -1 ? '' : 's'} overdue` : `In ${diff} days`;
        return `<div class="ddate"><div class="ddi" style="color:${tileColor(ok, diff)}">${k.svg}</div><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(ok ? k.done : k.short)}</div>
          <div class="hint">${esc(ok ? doneParts(j, f).actual : shortWhen(j, f))}</div></div><span class="dstat ${ok ? 'ok' : diff < 0 ? 'late' : diff <= 1 ? 'soon' : ''}">${note}</span></div>`;
      }).join('');
      const photos = ['before', 'after'].flatMap(kind => photosOf(j.id, kind).map((r, i) => ({ r, i, kind })));
      ov.querySelector('.title').textContent = jobNo(j) ? 'Job ' + jobNo(j) : (enq ? 'Enquiry' : 'Job');
      ov.querySelector('.body').innerHTML = `
        <div class="dhead"><div class="av" style="width:58px;height:58px;font-size:19px;background:${avatarColor(j.customerName)}" aria-hidden="true">${esc(initials(j.customerName))}</div>
          <div style="flex:1;min-width:0"><h1 class="dname">${esc(j.customerName)}</h1><div class="hint" style="font-size:14.5px">${esc(j.jobDescription)}</div></div></div>
        <div class="dacts">${act(tel, '<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3.5l1.5 4.5-2 1.5a11 11 0 0 0 6 6l1.5-2L20 15.5V19a1.5 1.5 0 0 1-1.6 1.5C10.5 20 4 13.5 3.5 5.6A1.5 1.5 0 0 1 5 4z"/></svg>', 'Call')}${act(sms, '<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5z"/></svg>', 'Message')}${act(dir, '<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>', 'Directions', 'target="_blank" rel="noopener"')}
          <button type="button" class="dact" data-dsheet><svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Job sheet</span></button></div>
        ${enq ? '' : `<div class="card"><div class="cap" style="margin-bottom:12px">Progress</div><div class="dsteps">${stepper}</div>
          ${!done && j.readyAt ? `<div class="dready">Ready since ${esc(prettyDay(isoOf(j.readyAt)))}, ${esc(hhmm(j.readyAt))}${next && next.key !== 'deliver' && next.key !== 'complete' ? '' : '<button type="button" class="minilink" data-dunready>Undo</button>'}</div>` : ''}
          ${next ? `<button type="button" class="btn ${next.key === 'complete' ? 'prim' : 'tint'} small" style="width:100%;margin-top:14px" data-dnext="${next.key}"><svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg> ${esc(next.label)}</button>` : ''}</div>`}
        <div class="card"><div class="dmoney">${moneyCell(fixed ? 'Quote' : 'Estimate', q !== null && q !== undefined ? esc(fmt(q)) : '—', fixed ? 'fixed price' : 'hourly')}
          ${moneyCell('Deposit', dep ? esc(fmt(dep)) : '—', dep ? (j.depositDate ? 'paid ' + esc(prettyDay(j.depositDate)) : 'paid') : 'none', dep ? 'good' : '')}
          ${moneyCell('Balance', balance !== null ? esc(fmt(balance)) : '—', !done ? 'due on delivery' : !balance ? 'nothing to pay' : j.paidAt ? 'paid' : 'awaiting payment', done && balance && j.paidAt ? 'good' : done && balance ? 'warn' : '')}</div>
          ${done && balance ? (j.paidAt ? `<div class="dready">Paid ${esc(prettyDay(isoOf(j.paidAt)))}<button type="button" class="minilink" data-dunpaid>Undo</button></div>`
            : `<button type="button" class="btn prim small" style="width:100%;margin-top:14px" data-dpaid><svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg> Mark as paid</button>`) : ''}</div>
        ${allow ? `<div class="card"><div class="cap">Time vs quote</div>
          <div style="display:flex;align-items:baseline;gap:8px;margin:10px 0"><span class="dbig">${Duration.decimalHours(worked)} h</span><span class="hint">of ${Duration.decimalHours(allow)} h the quote covers</span></div>
          <div class="jbud-b" style="height:8px"><div style="width:${pct}%;${worked > allow ? 'background:#E5484D' : ''}"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px"><span style="font-weight:700;color:${worked > allow ? 'var(--red)' : 'var(--green-t)'}">${worked > allow ? 'Over the quote' : 'On track'}${rateSoFar !== null ? ' · ' + esc(fmt(rateSoFar)) + '/hr so far' : ''}</span>
          <span class="hint">${worked > allow ? Duration.decimalHours(worked - allow) + ' h over' : Duration.decimalHours(allow - worked) + ' h left'}</span></div></div>` : ''}
        ${dates ? `<div class="card"><div class="cap">Dates</div>${dates}</div>` : ''}
        ${j.address ? `<div class="card"><div class="cap">Address</div><div style="margin-top:8px">${esc(j.address)}</div></div>` : ''}
        ${j.notes ? `<div class="card"><div class="cap">Notes / job spec</div><div style="margin-top:8px;white-space:pre-wrap">${esc(j.notes)}</div></div>` : ''}
        <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="cap">Photos</div><button type="button" class="btn tint small" data-dphoto><svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg> Add</button></div>${photos.length ? `<div class="dphotos">${photos.map(p => `<button type="button" class="ps-ph dph" data-view="${esc(j.id)}|${p.kind}|${p.i}" aria-label="${p.kind === 'before' ? 'Before' : 'After'} photo"><img src="${photoUrl(p.r)}" alt=""><span>${p.kind === 'before' ? 'Before' : 'After'}</span></button>`).join('')}</div>`
          : '<div class="hint" style="margin-top:8px">No photos yet.</div>'}</div>`;
      ov.querySelector('[data-dsheet]').onclick = () => openJobSheet(j.id);
      const nx = ov.querySelector('[data-dnext]'); if (nx) nx.onclick = () => {
        const k = nx.dataset.dnext;
        if (k === 'collect') { markDone(j.id, 'collectionDate'); return; }
        if (k === 'deliver') { markDone(j.id, 'deliveryDate'); return; }
        if (k === 'start') { j.status = 'In Progress'; toast(`${j.customerName}: job started`); }
        if (k === 'ready') { j.readyAt = Date.now(); toast(`${j.customerName}: ready`); }
        if (k === 'complete') { j.status = 'Completed'; j.completedAt = Date.now(); toast(`${j.customerName}: job completed`); }
        saveAll(); refreshAll();
      };
      const ur = ov.querySelector('[data-dunready]'); if (ur) ur.onclick = () => { j.readyAt = null; saveAll(); refreshAll(); toast('Ready mark removed'); };
      const pd = ov.querySelector('[data-dpaid]'); if (pd) pd.onclick = () => { j.paidAt = Date.now(); saveAll(); refreshAll(); toast(`${j.customerName}: marked as paid`); };
      const up = ov.querySelector('[data-dunpaid]'); if (up) up.onclick = () => { j.paidAt = null; saveAll(); refreshAll(); toast('Payment mark removed'); };
      ov.querySelector('[data-dphoto]').onclick = () => {
        openJobEditor(j.id);
        setTimeout(() => {   // open "More details" if needed and bring the photos into view
          const more = document.querySelector('#je-more'); if (more && more.style.display === 'none') { const b = document.querySelector('#je-more-btn'); if (b) b.click(); }
          const ph = document.querySelector('[data-add=before]'); if (ph) ph.scrollIntoView({ block: 'center', behavior: 'smooth' });

    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    ov.querySelector('[data-edit]').onclick = () => openJobEditor(id);
    ov.refresh = render;
    render();
  }

  requestPersistentStorage();
  registerOfflineSupport();
  applyTheme();
  renderTimer();
  renderJobs();
  renderAccount();
  loadPhotos().then(() => { renderJobList(); renderAccount(); });   // Account shows photo storage, so redraw it once photos have loaded
  setInterval(renderTimerDynamic, 1000);
  if (!S.settings.privacyNoticeSeen) {
    // First launch: the quick guide (its last step is the privacy notice). Marked as seen straight
    // away, so a reload part-way through can't bring it back; it can be reopened from Account.
    S.settings.privacyNoticeSeen = true;
    saveAll();
    setTimeout(openGuide, 400);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { renderTimerDynamic(); return; }
    if (typeof locWatch !== 'undefined' && locWatch !== null) stopLocating();   // stop GPS use once the page is hidden
  });
  window.addEventListener('pagehide', () => { if (typeof locWatch !== 'undefined' && locWatch !== null) stopLocating(); });
})();

</script>
</body>
</html>
