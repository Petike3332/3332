<style>
:root {
  color-scheme: light dark;
  --bg: #f2f2f7; --card: #ffffff; --card2: #f2f2f7; --text: #000; --sub: #6e6e73; --faint: #aeaeb2;
  --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.2);
  --accent: #1B365D; --link: #1f5fbf; --green: #34c759; --green-t: #1f8a3b; --orange: #ff9500; --orange-t: #b86a00;
  --red: #ff3b30; --blue: #007aff; --nav: rgba(249,249,249,.88);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --text: #fff; --sub: #98989f; --faint: #636366;
    --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.32);
    --accent: #7aa2d9; --link: #64a0ff; --green-t: #4fd98a; --orange-t: #ffb340; --nav: rgba(22,22,23,.88);
  }
}
:root[data-theme="dark"] {
  --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --text: #fff; --sub: #98989f; --faint: #636366;
  --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.32);
  --accent: #7aa2d9; --link: #64a0ff; --green-t: #4fd98a; --orange-t: #ffb340; --nav: rgba(22,22,23,.88);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* Tabs */
.tab { position: fixed; inset: 0 0 calc(56px + var(--safe-b)) 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: var(--safe-t); display: none; }
.tab.active { display: block; }
#tab-map.tab { overflow: hidden; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .3px; margin: 12px 16px 8px; }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(56px + var(--safe-b)); padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--nav); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-top: .5px solid var(--sep); z-index: 50; }
#tabbar button { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 500; }
#tabbar button.on { color: var(--accent); }
#tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Grouped lists */
.sh { font-size: 13px; color: var(--sub); text-transform: uppercase; margin: 22px 32px 7px; letter-spacing: .2px; }
.sf { font-size: 13px; color: var(--sub); margin: 7px 32px 0; line-height: 1.35; }
.group { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 11px 16px;
  position: relative; }
.row + .row::before, #je-clients + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row .v { color: var(--sub); text-align: right; }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--fill); }
.chev::after { content: "›"; color: var(--faint); font-size: 22px; margin-left: 6px; line-height: 1; }
.row input[type=text], .row input[type=tel], .row input[type=email], .row input[type=search], .row input.inp, .row textarea, .row select {
  border: 0; background: transparent; outline: none; width: 100%; padding: 0; }
.row input.right { text-align: right; }
.row select { -webkit-appearance: none; appearance: none; text-align: right; color: var(--link); }
.row textarea { resize: none; min-height: 70px; }
.row.btnrow { justify-content: flex-start; color: var(--link); gap: 10px; }
.row.danger { color: var(--red); justify-content: center; }
.hint { font-size: 13px; color: var(--sub); }
.muted { color: var(--sub); }
.pad { padding: 16px; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 0;
  border-radius: 12px; font-weight: 600; font-size: 17px; cursor: pointer; }
.btn:active { opacity: .8; }
.btn.prim { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.prim { color: #0b1a2e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.prim { color: #0b1a2e; } }
.btn.green { background: var(--green); color: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn.orange { background: var(--orange); color: #fff; }
.btn.tint { background: var(--fill); color: var(--link); }
.btn.tint-orange { background: rgba(255,149,0,.15); color: var(--orange-t); }
.btn.small { min-height: 34px; width: auto; padding: 0 14px; font-size: 15px; border-radius: 17px; }
.btn[disabled] { opacity: .4; }
.linkbtn { border: 0; background: none; color: var(--link); font-size: 17px; padding: 8px; cursor: pointer; min-height: 44px; }
.linkbtn.bold { font-weight: 600; }
.linkbtn[disabled] { color: var(--faint); }

/* Badges */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
.pill.green { background: rgba(52,199,89,.16); color: var(--green-t); }
.pill.orange { background: rgba(255,149,0,.16); color: var(--orange-t); }
.pill.blue { background: rgba(0,122,255,.14); color: var(--blue); }
.pill.gray { background: var(--fill); color: var(--sub); }
.pill svg { width: 12px; height: 12px; fill: currentColor; }

/* Timer */
.card { background: var(--card); border-radius: 18px; margin: 0 16px 14px; padding: 16px; }
.cap { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .5px; text-transform: uppercase; }
/* Clock on the left, Worked today on the right; the status pill is pinned to the exact middle of the card,
   whatever the widths of the other two (works the same in Safari and every other browser). */
.timer-top { position: relative; display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.timer-top #tstatus { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; }
@media (max-width: 350px) { .timer-top #tstatus { position: static; transform: none; } }   /* very small phones: no room to centre without overlapping */
.ring { position: relative; width: 230px; height: 230px; margin: 10px auto 6px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--fill2); stroke-width: 14; }
.ring .bar { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .6s ease-out; }
.ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22px; }
.ring .t { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.metrics { display: flex; justify-content: center; gap: 36px; margin: 6px 0 14px; text-align: center; }
.metrics .l { font-size: 12px; color: var(--sub); }
.metrics .m { font-weight: 600; font-variant-numeric: tabular-nums; }
.picker { width: 100%; border: 0; border-radius: 10px; background: var(--fill); padding: 11px 12px; margin: 12px 0 4px;
  -webkit-appearance: none; appearance: none; color: var(--link); font-weight: 500; }
.picker:disabled { color: var(--sub); }
.progress { height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; margin: 10px 0 6px; }
.progress > div { height: 100%; border-radius: 4px; }
.two { display: flex; justify-content: space-between; gap: 12px; }
.big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Jobs */
.search { margin: 4px 16px 12px; display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 10px; padding: 8px 10px; }
.search input { border: 0; background: none; outline: none; width: 100%; font-size: 17px; }
.search svg { width: 16px; height: 16px; stroke: var(--sub); fill: none; stroke-width: 2; flex: none; }
.jobrow { display: block; padding: 12px 16px; }
.jobrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.jobrow .name { font-weight: 600; }
.jobrow .desc { color: var(--accent); font-size: 15px; margin-top: 2px; }
.jobrow .addr { color: var(--sub); font-size: 13px; margin-top: 4px; }
.jobrow .acts { display: flex; gap: 8px; margin-top: 8px; }
.empty { text-align: center; color: var(--sub); padding: 60px 30px; }
.empty .ico { font-size: 44px; opacity: .5; }
.empty b { display: block; color: var(--text); font-size: 20px; margin: 8px 0 4px; }

/* Swipe to reveal */
.swipe { position: relative; overflow: hidden; }
.swipe .acts-behind { position: absolute; top: 0; right: 0; bottom: 0; display: flex; visibility: hidden; }
.swipe .acts-behind button { border: 0; color: #fff; width: 80px; font-size: 14px; font-weight: 600; }
.swipe .front { position: relative; background: var(--card); transition: transform .2s ease-out; }
.swipe + .swipe .front::before, .swipe + .swipe::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); z-index: 2; }

/* Overlays */
#overlays .ov { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; animation: up .25s ease-out; }
#overlays .ov.page { animation: left .25s ease-out; }
#overlays .ov.closing { animation: down .2s ease-in forwards; }
#overlays .ov.page.closing { animation: right .2s ease-in forwards; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes left { from { transform: translateX(100%); } to { transform: none; } }
@keyframes right { to { transform: translateX(100%); } }
.navbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(4px + var(--safe-t)) 4px 4px;
  background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: .5px solid var(--sep); flex: none; }
.navbar .title { font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
.navbar .r { justify-self: end; }
.ov .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(30px + var(--safe-b)); }

/* Segmented */
.seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; background: var(--fill); border-radius: 9px; padding: 2px; margin: 12px 16px; }
.seg button { border: 0; background: none; padding: 7px 4px; border-radius: 7px; font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }

/* Earnings */
.periodnav { display: flex; align-items: center; justify-content: space-between; margin: 0 8px; }
.periodnav button { border: 0; background: none; color: var(--link); font-size: 24px; min-width: 44px; min-height: 44px; }
.periodnav .ptitle { font-weight: 600; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding: 18px 16px 4px; }
.chart .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.chart .bar { width: 80%; max-width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; }
.chart .cv { position: absolute; top: -16px; font-size: 10px; color: var(--sub); font-variant-numeric: tabular-nums; }
.chart-labels { display: flex; gap: 4px; padding: 0 16px 12px; font-size: 10px; color: var(--sub); }
.chart-labels span { flex: 1; text-align: center; }
.ratehist .line { display: flex; gap: 10px; font-size: 15px; font-variant-numeric: tabular-nums; padding: 2px 0; }
.ratehist .line span:nth-child(1) { flex: 1; }
.ratehist .line span:nth-child(2) { color: var(--sub); }
.ratehist .line span:nth-child(3) { min-width: 80px; text-align: right; }

/* Steppers */
.stepper { display: inline-flex; background: var(--fill); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: none; width: 44px; height: 32px; font-size: 20px; color: var(--link); }
.stepper button + button { border-left: .5px solid var(--sep); }

/* Address */
.bigsearch { margin: 10px 16px; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 0 14px; min-height: 54px; }
.bigsearch input { border: 0; outline: none; background: none; width: 100%; font-size: 19px; }
.result { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; cursor: pointer; }
.result:active { background: var(--fill); }
.result .ic { font-size: 22px; width: 28px; text-align: center; flex: none; }
.result .addr { font-weight: 400; }
.result.exact .addr { font-weight: 600; }
.notice { margin: 0 16px 12px; padding: 12px; border-radius: 12px; background: rgba(255,149,0,.13); color: var(--orange-t); font-weight: 600; font-size: 15px; }
.minimap { height: 220px; margin: 12px 16px; border-radius: 14px; overflow: hidden; z-index: 0; }
.minimap.small { height: 150px; margin: 0; border-radius: 10px; }
.pinwrap { position: relative; flex: 1; }
.pinwrap #pinmap { position: absolute; inset: 0; }
.centerpin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); font-size: 44px; z-index: 500; pointer-events: none;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); line-height: 1; }
.panel { background: var(--nav); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 14px 16px calc(14px + var(--safe-b)); flex: none; }

/* Map tab */
#jobmap { position: absolute; inset: 0; }
.mapcard { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 600; background: var(--nav); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: 20px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.mapempty { position: absolute; left: 24px; right: 24px; top: 40%; z-index: 600; text-align: center; background: var(--nav);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 20px; }
.mapttl { position: absolute; top: calc(8px + var(--safe-t)); left: 12px; z-index: 600; background: var(--nav); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px); border-radius: 14px; padding: 6px 12px; font-weight: 700; font-size: 17px; }
.mk { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }

/* Action sheet + toast */
.sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 900; display: flex; align-items: flex-end; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.asheet { width: 100%; padding: 8px 8px calc(8px + var(--safe-b)); animation: up .25s ease-out; }
.asheet .grp { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
.asheet .msg { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--sub); }
.asheet .msg b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
.asheet button { display: block; width: 100%; border: 0; border-top: .5px solid var(--sep); background: none; min-height: 56px; font-size: 19px; color: var(--link); }
.asheet button.destructive { color: var(--red); }
.asheet button.cancel { font-weight: 600; border-top: 0; }
#toast { position: fixed; left: 50%; bottom: calc(76px + var(--safe-b)); transform: translateX(-50%); background: rgba(40,40,42,.94); color: #fff;
  padding: 10px 16px; border-radius: 18px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 1000; max-width: 88%; text-align: center; }
#toast.show { opacity: 1; }
.leaflet-container { background: var(--card2); font: inherit; }

/* iOS-style switch */
.sw { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw span { position: absolute; inset: 0; background: var(--fill2); border-radius: 31px; transition: background .2s; }
.sw span::before { content: ""; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: #fff; border-radius: 50%;
  box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.sw input:checked + span { background: var(--green); }
.sw input:checked + span::before { transform: translateX(20px); }

/* Worked today, Coming up, job-card dates */
.timer-top .wt { text-align: right; }
.wtl { font-size: 10.5px; color: var(--sub); letter-spacing: .4px; text-transform: uppercase; }
.wtv { font-size: 15px; font-weight: 700; }
.uprow { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: .5px solid var(--sep); cursor: pointer; font-size: 16px; }
.cap + .uprow { border-top: 0; margin-top: 4px; }
.daterow { font-size: 14px; margin-top: 5px; }
.minilink { border: 0; background: none; color: var(--link); font-size: 14px; font-weight: 600; padding: 4px 0 4px 8px; cursor: pointer; }
.swipe.flash .front { box-shadow: inset 0 0 0 2px var(--blue); }
.jobrow .acts { flex-wrap: wrap; }

/* Job sheet preview: always printed-paper colours */
.paper { background: #fff; color: #111; margin: 14px 12px; padding: 18px 16px 22px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.12); font-size: 14px; }
.paper h1 { font-size: 22px; margin: 14px 0 2px; }
.paper h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1.5px solid #111; }
.ps-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2.5px solid #1B365D; padding-bottom: 10px; }
.ps-brand { display: flex; gap: 9px; align-items: center; }
.ps-brand img { width: 32px; height: 32px; border-radius: 7px; }
.ps-name { font-weight: 700; color: #1B365D; font-size: 17px; }
.ps-sub { font-size: 12px; color: #666; }
.ps-job { color: #1B365D; font-weight: 700; }
.ps-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.ps-table th, .ps-table td { border: 1px solid #c8c8cf; padding: 6px 7px; text-align: left; vertical-align: top; }
.ps-table th { background: #f3f3f8; font-weight: 700; }
.ps-info th { width: 36%; }
.ps-table .n { text-align: right; }
.ps-none { color: #777; font-size: 13px; margin-top: 6px; }
.ps-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.ps-card { background: #f3f3f8; border: 1px solid #c8c8cf; border-radius: 6px; padding: 8px; min-width: 0; }
.ps-card .k { font-size: 9.5px; font-weight: 700; color: #666; text-transform: uppercase; }
.ps-card .v { font-size: 17px; font-weight: 700; margin: 3px 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ps-card .s { font-size: 10px; color: #666; }
.ps-card.profit { background: #e8f6ec; border-color: #1c803c; } .ps-card.profit .k, .ps-card.profit .v { color: #1c803c; }
.ps-card.loss { background: #fdecec; border-color: #c42020; } .ps-card.loss .k, .ps-card.loss .v { color: #c42020; }
.ps-rates div { display: flex; gap: 10px; font-variant-numeric: tabular-nums; padding: 2px 0; }
.ps-rates span:nth-child(1) { flex: 1; } .ps-rates span:nth-child(2) { color: #666; } .ps-rates span:nth-child(3) { min-width: 80px; text-align: right; }
.ps-lines div { border-bottom: 1px solid #c8c8cf; height: 24px; }

/* Each job on its own card */
.swipe.jobcard { background: var(--card); border-radius: 16px; margin: 0 16px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.swipe.jobcard .front { border-radius: 16px; }
.swipe.jobcard + .swipe.jobcard::before, .swipe.jobcard + .swipe.jobcard .front::before { content: none; }
.swipe.jobcard.flash .front { box-shadow: inset 0 0 0 2px var(--blue); }
/* "We collect / Customer drops off" choice inside a list row */
.seg.segrow { margin: 0; width: 100%; }
.seg.segrow button { font-size: 13.5px; padding: 7px 4px; }
.timebox { display: inline-flex; align-items: center; gap: 4px; }

/* "This shift" clock: regular weight, like version 34 */
.ring .t { font-size: 38px; font-weight: 400; letter-spacing: -0.02em; }

/* Photos */
.phhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.phgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.phcell { aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--fill); cursor: pointer; }
.phcell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.phadd { color: var(--link); font-size: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1.5px dashed var(--fill2); background: none; }
.phadd span { font-size: 12px; font-weight: 600; }
.phstrip { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.phkind { display: flex; align-items: center; gap: 6px; }
.phk { font-size: 12px; font-weight: 600; color: var(--sub); width: 44px; }
.phthumb { width: 48px; height: 48px; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: var(--fill); cursor: pointer; }
.phthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ps-photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
.ps-ph { border: 0; padding: 0; background: none; text-align: left; cursor: pointer; }
.ps-ph img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; border: 1px solid #c8c8cf; display: block; }
.ps-ph span { font-size: 11px; color: #666; }

/* Full-screen photo viewer */
.viewer { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; animation: fade .2s; }
.vbar { display: flex; justify-content: space-between; align-items: center; padding: calc(8px + var(--safe-t)) 8px 8px; color: #fff; }
.vbtn { border: 0; background: rgba(255,255,255,.14); color: #fff; min-width: 44px; height: 38px; border-radius: 19px; font-size: 16px; padding: 0 14px; cursor: pointer; }
.vdel { color: #ff6b62; }
.vcount { font-size: 15px; font-weight: 600; }
.vstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.vstage img { max-width: 100%; max-height: 100%; object-fit: contain; }
.varrow { position: absolute; top: 50%; transform: translateY(-50%); border: 0; width: 44px; height: 64px; background: rgba(255,255,255,.12); color: #fff; font-size: 34px; border-radius: 12px; cursor: pointer; }
.varrow.l { left: 8px; } .varrow.r { right: 8px; }
.vcap { color: #ccc; text-align: center; font-size: 14px; padding: 10px 10px calc(14px + var(--safe-b)); }
.sheetbg { z-index: 1200; }
#toast { z-index: 1300; }

/* Map: show my location */
.locbtn { position: absolute; top: calc(8px + var(--safe-t)); right: 12px; z-index: 600; width: 44px; height: 44px; border-radius: 14px; border: 0;
  background: var(--nav); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 2px 10px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center; cursor: pointer; }
.locbtn svg { width: 22px; height: 22px; stroke: var(--link); fill: none; stroke-width: 2; stroke-linejoin: round; }
.locbtn.on svg { fill: var(--link); }
.locbtn.busy svg { opacity: .4; }

/* Income forecast chart */
.fchart { display: flex; gap: 6px; height: 150px; padding: 22px 12px 4px; align-items: stretch; }
.fcol { flex: 1; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border-radius: 8px; min-width: 0; }
.fcol.on { background: var(--fill); }
.fv { font-size: 10px; color: var(--sub); font-variant-numeric: tabular-nums; height: 13px; white-space: nowrap; }
.fstack { flex: 1; width: 60%; max-width: 30px; display: flex; flex-direction: column; justify-content: flex-end; }
.fb { display: block; width: 100%; }
.fb.booked { background: var(--blue); border-radius: 4px 4px 0 0; opacity: .75; }
.fb.done { background: var(--green); }
.fl { font-size: 11px; color: var(--sub); font-weight: 600; }
.fcol.on .fl { color: var(--text); }
.fkey { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--sub); padding: 4px 0 12px; }
.fkey i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.fkey i.done { background: var(--green); } .fkey i.booked { background: var(--blue); opacity: .75; }


/* Dates — one design system: 15px controls, 13px chips, 10px control radius, 12px card radius */
:root { --accent-tint: rgba(27,54,93,.08); --accent-tint-2: rgba(27,54,93,.14); --r-ctl: 10px; --r-card: 12px; --fs-ctl: 15px; --fs-chip: 13px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent-tint: rgba(122,162,217,.14); --accent-tint-2: rgba(122,162,217,.22); } }
:root[data-theme="dark"] { --accent-tint: rgba(122,162,217,.14); --accent-tint-2: rgba(122,162,217,.22); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 15px; height: 15px; stroke-width: 2.25; }
.dcard { background: var(--card); border: 1px solid var(--accent-tint-2); border-radius: var(--r-card); margin: 0 16px 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.drow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dicon { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.dicon .ico { width: 18px; height: 18px; }
.seg.segmini { margin: 0; flex: 1; min-width: 0; padding: 2px; border-radius: var(--r-ctl); }
.seg.segmini button { font-size: var(--fs-chip); font-weight: 500; padding: 6px 2px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.segmini button.on { font-weight: 600; }
.dpill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--fill2); background: none; color: var(--sub); font-size: var(--fs-chip); font-weight: 600;
  border-radius: var(--r-ctl); height: 32px; padding: 0 10px; white-space: nowrap; cursor: pointer; flex: none; }
.dpill.on { background: rgba(52,199,89,.14); border-color: rgba(52,199,89,.35); color: var(--green-t); }

/* ==================== INK & BRASS REDESIGN (Oct 2026) ====================

  --brass: #E2B464; --brass-ink: #1A1306; --line: rgba(14,22,38,.08);
  --bg: #F3F4F7; --card: #ffffff; --card2: #EEF0F4; --text: #0E1626; --sub: #5B667D; --faint: #8C96AA;

}

    --sep: rgba(255,255,255,.08); --fill: rgba(255,255,255,.06); --fill2: rgba(255,255,255,.11); --line: rgba(255,255,255,.07);
    --accent: #E2B464; --link: #E2B464; --green-t: #5BD69B; --orange-t: #F3A35B; --nav: rgba(19,28,46,.92);
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --card: #131C2E; --card2: #1A2540; --text: #F3F5F9; --sub: #9AA6BD; --faint: #6B7891;
  --sep: rgba(255,255,255,.08); --fill: rgba(255,255,255,.06); --fill2: rgba(255,255,255,.11); --line: rgba(255,255,255,.07);

/* --- Done tab: folding months, compact rows --- */
.dtools { display: flex; align-items: flex-start; gap: 10px; margin: 0 16px 12px; }
.dtools .mchip { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
.dtools .mchip.on { background: var(--brass); color: var(--brass-ink); }
.dclient { max-width: 150px; padding-right: 10px; -webkit-appearance: none; appearance: none; text-overflow: ellipsis; }
.djump { position: relative; width: 40px; height: 36px; border-radius: 12px; flex: none; overflow: hidden; }
.djump input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 16px; }
.dhd { display: flex; align-items: center; gap: 8px; width: calc(100% - 32px); margin: 6px 16px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.dhd.yr { background: var(--card2); }
.dhd.yr .dht { font-family: var(--display); font-size: 18px; }
.dhd.mo { margin-left: 16px; }
.dhd .dchev { color: var(--sub); transition: transform .2s; flex: none; }
.dhd.open .dchev { transform: rotate(90deg); }
.dht { font-weight: 700; flex: 1; }
.dhs { color: var(--sub); font-size: 13.5px; white-space: nowrap; }
.drows { margin-top: 0; margin-bottom: 10px; }
.drow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.drow + .drow { border-top: 1px solid var(--sep); }
.drow:active { background: var(--fill); }
.drn { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--sub); min-width: 30px; }
.drm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.drm b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drm span { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dra { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.dra .pill { font-size: 11px; padding: 2px 8px; }
.dhd.mo.sub { margin-left: 30px; width: calc(100% - 46px); }
/* --- Plan tab: Calendar | Map --- */
#tab-map { padding: 0; overflow: hidden; }
.planseg { position: absolute; top: calc(8px + var(--safe-t)); left: 16px; right: 16px; z-index: 700; margin: 0; background: var(--nav); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.planmap { position: absolute; inset: 0; }
.planmap .maptop { top: calc(64px + var(--safe-t)); }
.plancal { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(64px + var(--safe-t)) 0 calc(100px + var(--safe-b)); }
.calhead { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; }
.calhead .rbtn { width: 40px; height: 40px; background: var(--card); }
.calttl { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; font-size: 20px; }
.calnow { min-height: 40px; }
.calcard { padding: 12px 10px 12px; }
.cweek, .cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cweek span { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding-bottom: 6px; }
.cday { aspect-ratio: 1 / 1.05; border: 0; border-radius: 12px; background: none; color: var(--text); font: inherit; font-weight: 600; font-size: 15px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; cursor: pointer; }
.cday.out { cursor: default; }
.cday.today span:first-child { color: var(--accent); font-weight: 800; }
.cday.today { box-shadow: inset 0 0 0 1.5px var(--brass); }
.cday.sel { background: var(--card2) !important; box-shadow: inset 0 0 0 1.5px var(--text); }
.cdots { display: flex; gap: 3px; height: 6px; }
.cdot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--sub); }
.cdot.col { background: #F3A35B; } .cdot.del { background: var(--dblue); } .cdot.meet { background: #C9B8F5; }
.cdot.done { opacity: .35; }
.clegend { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 6px 0; font-size: 12px; color: var(--sub); }
.clegend span { display: inline-flex; align-items: center; gap: 6px; }
.calsum { margin: -4px 26px 12px; }
.calrow { width: 100%; border: 0; background: none; color: var(--text); font: inherit; text-align: left; padding: 12px 0 0; margin-top: 12px; border-top: 1px solid var(--line); display: flex; cursor: pointer; }
.cap + .calrow, .cap + .hint + .calrow { border-top: 0; margin-top: 4px; }
/* --- keep top content clear of iOS's blur band under the status bar (newer iPhones blur ~20pt below it) --- */
:root { --top-clear: 20px; }
.tab { padding-top: calc(var(--safe-t) + var(--top-clear)); }
#tab-map { padding-top: 0; }
.planseg { top: calc(8px + var(--safe-t) + var(--top-clear)); }
.planmap .maptop { top: calc(64px + var(--safe-t) + var(--top-clear)); }
.plancal { padding-top: calc(64px + var(--safe-t) + var(--top-clear)); }
/* --- Quick guide: brass icon tile --- */
.gicon { width: 96px; height: 96px; border-radius: 28px; background: var(--card2); box-shadow: inset 0 0 0 1px var(--line); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 0; margin-bottom: 22px; }
.gtitle { font-family: var(--display); }
.sf.copyright { text-align: center; margin-top: 18px; font-size: 12.5px; }
.appmark { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 26px; }
.appmark b { font-family: var(--display); font-size: 20px; letter-spacing: -.3px; color: var(--text); }
.appmark span { font-size: 13px; color: var(--accent); font-weight: 600; }
/* --- solid tab bar: screens end above it, nothing scrolls underneath --- */
#tabbar { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
.tab { bottom: calc(80px + var(--safe-b)); padding-bottom: 24px; }
.plancal { padding-bottom: 24px; }
.mapcard { bottom: 12px; }
#tab-map .leaflet-bottom { bottom: 0; }
/* ================== END INK & BRASS REDESIGN ================== */
</style>
</head>
<body>
<main class="tab active" id="tab-timer"></main>
<main class="tab" id="tab-jobs"></main>
<main class="tab" id="tab-map"></main>
<main class="tab" id="tab-money"></main>
<main class="tab" id="tab-account"></main>
<nav id="tabbar">
  <button data-tab="timer" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Today</button>
  <button data-tab="jobs"><svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M2.5 12.5h19"/></svg>Jobs</button>
  <button data-tab="map"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Plan</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12v4M4 7v11a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"/><path d="M16 14.5h.01"/></svg>Money</button>
  <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>Account</button>
</nav>
<div id="overlays"></div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"
  onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';s.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';s.crossOrigin='anonymous';document.head.appendChild(s);})()"></script>
<script>
/* Jobwright (formerly TradeMate) Stage 3 — web test build: pure logic.
   Mirrors the native Swift services (Money, ShiftTimer, Reporting, JobRates, AddressSearch,
   AppleAddressSearch, LocationEditing). Money is whole pence, integer maths only. */
(function (root) {
  'use strict';

  // ---------------- Money (Money.swift) ----------------
  function roundedDivision(a, b) {
    if (!(b > 0)) throw new Error('divisor must be positive');
    const m = Math.floor((2 * Math.abs(a) + b) / (2 * b));
    return a < 0 ? -m : m;
  }
  const Money = {
    roundedDivision,
    earningsPence(seconds, ratePence) {
      if (!(seconds > 0) || !(ratePence > 0)) return 0;
      return roundedDivision(seconds * ratePence, 3600);
    },
    allowanceSeconds(quotePence, ratePence) {
      if (!(ratePence > 0) || !(quotePence >= 0)) return null;
      return roundedDivision(quotePence * 3600, ratePence);
    },
    hourlyRatePence(earningsPence, seconds) {
      if (!(seconds > 0)) return null;
      return roundedDivision(earningsPence * 3600, seconds);
    },
    /** "12.345" / "£1,250.5" -> pence, half-up, no floating point. null if not a number. */
    parsePence(text) {
      if (text === null || text === undefined) return null;
      const t = String(text).replace(/[£$€,\s]/g, '');
      const m = t.match(/^(-)?(\d*)(?:\.(\d*))?$/);
      if (!m || (m[2] === '' && (m[3] === undefined || m[3] === ''))) return null;
      const whole = parseInt(m[2] || '0', 10);
      const frac = (m[3] || '') + '000';
      let pence = whole * 100 + parseInt(frac.slice(0, 2), 10);
      if (parseInt(frac[2], 10) >= 5) pence += 1;
      return m[1] ? -pence : pence;
    },
    format(pence, currency) {
      return new Intl.NumberFormat('en-GB', { style: 'currency', currency: currency || 'GBP' }).format(pence / 100);
    },
    formatSigned(pence, currency) {
      return (pence < 0 ? '-' : '+') + Money.format(Math.abs(pence), currency);
    },
    percent(basisPoints) {
      const tenths = roundedDivision(Math.abs(basisPoints), 10);
      return (basisPoints < 0 ? '-' : '') + Math.floor(tenths / 10) + '.' + (tenths % 10) + '%';
    },
    /** pence -> "25.00" for an input box */
    plain(pence) {
      const sign = pence < 0 ? '-' : '';
      const a = Math.abs(pence);
      return sign + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
    }
  };

  const Duration = {
    clock(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':');
    },
    short(seconds) {
      const minutes = Math.round(Math.abs(seconds) / 60);
      return minutes < 60 ? minutes + ' min' : Math.floor(minutes / 60) + 'h ' + (minutes % 60) + 'm';
    },
    hours(seconds) { return (seconds / 3600).toFixed(1) + ' hrs'; },
    decimalHours(seconds) {
      const h = roundedDivision(seconds * 100, 3600);
      const a = Math.abs(h);
      return (h < 0 ? '-' : '') + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
    }
  };

  // ---------------- Timer (ShiftTimer.swift) ----------------
  // Times are milliseconds since 1970; durations are seconds.
  function newShift() {
    return { jobID: null, isRunning: false, isOnBreak: false, shiftStart: null, segmentStart: null, workedBefore: 0, breakBefore: 0 };
  }
  const Shift = {
    create: newShift,
    worked(s, now) {
      if (!s.isRunning || s.isOnBreak || s.segmentStart === null) return s.workedBefore;
      return s.workedBefore + Math.max(0, (now - s.segmentStart) / 1000);
    },
    breakTime(s, now) {
      if (!s.isRunning || !s.isOnBreak || s.segmentStart === null) return s.breakBefore;
      return s.breakBefore + Math.max(0, (now - s.segmentStart) / 1000);
    },
    start(s, jobID, now) {
      if (s.isRunning) return s;
      return Object.assign(newShift(), { jobID: jobID || null, isRunning: true, shiftStart: now, segmentStart: now });
    },
    toggleBreak(s, now) {
      if (!s.isRunning || s.segmentStart === null) return s;
      const n = Object.assign({}, s);
      const elapsed = Math.max(0, (now - s.segmentStart) / 1000);
      if (s.isOnBreak) n.breakBefore += elapsed; else n.workedBefore += elapsed;
      n.isOnBreak = !s.isOnBreak;
      n.segmentStart = now;
      return n;
    },
    /** returns { state, done } — done is null for accidental taps under a second */
    stop(s, now) {
      if (!s.isRunning || s.shiftStart === null) return { state: s, done: null };
      const done = {
        jobID: s.jobID, start: s.shiftStart, end: now,
        workedSeconds: Math.round(Shift.worked(s, now)),
        breakSeconds: Math.round(Shift.breakTime(s, now))
      };
      return { state: newShift(), done: done.workedSeconds >= 1 ? done : null };
    }
  };

  // ---------------- Reporting (Reporting.swift) ----------------
  const GENERAL = 'General / Unassigned';

  function entryEarnings(e) {
    return e.isBillable ? Money.earningsPence(e.workedSeconds, e.ratePence) : 0;
  }

  const Filter = {
    includes(filter, e) {
      if (filter.type === 'all') return true;
      if (filter.type === 'general') return !e.isBillable;
      return e.jobID === filter.id;
    },
    key(filter) { return filter.type === 'job' ? 'job:' + filter.id : filter.type; },
    parse(key) { return key.startsWith('job:') ? { type: 'job', id: key.slice(4) } : { type: key }; }
  };

  function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ms, n) { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); }
  function addMonthsClamped(ms, n) {
    const d = new Date(ms);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d.getTime();
  }

  const Period = {
    list: ['day', 'week', 'month', 'all'],
    label: { day: 'Day', week: 'Week', month: 'Month', all: 'All' },
    /** { start, end } in ms (end exclusive), or null for all time. Weeks start Monday. */
    interval(period, date) {
      const sod = startOfDay(date);
      if (period === 'day') return { start: sod, end: addDays(sod, 1) };
      if (period === 'week') {
        const dow = (new Date(sod).getDay() + 6) % 7;   // Monday = 0
        const start = addDays(sod, -dow);
        return { start, end: addDays(start, 7) };
      }
      if (period === 'month') {
        const d = new Date(sod);
        const start = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
        return { start, end };
      }
      return null;
    },
    shifted(period, date, steps) {
      if (period === 'day') return addDays(date, steps);
      if (period === 'week') return addDays(date, 7 * steps);
      if (period === 'month') return addMonthsClamped(date, steps);
      return date;
    }
  };

  const Reporting = {
    // Note: a log belongs to the period containing its START time, so a shift crossing midnight
    // counts entirely toward the day it started (also used for "Worked today"). Intentional for now.
    entries(all, period, around, filter) {
      const iv = Period.interval(period, around);
      return all.filter(e => Filter.includes(filter, e) && (!iv || (e.start >= iv.start && e.start < iv.end)));
    },
    summary(entries) {
      const s = { shiftCount: 0, workedSeconds: 0, billableSeconds: 0, nonBillableSeconds: 0, breakSeconds: 0,
                  earningsPence: 0, activeDays: 0, longestShiftSeconds: 0 };
      const days = new Set();
      for (const e of entries) {
        s.shiftCount += 1;
        s.workedSeconds += e.workedSeconds;
        s.breakSeconds += e.breakSeconds;
        if (e.isBillable) s.billableSeconds += e.workedSeconds; else s.nonBillableSeconds += e.workedSeconds;
        s.earningsPence += entryEarnings(e);
        s.longestShiftSeconds = Math.max(s.longestShiftSeconds, e.workedSeconds);
        days.add(startOfDay(e.start));
      }
      s.activeDays = days.size;
      s.averageSecondsPerActiveDay = s.activeDays > 0 ? roundedDivision(s.workedSeconds, s.activeDays) : null;
      s.effectiveRatePence = Money.hourlyRatePence(s.earningsPence, s.billableSeconds);
      return s;
    },
    jobTotals(entries) {
      const map = new Map();
      for (const e of entries) {
        const key = !e.isBillable ? 'general' : (e.jobID ? e.jobID : 'deleted:' + e.jobName);
        const t = map.get(key) || { id: key, jobID: e.jobID, name: e.jobName, isBillable: e.isBillable, workedSeconds: 0, earningsPence: 0, shiftCount: 0 };
        t.workedSeconds += e.workedSeconds;
        t.earningsPence += entryEarnings(e);
        t.shiftCount += 1;
        map.set(key, t);
      }
      return [...map.values()].sort((a, b) => {
        if (a.isBillable !== b.isBillable) return a.isBillable ? -1 : 1;
        if (a.earningsPence !== b.earningsPence) return b.earningsPence - a.earningsPence;
        if (a.workedSeconds !== b.workedSeconds) return b.workedSeconds - a.workedSeconds;
        return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      });
    },
    dailyTotals(entries, iv) {
      const days = [];
      for (let d = startOfDay(iv.start); d < iv.end; d = addDays(d, 1)) days.push({ date: d, workedSeconds: 0, earningsPence: 0 });
      const byDay = new Map(days.map(d => [d.date, d]));
      for (const e of entries) {
        const t = byDay.get(startOfDay(e.start));
        if (t) { t.workedSeconds += e.workedSeconds; t.earningsPence += entryEarnings(e); }
      }
      return days;
    },
    rateHistory(entries) {
      const map = new Map();
      for (const e of entries) {
        if (!e.isBillable || !(e.workedSeconds > 0)) continue;
        const l = map.get(e.ratePence) || { ratePence: e.ratePence, workedSeconds: 0, laborPence: 0, entryCount: 0 };
        l.workedSeconds += e.workedSeconds;
        l.laborPence += entryEarnings(e);
        l.entryCount += 1;
        map.set(e.ratePence, l);
      }
      return [...map.values()].sort((a, b) => a.ratePence - b.ratePence);
    },
    /** Job budget. `entries` = every log on the job. Allowance uses the JOB's rate. */
    budget(quotePence, entries, jobRatePence, liveSeconds) {
      const billable = entries.filter(e => e.isBillable);
      const live = Math.max(0, liveSeconds || 0);
      const worked = billable.reduce((s, e) => s + e.workedSeconds, 0) + live;
      const labor = billable.reduce((s, e) => s + entryEarnings(e), 0) + Money.earningsPence(live, jobRatePence || 0);
      const allowance = (quotePence !== null && quotePence !== undefined && jobRatePence !== null && jobRatePence !== undefined)
        ? Money.allowanceSeconds(quotePence, jobRatePence) : null;
      const rateHistory = Reporting.rateHistory(billable);
      const recorded = rateHistory.reduce((s, l) => s + l.laborPence, 0);
      const q = (quotePence === undefined) ? null : quotePence;
      const b = {
        quotePence: q, workedSeconds: worked, laborPence: labor, allowanceSeconds: allowance,
        jobRatePence: (jobRatePence === undefined ? null : jobRatePence), rateHistory,
        recordedLaborPence: recorded,
        runningShiftLaborPence: labor - recorded,
        loggedRatesPence: rateHistory.map(l => l.ratePence)
      };
      b.remainingSeconds = allowance === null ? null : allowance - worked;
      b.variancePence = q === null ? null : q - labor;
      b.varianceBasisPoints = (q !== null && q > 0) ? roundedDivision(b.variancePence * 10000, q) : null;
      b.usedBasisPoints = (allowance !== null && allowance > 0) ? roundedDivision(worked * 10000, allowance) : null;
      b.isOverBudget = (b.remainingSeconds || 0) < 0;
      b.historicalRatesDiffer = rateHistory.length > 1 ||
        (rateHistory.length === 1 && b.jobRatePence !== null && b.jobRatePence !== rateHistory[0].ratePence);
      return b;
    }
  };

  // ---------------- Manual entry / editing (LogDraft) ----------------
  const MAX_SECONDS = 24 * 3600;
  const Draft = {
    isBillable(d) { return d.billing.type !== 'general'; },
    end(d) { return d.start + (Math.max(0, d.workedSeconds) + Math.max(0, d.breakSeconds)) * 1000; },
    earnings(d) { return Draft.isBillable(d) ? Money.earningsPence(d.workedSeconds, d.ratePence) : 0; },
    issues(d) {
      const list = [];
      if (d.workedSeconds < 60) list.push('Enter at least 1 minute of worked time.');
      if (d.workedSeconds > MAX_SECONDS) list.push("One entry can't be longer than 24 hours. Split it into days.");
      if (d.breakSeconds < 0) list.push("Break time can't be negative.");
      if (d.breakSeconds > MAX_SECONDS) list.push("Break time can't be longer than 24 hours.");
      if (d.ratePence < 0) list.push("Hourly rate can't be negative.");
      return list;
    }
  };

  function sameBilling(a, b) {
    return a.type === b.type && (a.id || null) === (b.id || null) && (a.name || null) === (b.name || null);
  }

  // ---------------- Job rates (JobRates.swift) ----------------
  const JobRates = {
    initialRate(defaultRatePence) { return Math.max(0, defaultRatePence); },
    logRate(jobRatePence, defaultRatePence) { return (jobRatePence === null || jobRatePence === undefined) ? defaultRatePence : jobRatePence; },
    rateAfterJobChange(oldBilling, newBilling, currentRatePence, newJobRatePence) {
      if (sameBilling(oldBilling, newBilling) || newBilling.type !== 'job' || newJobRatePence === null || newJobRatePence === undefined) return currentRatePence;
      return newJobRatePence;
    }
  };

  // ---------------- Address contract (AddressSearch.swift) ----------------
  const RANK = { property: 0, street: 1, postcode: 2, area: 3 };
  const Precision = {
    label: { property: 'Exact property', street: 'Street-level location', postcode: 'Postcode area', area: 'General area' },
    notice: {
      property: null,
      street: 'Exact property not found. This is a street-level location.',
      postcode: 'Exact property not found. This is the centre of the postcode, not an address.',
      area: 'Exact property not found. This is a general area, not an address.'
    },
    isExact(p) { return p === 'property'; },
    lessThan(a, b) { return RANK[a] < RANK[b]; }
  };
  const Ranking = {
    ordered(cands) {
      return cands.map((c, i) => [c, i]).sort((a, b) => RANK[a[0].precision] - RANK[b[0].precision] || a[1] - b[1]).map(x => x[0]);
    },
    automaticChoice(cands) {
      const best = Ranking.ordered(cands)[0];

  // ---------- Overlays (sheets and pushed pages) ----------

  // ---------- Leaflet helpers ----------

  function markerIcon(color, glyph) {
    return L.divIcon({ className: '', html: `<div class="mk" style="background:${color}">${glyph}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
  }
  function colorFor(precision, pinMoved) { return pinMoved ? '#007aff' : precision === 'property' ? '#34c759' : '#ff9500'; }
  function glyphFor(precision, pinMoved) { return pinMoved ? '✋' : precision === 'property' ? '🏠' : '•'; }
  function miniMap(el, lat, lng, precision, pinMoved) {
    if (!hasLeaflet()) { el.innerHTML = '<div class="pad hint">Map preview unavailable (no connection).</div>'; return null; }
    const m = L.map(el, { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false, tap: false })

  function renderTimerDynamic() {

      .map(j => `<option value="${esc(j.id)}">${esc(jobLabel(j))}</option>`).join('');

    if ($('tbreak')) $('tbreak').onclick = () => { S.shift = Shift.toggleBreak(S.shift, Date.now()); saveAll(); renderTimerDynamic(); };
    $('tsaved').textContent = S.savedMsg;

  function timerBudgetCard(job, liveSeconds) {
    const used = totalWorked(job) + liveSeconds;
    let inner;
    const allowance = (job.quotePence !== null && job.quotePence !== undefined) ? Money.allowanceSeconds(job.quotePence, job.ratePence || 0) : null;
    if (allowance) {

      const color = f >= 1 ? 'var(--red)' : f >= 0.75 ? 'var(--orange)' : 'var(--green)';
      const left = allowance - used;

          <div><div class="hint">Quoted price</div><div class="big">${fmt(job.quotePence)}</div></div>
          <div style="text-align:right"><div class="hint">Time allowance</div><div class="big">${Number((allowance / 3600).toFixed(2))} hrs</div></div></div>
        <div class="progress"><div style="width:${Math.min(100, f * 100)}%;background:${color}"></div></div>
        <div class="two hint"><span>Logged ${(used / 3600).toFixed(2)} hrs</span><b style="color:${color}">${left >= 0 ? Duration.short(left) + ' left' : 'Over by ' + Duration.short(left)}</b></div>`;
    } else {
      inner = `<div class="hint" style="margin-top:8px">No quoted price set. Add one to see how many hours it covers.</div>`;
    }
    return `<div class="card"><div class="cap">Current job</div><div style="font-weight:600;margin-top:4px">${esc(job.customerName)} · ${esc(job.jobDescription)}</div>${inner}</div>`;
  }

  // ---------- Dates: collection / delivery ----------
  // Who moves the item: the business (collect / deliver) or the customer (drops off / picks up)
  const DATE_KINDS = {
    collect: { short: 'You collect', long: 'Collection date', on: 'Collect on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>', icon: '📥', done: 'Collected', mark: 'Mark as collected' },
    dropoff: { short: 'Customer drops off', long: 'Drop-off date (customer brings it)', on: 'Drop-off on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7M10 20v-4h4v4"/></svg>', icon: '🚗', done: 'Dropped off', mark: 'Mark as dropped off' },
    deliver: { short: 'You deliver', long: 'Due / delivery date', on: 'Deliver on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/></svg>', icon: '📦', done: 'Delivered', mark: 'Mark as delivered' },
    pickup: { short: 'Customer picks up', long: 'Pick-up date (customer collects it)', on: 'Pick-up on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v1.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7M10 20v-4h4v4"/></svg>', icon: '🚗', done: 'Picked up', mark: 'Mark as picked up' },
    meetCustomer: { short: 'Meeting', card: "Meeting at customer's", long: "Meeting (at customer's address)", on: 'Meeting on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.3 3.5-5 6.5-5s5.5 1.7 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.3 2.2 3.8 5"/></svg>', icon: '🤝', done: 'Meeting done', mark: 'Mark meeting as done' },
    meetWorkshop: { short: 'Meeting', card: 'Meeting at workshop', long: 'Meeting (at my workshop)', on: 'Meeting on', svg: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.3 3.5-5 6.5-5s5.5 1.7 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.3 2.2 3.8 5"/></svg>', icon: '🤝', done: 'Meeting done', mark: 'Mark meeting as done' }
  };
  const dateFields = j => [
    ['meetingDate', DATE_KINDS[j.meetingPlace === 'workshop' ? 'meetWorkshop' : 'meetCustomer']],
    ['collectionDate', DATE_KINDS[j.collectionType === 'dropoff' ? 'dropoff' : 'collect']],
    ['deliveryDate', DATE_KINDS[j.deliveryType === 'pickup' ? 'pickup' : 'deliver']]
  ];
  const kindOf = (j, f) => dateFields(j).find(([x]) => x === f)[1];
  function dayDiff(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const n = new Date();
    return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
  }
  // Dates are spelled out by hand so they read the same in every browser ("Mon 21 Sep")
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const prettyDay = s => { const d = fromISO(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
  const longDay = s => { const d = fromISO(s); return `${WD[d.getDay()]} ${d.getDate()} ${MONTH[d.getMonth()]} ${d.getFullYear()}`; };
  // Deposit and balance (whole pence)
  const hasDeposit = j => !!(j.depositPence && j.depositPence > 0);
  const balanceOf = j => (j.quotePence === null || j.quotePence === undefined) ? null : Math.max(0, j.quotePence - (hasDeposit(j) ? j.depositPence : 0));
  function depositRow(j) {
    if (!hasDeposit(j)) return '';
    const bal = balanceOf(j);
    return `<div class="daterow" style="color:var(--sub)">💷 Deposit <b>${esc(fmt(j.depositPence))}</b>${j.depositDate ? ' paid ' + esc(prettyDay(j.depositDate)) : ''}${bal !== null ? ` · Balance <b>${esc(fmt(bal))}</b>` : ''}</div>`;
  }
  const timeField = f => f.replace('Date', 'Time');   // meetingDate -> meetingTime, collectionDate -> collectionTime …
  const doneField = f => f.replace('Date', 'Done');
  const isDone = (j, f) => !!j[doneField(f)];
  const hhmm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const dayTime = ms => `${prettyDay(isoOf(ms))}, ${hhmm(ms)}`;
  const isoOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const bookedMs = (iso, time) => { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); const [hh, mm] = (time || '00:00').split(':').map(Number); return new Date(y, m - 1, d, hh, mm).getTime(); };
  // Asks when it actually happened: now, at the booked time, or a time you pick. Calls done(ms).
  function chooseDoneTime(k, bookedISO, bookedTime, done) {
    const now = Date.now();
    const opts = [{ label: `Now (${hhmm(now)})`, action: () => done(now) }];
    if (bookedISO && bookedTime) opts.push({ label: `At booked time (${prettyDay(bookedISO)}, ${bookedTime})`, action: () => done(bookedMs(bookedISO, bookedTime)) });
    opts.push({ label: 'Pick a time…', action: () => pickDoneTime(k, now, done) });
    opts.push({ label: 'Cancel', role: 'cancel' });
    actionSheet(`${k.done} when?`, "The time it actually happened is saved, next to the booked time.", opts);
  }
  function pickDoneTime(k, defaultMs, done) {
    const ov = pushOverlay('sheet');
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-cancel>Cancel</button><div class="title">${esc(k.done)} at</div>
      <button class="linkbtn bold r" data-save>Save</button></div><div class="body">
      <div class="group" style="margin-top:16px"><div class="row"><span>Date</span><input type="date" id="pd-d" style="width:auto"></div>
      <div class="row"><span>Time</span><input type="time" id="pd-t" style="width:auto"></div></div></div>`;
    ov.querySelector('#pd-d').value = isoOf(defaultMs); ov.querySelector('#pd-t').value = hhmm(defaultMs);
    ov.querySelector('[data-cancel]').onclick = () => closeOverlay(ov);
    ov.querySelector('[data-save]').onclick = () => {
      const d = ov.querySelector('#pd-d').value, t = ov.querySelector('#pd-t').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !/^\d{2}:\d{2}$/.test(t)) { toast('Choose a date and time.'); return; }
      closeOverlay(ov); done(bookedMs(d, t));
    };
  }
  function setDone(jobId, f, done, atMs) {
    const j = jobById(jobId); if (!j) return;
    j[doneField(f)] = done;
    j[doneField(f) + 'At'] = done ? (atMs || Date.now()) : null;
    saveAll(); refreshAll();
    const k = kindOf(j, f);
    toast(done ? `${k.done}: ${j.customerName} at ${hhmm(j[doneField(f) + 'At'])}` : `${k.done} mark removed`);
  }
  // Card / Coming up: ask when, then mark done
  // One tap: marks it done now. "Change" on the card lets you pick the booked time or another time.
  function markDone(jobId, f) { setDone(jobId, f, true, Date.now()); }
  function changeDoneTime(jobId, f) {
    const j = jobById(jobId); if (!j) return;
    chooseDoneTime(kindOf(j, f), j[f], timeOf(j, f), ms => setDone(jobId, f, true, ms));
  }
  // "Mon 21 Sep, 11:00 · booked 10:30" — the booked part only when it differs by more than 15 minutes
  function doneParts(j, f) {
    const at = j[doneField(f) + 'At'];
    if (!at) return { actual: shortWhen(j, f), booked: null };
    const sameDay = isoOf(at) === j[f];
    const differs = timeOf(j, f) ? Math.abs(at - bookedMs(j[f], timeOf(j, f))) > 15 * 60000 : !sameDay;
    return { actual: dayTime(at), booked: differs ? (sameDay && timeOf(j, f) ? timeOf(j, f) : shortWhen(j, f)) : null };
  }
  const timeOf = (j, f) => j[timeField(f)] || '';
  const shortWhen = (j, f) => prettyDay(j[f]) + (timeOf(j, f) ? ', ' + timeOf(j, f) : '');
  const longWhen = (j, f) => {
    const booked = longDay(j[f]) + (timeOf(j, f) ? ' at ' + timeOf(j, f) : '');
    if (!isDone(j, f)) return booked;
    const at = j[doneField(f) + 'At'];
    const word = kindOf(j, f).done.toLowerCase();
    return at ? `${booked} (${word} ${isoOf(at) === j[f] ? 'at ' + hhmm(at) : longDay(isoOf(at)) + ' at ' + hhmm(at)})` : `${booked} (${word})`;

  // Shares a file (Save to Files, Print, AirDrop, Mail…) or downloads it if sharing isn't available
  async function shareOrDownload(name, type, content, title) {
    try {
      const file = new File([content], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title });
        return 'shared';
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
    }
    try {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'downloaded';
    } catch (e) { return 'failed'; }
  }
  const brandName = () => (S.settings.businessName || '').trim() || 'Jobwright';
  const icsEscape = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  // RFC 5545 §3.1: fold lines longer than 75 octets (UTF-8) with CRLF + one space.
  // Splits only between whole characters, so multi-byte characters are never cut in half.
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const out = [];
    let cur = '', bytes = 0;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (bytes + b > 75) { out.push(cur); cur = ' '; bytes = 1; }   // continuation lines start with a space
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n');
  }
  async function addToCalendar(id, field) {
    const j = jobById(id);
    if (!j || !j[field]) return;
    const [y, m, d] = j[field].split('-').map(Number);
    const ymd = dt => `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}`;
    const verb = kindOf(j, field).short;
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const desc = [field === 'meetingDate' && j.meetingNote ? 'Job: ' + j.jobDescription : '', j.phone && 'Phone: ' + j.phone, j.address, j.notes].filter(Boolean).join('\n');
    const time = timeOf(j, field);
    let when, alarms;
    if (time) {   // timed event, one hour long, in the phone's own time zone
      const [hh, mm] = time.split(':').map(Number);
      const hms = dt => `${ymd(dt)}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
      when = [`DTSTART:${hms(new Date(y, m - 1, d, hh, mm))}`, `DTEND:${hms(new Date(y, m - 1, d, hh + 1, mm))}`];
      alarms = [['-P1D', `Tomorrow ${time}: ${verb.toLowerCase()} ${j.customerName}`], ['-PT1H', `In 1 hour: ${verb.toLowerCase()} ${j.customerName}`]];
    } else {      // all-day event
      when = [`DTSTART;VALUE=DATE:${ymd(new Date(y, m - 1, d))}`, `DTEND;VALUE=DATE:${ymd(new Date(y, m - 1, d + 1))}`];
      alarms = [['-PT15H', `Tomorrow: ${verb.toLowerCase()} ${j.customerName}`]];
    }
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${brandName()}//EN`, 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      `UID:${j.id}-${field}@trademate`, `DTSTAMP:${stamp}`,
      ...when,
      `SUMMARY:${icsEscape(`${verb}: ${j.customerName} - ${field === 'meetingDate' && j.meetingNote ? j.meetingNote : j.jobDescription}`)}`,
      `DESCRIPTION:${icsEscape(desc)}`,
      j.address && !(field === 'meetingDate' && j.meetingPlace === 'workshop') ? `LOCATION:${icsEscape(j.address)}` : '',
      ...alarms.flatMap(([trigger, text]) => ['BEGIN:VALARM', `TRIGGER:${trigger}`, 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(text)}`, 'END:VALARM']),
      'END:VEVENT', 'END:VCALENDAR'
    ].filter(Boolean);
    const res = await shareOrDownload(`${verb.toLowerCase()}-${j.customerName.replace(/[^A-Za-z0-9]+/g, '-')}.ics`, 'text/calendar', lines.map(icsFold).join('\r\n'), `${verb}: ${j.customerName}`);
    if (res === 'failed') toast("Couldn't create the calendar event");
    else if (res === 'downloaded') toast('Open the downloaded file to add it to Calendar');
  }

  function startShift() {
    S.savedMsg = '';
    if (S.timerSel && (!jobById(S.timerSel) || ['Completed', 'Declined'].includes(jobById(S.timerSel).status))) S.timerSel = null;   // deleted or finished job: start as General, visibly
    S.shift = Shift.start(S.shift, S.timerSel, Date.now());
    // Starting work on a New job moves it to In Progress (Completed jobs are left alone)
    const job = jobById(S.shift.jobID);
    if (job && job.status === 'New') {
      job.status = 'In Progress';
      S.shift.movedFromNew = true;   // remembered so an accidental under-a-minute shift can undo it
      toast(`${job.customerName} is now In Progress`);
      saveAll(); refreshAll();
      return;
    }
    saveAll(); renderTimerDynamic();
  }
  const MIN_SHIFT_SECONDS = 60;   // shorter shifts are treated as an accidental Start/Stop and not saved
  function stopShift() {
    const movedFromNew = !!S.shift.movedFromNew;
    const r = Shift.stop(S.shift, Date.now());
    S.shift = r.state;
    if (r.done && r.done.workedSeconds < MIN_SHIFT_SECONDS) {
      // Not saved. Also undo the automatic New -> In Progress, if this job has never had any time logged.
      const job = jobById(r.done.jobID);
      if (movedFromNew && job && job.status === 'In Progress' && !S.logs.some(l => l.jobId === job.id)) job.status = 'New';
      S.savedMsg = '';
      toast('Shift under a minute – not saved.');
    } else if (r.done) {
      const job = jobById(r.done.jobID);
      S.logs.push({ id: uid(), start: r.done.start, end: r.done.end, workedSeconds: r.done.workedSeconds, breakSeconds: r.done.breakSeconds,

        customerNameSnapshot: job ? job.customerName : GENERAL, jobId: job ? job.id : null, isManual: false, editedAt: null });
      S.savedMsg = job ? `Saved ${Duration.short(r.done.workedSeconds)} to ${job.customerName}` : `Saved ${Duration.short(r.done.workedSeconds)} (non-billable)`;
    }
    saveAll(); refreshAll();
  }

  function renderJobList() {

      || [j.customerName, j.jobDescription, j.address, j.phone, j.email].some(v => (v || '').toLowerCase().includes(q));

    const nextDate = j => { const ds = dateFields(j).filter(([f]) => j[f] && !isDone(j, f)).map(([f]) => bookedMs(j[f], timeOf(j, f))); return ds.length ? Math.min(...ds) : Infinity; };

    const declined = S.jobs.filter(j => j.status === 'Declined').sort((a, b) => b.createdAt - a.createdAt);
    const active = S.jobs.filter(j => !isEnquiry(j) && j.status !== 'Completed').sort((a, b) => b.createdAt - a.createdAt);

  function requestDeleteJob(job) {
    if (S.shift.isRunning && S.shift.jobID === job.id) { actionSheet("Can't delete", 'Stop the timer before deleting this job.', [{ label: 'OK', role: 'cancel' }]); return; }
    actionSheet('Delete this job?', 'Its time logs are kept.', [
      { label: 'Delete ' + job.customerName, role: 'destructive', action: () => {
        S.jobs = S.jobs.filter(j => j.id !== job.id);
        S.logs.forEach(l => { if (l.jobId === job.id) l.jobId = null; });   // logs keep their saved name and stay billable
        if (S.timerSel === job.id) S.timerSel = null;                        // don't leave the timer pointing at a deleted job
        saveAll(); refreshAll();
        deletePhotosForJob(job.id).then(refreshAll);
      } },
      { label: 'Cancel', role: 'cancel' }]);
  }

        if (totalPhotoBytes() > PHOTO_WARN_BYTES) toast(`Photos now use ${formatBytes(totalPhotoBytes())} on this device (over about 200 MB). Export a backup and consider removing old photos.`);
