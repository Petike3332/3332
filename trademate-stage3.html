<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f2f7; --card: #ffffff; --card2: #f2f2f7; --text: #000; --sub: #6e6e73; --faint: #aeaeb2;
  --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.2);
  --accent: #1B365D; --link: #1f5fbf; --green: #34c759; --green-t: #1f8a3b; --orange: #ff9500; --orange-t: #b86a00;
  --red: #ff3b30; --blue: #007aff; --nav: rgba(249,249,249,.88);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --text: #fff; --sub: #98989f; --faint: #636366;
    --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.32);
    --accent: #7aa2d9; --link: #64a0ff; --green-t: #4fd98a; --orange-t: #ffb340; --nav: rgba(22,22,23,.88);
  }
}
:root[data-theme="dark"] {
  --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --text: #fff; --sub: #98989f; --faint: #636366;
  --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.24); --fill2: rgba(120,120,128,.32);
  --accent: #7aa2d9; --link: #64a0ff; --green-t: #4fd98a; --orange-t: #ffb340; --nav: rgba(22,22,23,.88);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
body { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* Tabs */
.tab { position: fixed; inset: 0 0 calc(56px + var(--safe-b)) 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: var(--safe-t); display: none; }
.tab.active { display: block; }
#tab-map.tab { overflow: hidden; }
.large { font-size: 34px; font-weight: 700; letter-spacing: .3px; margin: 12px 16px 8px; }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(56px + var(--safe-b)); padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(4, 1fr); background: var(--nav); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%); border-top: .5px solid var(--sep); z-index: 50; }
#tabbar button { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 10.5px; font-weight: 500; }
#tabbar button.on { color: var(--accent); }
#tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Grouped lists */
.sh { font-size: 13px; color: var(--sub); text-transform: uppercase; margin: 22px 32px 7px; letter-spacing: .2px; }
.sf { font-size: 13px; color: var(--sub); margin: 7px 32px 0; line-height: 1.35; }
.group { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 11px 16px;
  position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row .v { color: var(--sub); text-align: right; }
.row.tap { cursor: pointer; }
.row.tap:active { background: var(--fill); }
.chev::after { content: "›"; color: var(--faint); font-size: 22px; margin-left: 6px; line-height: 1; }
.row input[type=text], .row input[type=tel], .row input[type=search], .row input.inp, .row textarea, .row select {
  border: 0; background: transparent; outline: none; width: 100%; padding: 0; }
.row input.right { text-align: right; }
.row select { -webkit-appearance: none; appearance: none; text-align: right; color: var(--link); }
.row textarea { resize: none; min-height: 70px; }
.row.btnrow { justify-content: flex-start; color: var(--link); gap: 10px; }
.row.danger { color: var(--red); justify-content: center; }
.hint { font-size: 13px; color: var(--sub); }
.muted { color: var(--sub); }
.pad { padding: 16px; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 0;
  border-radius: 12px; font-weight: 600; font-size: 17px; cursor: pointer; }
.btn:active { opacity: .8; }
.btn.prim { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.prim { color: #0b1a2e; }
.btn.green { background: var(--green); color: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn.orange { background: var(--orange); color: #fff; }
.btn.tint { background: var(--fill); color: var(--link); }
.btn.tint-orange { background: rgba(255,149,0,.15); color: var(--orange-t); }
.btn.small { min-height: 34px; width: auto; padding: 0 14px; font-size: 15px; border-radius: 17px; }
.btn[disabled] { opacity: .4; }
.linkbtn { border: 0; background: none; color: var(--link); font-size: 17px; padding: 8px; cursor: pointer; min-height: 44px; }
.linkbtn.bold { font-weight: 600; }
.linkbtn[disabled] { color: var(--faint); }

/* Badges */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
.pill.green { background: rgba(52,199,89,.16); color: var(--green-t); }
.pill.orange { background: rgba(255,149,0,.16); color: var(--orange-t); }
.pill.blue { background: rgba(0,122,255,.14); color: var(--blue); }
.pill.gray { background: var(--fill); color: var(--sub); }
.pill svg { width: 12px; height: 12px; fill: currentColor; }

/* Timer */
.card { background: var(--card); border-radius: 18px; margin: 0 16px 14px; padding: 16px; }
.cap { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .5px; text-transform: uppercase; }
.timer-top { display: flex; justify-content: space-between; align-items: center; }
.ring { position: relative; width: 230px; height: 230px; margin: 10px auto 6px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--fill2); stroke-width: 14; }
.ring .bar { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .6s ease-out; }
.ring .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22px; }
.ring .t { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
.metrics { display: flex; justify-content: center; gap: 36px; margin: 6px 0 14px; text-align: center; }
.metrics .l { font-size: 12px; color: var(--sub); }
.metrics .m { font-weight: 600; font-variant-numeric: tabular-nums; }
.picker { width: 100%; border: 0; border-radius: 10px; background: var(--fill); padding: 11px 12px; margin: 12px 0 4px;
  -webkit-appearance: none; appearance: none; color: var(--link); font-weight: 500; }
.picker:disabled { color: var(--sub); }
.progress { height: 8px; border-radius: 4px; background: var(--fill2); overflow: hidden; margin: 10px 0 6px; }
.progress > div { height: 100%; border-radius: 4px; }
.two { display: flex; justify-content: space-between; gap: 12px; }
.big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Jobs */
.search { margin: 4px 16px 12px; display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 10px; padding: 8px 10px; }
.search input { border: 0; background: none; outline: none; width: 100%; font-size: 17px; }
.search svg { width: 16px; height: 16px; stroke: var(--sub); fill: none; stroke-width: 2; flex: none; }
.jobrow { display: block; padding: 12px 16px; }
.jobrow .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.jobrow .name { font-weight: 600; }
.jobrow .desc { color: var(--accent); font-size: 15px; margin-top: 2px; }
.jobrow .addr { color: var(--sub); font-size: 13px; margin-top: 4px; }

/* TradeMate Stage 3 — web test build: pure logic.
   Mirrors the native Swift services (Money, ShiftTimer, Reporting, JobRates, AddressSearch,

(function (root) {
  'use strict';

  // ---------------- Money (Money.swift) ----------------
  function roundedDivision(a, b) {
    if (!(b > 0)) throw new Error('divisor must be positive');
    const m = Math.floor((2 * Math.abs(a) + b) / (2 * b));
    return a < 0 ? -m : m;
  }
  const Money = {
    roundedDivision,
    earningsPence(seconds, ratePence) {
      if (!(seconds > 0) || !(ratePence > 0)) return 0;
      return roundedDivision(seconds * ratePence, 3600);
    },
    allowanceSeconds(quotePence, ratePence) {
      if (!(ratePence > 0) || !(quotePence >= 0)) return null;
      return roundedDivision(quotePence * 3600, ratePence);
    },
    hourlyRatePence(earningsPence, seconds) {
      if (!(seconds > 0)) return null;
      return roundedDivision(earningsPence * 3600, seconds);
    },
    /** "12.345" / "£1,250.5" -> pence, half-up, no floating point. null if not a number. */
    parsePence(text) {
      if (text === null || text === undefined) return null;
      const t = String(text).replace(/[£$€,\s]/g, '');
      const m = t.match(/^(-)?(\d*)(?:\.(\d*))?$/);
      if (!m || (m[2] === '' && (m[3] === undefined || m[3] === ''))) return null;
      const whole = parseInt(m[2] || '0', 10);
      const frac = (m[3] || '') + '000';
      let pence = whole * 100 + parseInt(frac.slice(0, 2), 10);
      if (parseInt(frac[2], 10) >= 5) pence += 1;
      return m[1] ? -pence : pence;
    },
    format(pence, currency) {
      return new Intl.NumberFormat('en-GB', { style: 'currency', currency: currency || 'GBP' }).format(pence / 100);
    },
    formatSigned(pence, currency) {
      return (pence < 0 ? '-' : '+') + Money.format(Math.abs(pence), currency);
    },
    percent(basisPoints) {
      const tenths = roundedDivision(Math.abs(basisPoints), 10);
      return (basisPoints < 0 ? '-' : '') + Math.floor(tenths / 10) + '.' + (tenths % 10) + '%';
    },
    /** pence -> "25.00" for an input box */
    plain(pence) {
      const sign = pence < 0 ? '-' : '';
      const a = Math.abs(pence);
      return sign + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
    }
  };

  const Duration = {
    clock(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(n => String(n).padStart(2, '0')).join(':');
    },
    short(seconds) {
      const minutes = Math.round(Math.abs(seconds) / 60);
      return minutes < 60 ? minutes + ' min' : Math.floor(minutes / 60) + 'h ' + (minutes % 60) + 'm';
    },
    hours(seconds) { return (seconds / 3600).toFixed(1) + ' hrs'; },
    decimalHours(seconds) {
      const h = roundedDivision(seconds * 100, 3600);
      const a = Math.abs(h);
      return (h < 0 ? '-' : '') + Math.floor(a / 100) + '.' + String(a % 100).padStart(2, '0');
    }
  };

  // ---------------- Timer (ShiftTimer.swift) ----------------
  // Times are milliseconds since 1970; durations are seconds.
  function newShift() {
    return { jobID: null, isRunning: false, isOnBreak: false, shiftStart: null, segmentStart: null, workedBefore: 0, breakBefore: 0 };
  }
  const Shift = {
    create: newShift,
    worked(s, now) {
      if (!s.isRunning || s.isOnBreak || s.segmentStart === null) return s.workedBefore;
      return s.workedBefore + Math.max(0, (now - s.segmentStart) / 1000);
    },
    breakTime(s, now) {
      if (!s.isRunning || !s.isOnBreak || s.segmentStart === null) return s.breakBefore;
      return s.breakBefore + Math.max(0, (now - s.segmentStart) / 1000);
    },
    start(s, jobID, now) {
      if (s.isRunning) return s;
      return Object.assign(newShift(), { jobID: jobID || null, isRunning: true, shiftStart: now, segmentStart: now });
    },
    toggleBreak(s, now) {
      if (!s.isRunning || s.segmentStart === null) return s;
      const n = Object.assign({}, s);
      const elapsed = Math.max(0, (now - s.segmentStart) / 1000);
      if (s.isOnBreak) n.breakBefore += elapsed; else n.workedBefore += elapsed;
      n.isOnBreak = !s.isOnBreak;
      n.segmentStart = now;
      return n;
    },
    /** returns { state, done } — done is null for accidental taps under a second */
    stop(s, now) {
      if (!s.isRunning || s.shiftStart === null) return { state: s, done: null };
      const done = {
        jobID: s.jobID, start: s.shiftStart, end: now,
        workedSeconds: Math.round(Shift.worked(s, now)),
        breakSeconds: Math.round(Shift.breakTime(s, now))
      };
      return { state: newShift(), done: done.workedSeconds >= 1 ? done : null };
    }
  };

  // ---------------- Reporting (Reporting.swift) ----------------
  const GENERAL = 'General / Unassigned';

  function entryEarnings(e) {
    return e.isBillable ? Money.earningsPence(e.workedSeconds, e.ratePence) : 0;
  }

  const Filter = {
    includes(filter, e) {
      if (filter.type === 'all') return true;
      if (filter.type === 'general') return !e.isBillable;
      return e.jobID === filter.id;
    },
    key(filter) { return filter.type === 'job' ? 'job:' + filter.id : filter.type; },
    parse(key) { return key.startsWith('job:') ? { type: 'job', id: key.slice(4) } : { type: key }; }
  };

  function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ms, n) { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); }
  function addMonthsClamped(ms, n) {
    const d = new Date(ms);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return d.getTime();
  }

  const Period = {
    list: ['day', 'week', 'month', 'all'],
    label: { day: 'Day', week: 'Week', month: 'Month', all: 'All' },
    /** { start, end } in ms (end exclusive), or null for all time. Weeks start Monday. */
    interval(period, date) {
      const sod = startOfDay(date);
      if (period === 'day') return { start: sod, end: addDays(sod, 1) };
      if (period === 'week') {
        const dow = (new Date(sod).getDay() + 6) % 7;   // Monday = 0
        const start = addDays(sod, -dow);
        return { start, end: addDays(start, 7) };
      }
      if (period === 'month') {
        const d = new Date(sod);
        const start = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
        return { start, end };
      }
      return null;
    },
    shifted(period, date, steps) {
      if (period === 'day') return addDays(date, steps);
      if (period === 'week') return addDays(date, 7 * steps);
      if (period === 'month') return addMonthsClamped(date, steps);
      return date;
    }
  };

  const Reporting = {
    entries(all, period, around, filter) {
      const iv = Period.interval(period, around);
      return all.filter(e => Filter.includes(filter, e) && (!iv || (e.start >= iv.start && e.start < iv.end)));
    },
    summary(entries) {
      const s = { shiftCount: 0, workedSeconds: 0, billableSeconds: 0, nonBillableSeconds: 0, breakSeconds: 0,
                  earningsPence: 0, activeDays: 0, longestShiftSeconds: 0 };
      const days = new Set();
      for (const e of entries) {
        s.shiftCount += 1;
        s.workedSeconds += e.workedSeconds;
        s.breakSeconds += e.breakSeconds;
        if (e.isBillable) s.billableSeconds += e.workedSeconds; else s.nonBillableSeconds += e.workedSeconds;
        s.earningsPence += entryEarnings(e);
        s.longestShiftSeconds = Math.max(s.longestShiftSeconds, e.workedSeconds);
        days.add(startOfDay(e.start));
      }
      s.activeDays = days.size;
      s.averageSecondsPerActiveDay = s.activeDays > 0 ? roundedDivision(s.workedSeconds, s.activeDays) : null;
      s.effectiveRatePence = Money.hourlyRatePence(s.earningsPence, s.billableSeconds);
      return s;
    },
    jobTotals(entries) {
      const map = new Map();
      for (const e of entries) {
        const key = !e.isBillable ? 'general' : (e.jobID ? e.jobID : 'deleted:' + e.jobName);
        const t = map.get(key) || { id: key, jobID: e.jobID, name: e.jobName, isBillable: e.isBillable, workedSeconds: 0, earningsPence: 0, shiftCount: 0 };
        t.workedSeconds += e.workedSeconds;
        t.earningsPence += entryEarnings(e);
        t.shiftCount += 1;
        map.set(key, t);
      }
      return [...map.values()].sort((a, b) => {
        if (a.isBillable !== b.isBillable) return a.isBillable ? -1 : 1;
        if (a.earningsPence !== b.earningsPence) return b.earningsPence - a.earningsPence;
        if (a.workedSeconds !== b.workedSeconds) return b.workedSeconds - a.workedSeconds;
        return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      });
    },
    dailyTotals(entries, iv) {
      const days = [];
      for (let d = startOfDay(iv.start); d < iv.end; d = addDays(d, 1)) days.push({ date: d, workedSeconds: 0, earningsPence: 0 });
      const byDay = new Map(days.map(d => [d.date, d]));
      for (const e of entries) {
        const t = byDay.get(startOfDay(e.start));
        if (t) { t.workedSeconds += e.workedSeconds; t.earningsPence += entryEarnings(e); }
      }
      return days;
    },
    rateHistory(entries) {
      const map = new Map();
      for (const e of entries) {
        if (!e.isBillable || !(e.workedSeconds > 0)) continue;
        const l = map.get(e.ratePence) || { ratePence: e.ratePence, workedSeconds: 0, laborPence: 0, entryCount: 0 };
        l.workedSeconds += e.workedSeconds;
        l.laborPence += entryEarnings(e);
        l.entryCount += 1;
        map.set(e.ratePence, l);
      }
      return [...map.values()].sort((a, b) => a.ratePence - b.ratePence);
    },
    /** Job budget. `entries` = every log on the job. Allowance uses the JOB's rate. */
    budget(quotePence, entries, jobRatePence, liveSeconds) {
      const billable = entries.filter(e => e.isBillable);
      const live = Math.max(0, liveSeconds || 0);
      const worked = billable.reduce((s, e) => s + e.workedSeconds, 0) + live;
      const labor = billable.reduce((s, e) => s + entryEarnings(e), 0) + Money.earningsPence(live, jobRatePence || 0);
      const allowance = (quotePence !== null && quotePence !== undefined && jobRatePence !== null && jobRatePence !== undefined)
        ? Money.allowanceSeconds(quotePence, jobRatePence) : null;
      const rateHistory = Reporting.rateHistory(billable);
      const recorded = rateHistory.reduce((s, l) => s + l.laborPence, 0);
      const q = (quotePence === undefined) ? null : quotePence;
      const b = {
        quotePence: q, workedSeconds: worked, laborPence: labor, allowanceSeconds: allowance,
        jobRatePence: (jobRatePence === undefined ? null : jobRatePence), rateHistory,
        recordedLaborPence: recorded,
        runningShiftLaborPence: labor - recorded,
        loggedRatesPence: rateHistory.map(l => l.ratePence)
      };
      b.remainingSeconds = allowance === null ? null : allowance - worked;
      b.variancePence = q === null ? null : q - labor;
      b.varianceBasisPoints = (q !== null && q > 0) ? roundedDivision(b.variancePence * 10000, q) : null;
      b.usedBasisPoints = (allowance !== null && allowance > 0) ? roundedDivision(worked * 10000, allowance) : null;
      b.isOverBudget = (b.remainingSeconds || 0) < 0;
      b.historicalRatesDiffer = rateHistory.length > 1 ||
        (rateHistory.length === 1 && b.jobRatePence !== null && b.jobRatePence !== rateHistory[0].ratePence);
      return b;
    }
  };

  // ---------------- Manual entry / editing (LogDraft) ----------------
  const MAX_SECONDS = 24 * 3600;
  const Draft = {
    isBillable(d) { return d.billing.type !== 'general'; },
    end(d) { return d.start + (Math.max(0, d.workedSeconds) + Math.max(0, d.breakSeconds)) * 1000; },
    earnings(d) { return Draft.isBillable(d) ? Money.earningsPence(d.workedSeconds, d.ratePence) : 0; },
    issues(d) {
      const list = [];
      if (d.workedSeconds < 60) list.push('Enter at least 1 minute of worked time.');
      if (d.workedSeconds > MAX_SECONDS) list.push("One entry can't be longer than 24 hours. Split it into days.");
      if (d.breakSeconds < 0) list.push("Break time can't be negative.");
      if (d.breakSeconds > MAX_SECONDS) list.push("Break time can't be longer than 24 hours.");
      if (d.ratePence < 0) list.push("Hourly rate can't be negative.");
      return list;
    }
  };

  function sameBilling(a, b) {
    return a.type === b.type && (a.id || null) === (b.id || null) && (a.name || null) === (b.name || null);
  }

  // ---------------- Job rates (JobRates.swift) ----------------
  const JobRates = {
    initialRate(defaultRatePence) { return Math.max(0, defaultRatePence); },
    logRate(jobRatePence, defaultRatePence) { return (jobRatePence === null || jobRatePence === undefined) ? defaultRatePence : jobRatePence; },
    rateAfterJobChange(oldBilling, newBilling, currentRatePence, newJobRatePence) {
      if (sameBilling(oldBilling, newBilling) || newBilling.type !== 'job' || newJobRatePence === null || newJobRatePence === undefined) return currentRatePence;
      return newJobRatePence;
    }
  };

  // ---------------- Address contract (AddressSearch.swift) ----------------
  const RANK = { property: 0, street: 1, postcode: 2, area: 3 };
  const Precision = {
    label: { property: 'Exact property', street: 'Street-level location', postcode: 'Postcode area', area: 'General area' },
    notice: {
      property: null,
      street: 'Exact property not found. This is a street-level location.',
      postcode: 'Exact property not found. This is the centre of the postcode, not an address.',
      area: 'Exact property not found. This is a general area, not an address.'
    },
    isExact(p) { return p === 'property'; },
    lessThan(a, b) { return RANK[a] < RANK[b]; }
  };
  const Ranking = {
    ordered(cands) {
      return cands.map((c, i) => [c, i]).sort((a, b) => RANK[a[0].precision] - RANK[b[0].precision] || a[1] - b[1]).map(x => x[0]);
    },
    automaticChoice(cands) {
      const best = Ranking.ordered(cands)[0];
      return best && Precision.isExact(best.precision) ? best : null;
    },
    requiresConfirmation(c) { return !Precision.isExact(c.precision); }
  };

  // ---------------- Classification (AppleAddressSearch.swift) ----------------
  function clean(t) { if (t === null || t === undefined) return null; const s = String(t).trim(); return s ? s : null; }
  const AddressText = {
    clean,
    has(t) { return clean(t) !== null; },
    typedHouseNumber(query) {
      const m = String(query).trim().match(/^\d+[A-Za-z]?(?=[\s,])/);
      return m ? m[0].toUpperCase() : null;
    },
    startsWithHouseNumber(address, number) { return address.toUpperCase().startsWith(number.toUpperCase() + ' '); }
  };
  const Place = {
    precision(f) {
      if (AddressText.has(f.street)) return AddressText.has(f.houseNumber) ? 'property' : 'street';
      if (AddressText.has(f.postcode)) return 'postcode';
      return 'area';
    },
    formatted(f) {
      const parts = [];
      const street = clean(f.street), number = clean(f.houseNumber);
      if (street) parts.push(number ? number + ' ' + street : street);
      for (const p of [f.subLocality, f.locality, f.postcode, f.country]) {
        const v = clean(p);
        if (v && !parts.some(x => x.toLowerCase() === v.toLowerCase())) parts.push(v);
      }
      return parts.join(', ');
    },
    candidate(f) {
      const formattedAddress = Place.formatted(f);
      return { id: formattedAddress + '|' + f.latitude + ',' + f.longitude, formattedAddress,
               latitude: f.latitude, longitude: f.longitude, precision: Place.precision(f) };
    }
  };
  const Candidates = {
    make(places, query) {
      const best = new Map(); const order = [];
      for (const p of places) {
        const c = Place.candidate(p);
        if (!c.formattedAddress) continue;
        const key = c.formattedAddress.toLowerCase();
        const ex = best.get(key);
        if (ex) { if (Precision.lessThan(c.precision, ex.precision)) best.set(key, c); }
        else { best.set(key, c); order.push(key); }
      }
      return Candidates.ranked(order.map(k => best.get(k)), query);
    },
    ranked(cands, query) {
      const base = Ranking.ordered(cands);
      const number = AddressText.typedHouseNumber(query);
      if (!number) return base;
      const matches = c => Precision.isExact(c.precision) && AddressText.startsWithHouseNumber(c.formattedAddress, number);
      return base.map((c, i) => [c, i]).sort((a, b) => {
        if (a[0].precision !== b[0].precision) return RANK[a[0].precision] - RANK[b[0].precision];
        const ma = matches(a[0]), mb = matches(b[0]);
        if (ma !== mb) return ma ? -1 : 1;
        return a[1] - b[1];
      }).map(x => x[0]);
    },
    isDifferentHouse(c, query) {
      const number = AddressText.typedHouseNumber(query);
      if (!Precision.isExact(c.precision) || !number) return false;
      return !AddressText.startsWithHouseNumber(c.formattedAddress, number);
    }
  };

  // ---------------- Job location helpers + editing (AddressSearch.swift, LocationEditing.swift) ----------------
  const JobLocation = {
    has(job) { return job.latitude !== null && job.latitude !== undefined && job.longitude !== null && job.longitude !== undefined; },
    apply(job, c) {
      job.address = c.formattedAddress; job.latitude = c.latitude; job.longitude = c.longitude;
      job.locationPrecision = c.precision; job.locationPinMoved = false;
    },
    movePin(job, lat, lng) { job.latitude = lat; job.longitude = lng; job.locationPinMoved = true; },
    clear(job) { job.latitude = null; job.longitude = null; job.locationPrecision = null; job.locationPinMoved = false; },
    description(job) {
      if (!JobLocation.has(job)) return null;
      if (job.locationPinMoved) return 'Pin placed by you';
      return job.locationPrecision ? Precision.label[job.locationPrecision] : null;
    }
  };
  const LocationEditing = {
    selecting(c) { return { address: c.formattedAddress, precision: c.precision, latitude: c.latitude, longitude: c.longitude, pinMoved: false }; },
    movingPin(loc, lat, lng) { return Object.assign({}, loc, { latitude: lat, longitude: lng, pinMoved: true }); },
    afterTextEdit(loc, text) { if (!loc) return null; return String(text).trim() === loc.address ? loc : null; },
    load(job) {
      if (!JobLocation.has(job) || !job.locationPrecision) return null;
      return { address: job.address, precision: job.locationPrecision, latitude: job.latitude, longitude: job.longitude, pinMoved: !!job.locationPinMoved };
    },
    apply(loc, addressText, job) {
      const text = String(addressText).trim();
      if (loc && text === loc.address) {
        JobLocation.apply(job, { formattedAddress: loc.address, latitude: loc.latitude, longitude: loc.longitude, precision: loc.precision });
        if (loc.pinMoved) JobLocation.movePin(job, loc.latitude, loc.longitude);
      } else if (text !== (job.address || '')) {
        job.address = text;
        JobLocation.clear(job);
      }
    }
  };

  // ---------------- Income forecast ----------------
  // Which month a job's income belongs to, and how much. Whole pence throughout.
  const Forecast = {
    monthKey(dateISO) { return dateISO ? dateISO.slice(0, 7) : null; },
    keyOfMs(ms) { const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
    /** { key: 'YYYY-MM' | null, basis } — booked jobs by handover date; completed jobs by when they finished. */
    placement(job, lastLogMs) {
      const done = job.status === 'Completed';
      const handover = job.deliveryDate ? (job.deliveryType === 'pickup' ? 'pick-up date' : 'delivery date') : null;
      if (done) {
        if (job.deliveryDate) return { key: Forecast.monthKey(job.deliveryDate), basis: handover };
        if (job.completedAt) return { key: Forecast.keyOfMs(job.completedAt), basis: 'completed' };
        if (lastLogMs) return { key: Forecast.keyOfMs(lastLogMs), basis: 'last work logged' };
        if (job.collectionDate) return { key: Forecast.monthKey(job.collectionDate), basis: job.collectionType === 'dropoff' ? 'drop-off date' : 'collection date' };
        return { key: job.createdAt ? Forecast.keyOfMs(job.createdAt) : null, basis: 'date added' };
      }
      if (job.deliveryDate) return { key: Forecast.monthKey(job.deliveryDate), basis: handover };
      if (job.collectionDate) return { key: Forecast.monthKey(job.collectionDate), basis: job.collectionType === 'dropoff' ? 'drop-off date' : 'collection date' };
      if (job.meetingDate) return { key: Forecast.monthKey(job.meetingDate), basis: 'meeting date' };
      return { key: null, basis: 'no date yet' };
    },
    /** Quoted price; a completed job without a quote uses its recorded labour; otherwise null (unpriced). */
    value(job, laborPence) {
      if (job.quotePence !== null && job.quotePence !== undefined) return { pence: job.quotePence, from: 'quote' };
      if (job.status === 'Completed' && laborPence > 0) return { pence: laborPence, from: 'labour' };
      return { pence: null, from: 'none' };
    },
    /** info: jobId -> { laborPence, lastLogMs } */
    month(jobs, info, key) {
      const out = { key, done: [], booked: [], doneTotal: 0, bookedTotal: 0, total: 0, unpriced: 0 };
      for (const job of jobs) {
        const i = info[job.id] || { laborPence: 0, lastLogMs: null };
        const pl = Forecast.placement(job, i.lastLogMs);
        if (pl.key !== key) continue;
        const v = Forecast.value(job, i.laborPence);
        const row = { job, pence: v.pence, from: v.from, basis: pl.basis };
        if (job.status === 'Completed') { out.done.push(row); out.doneTotal += v.pence || 0; }
        else { out.booked.push(row); out.bookedTotal += v.pence || 0; }
        if (v.pence === null) out.unpriced += 1;
      }
      out.total = out.doneTotal + out.bookedTotal;
      return out;
    },
    unscheduled(jobs, info) {
      const rows = jobs.filter(j => j.status !== 'Completed' && Forecast.placement(j, null).key === null)
        .map(job => ({ job, pence: Forecast.value(job, (info[job.id] || {}).laborPence || 0).pence }));
      return { rows, total: rows.reduce((s, r) => s + (r.pence || 0), 0) };
    },
    shiftKey(key, n) {
      const [y, m] = key.split('-').map(Number);
      const d = new Date(y, m - 1 + n, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
  };

  root.TM = { Forecast, Money, Duration, Shift, GENERAL, Filter, Period, Reporting, Draft, sameBilling, JobRates,
              Precision, Ranking, AddressText, Place, Candidates, JobLocation, LocationEditing, startOfDay, entryEarnings };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* TradeMate Stage 3 — web test build: screens. Mirrors the native SwiftUI views. */
(function () {
  'use strict';
  const { Forecast, Money, Duration, Shift, GENERAL, Filter, Period, Reporting, Draft, JobRates, Precision, Ranking,
          AddressText, Place, Candidates, JobLocation, LocationEditing, startOfDay } = window.TM;

  const $ = id => document.getElementById(id);
  const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad2 = n => String(n).padStart(2, '0');

  // ---------- Storage (separate keys, so the older web app's data is never touched) ----------
  const K = { jobs: 'tm3.jobs', logs: 'tm3.logs', settings: 'tm3.settings', shift: 'tm3.shift' };
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } };
  // Returns true/false so callers can tell whether the save actually happened
  // (storage full, private browsing blocking storage, etc. throw here).
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const S = {
    jobs: load(K.jobs, []),
    logs: load(K.logs, []),
    settings: Object.assign({ businessName: '', ratePence: 3500, currency: 'GBP', appearance: 'system' }, load(K.settings, {})),
    shift: Object.assign(Shift.create(), load(K.shift, {})),
    timerSel: null, jobSearch: '', savedMsg: ''
  };
  // Shown at most once every 8s, so a stream of saves while storage is broken doesn't spam toasts.
  let lastSaveFailToast = 0;
  function reportSaveFailure() {
    const now = Date.now();
    if (now - lastSaveFailToast < 8000) return;
    lastSaveFailToast = now;
    toast("Couldn't save — your changes may be lost. Storage may be full or blocked (e.g. Private Browsing).");
  }
  const saveAll = () => {
    const ok = [store(K.jobs, S.jobs), store(K.logs, S.logs), store(K.settings, S.settings), store(K.shift, S.shift)];
    if (ok.includes(false)) reportSaveFailure();
    return !ok.includes(false);
  };

  const cur = () => S.settings.currency;
  const fmt = p => Money.format(p, cur());
  const jobById = id => (id ? S.jobs.find(j => j.id === id) : null) || null;
  const displayName = l => { const j = jobById(l.jobId); return j ? j.customerName : l.customerNameSnapshot; };
  const entryOf = l => ({ id: l.id, jobID: jobById(l.jobId) ? l.jobId : null, jobName: displayName(l), start: l.start,
    workedSeconds: l.workedSeconds, breakSeconds: l.breakSeconds, ratePence: l.ratePence, isBillable: l.isBillable });
  const allEntries = () => S.logs.map(entryOf);
  const jobEntries = job => S.logs.filter(l => l.jobId === job.id).map(entryOf);
  const totalWorked = job => S.logs.filter(l => l.jobId === job.id).reduce((s, l) => s + l.workedSeconds, 0);
  const jobLabel = j => j.customerName + ' – ' + j.jobDescription;

  // ---------- Small helpers ----------
  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
  function actionSheet(title, message, buttons) {
    const bg = document.createElement('div');
    bg.className = 'sheetbg';
    const main = buttons.filter(b => b.role !== 'cancel');
    const cancel = buttons.find(b => b.role === 'cancel') || { label: 'Cancel', role: 'cancel' };
    bg.innerHTML = `<div class="asheet"><div class="grp">${title || message ? `<div class="msg">${title ? `<b>${esc(title)}</b>` : ''}${esc(message || '')}</div>` : ''}
      ${main.map((b, i) => `<button data-i="${i}" class="${b.role === 'destructive' ? 'destructive' : ''}">${esc(b.label)}</button>`).join('')}</div>
      <div class="grp"><button class="cancel" data-c="1">${esc(cancel.label)}</button></div></div>`;
    const close = () => bg.remove();
    bg.addEventListener('click', e => {
      if (e.target === bg || e.target.dataset.c) { close(); if (cancel.action) cancel.action(); return; }
      const i = e.target.dataset.i;
      if (i !== undefined) { close(); main[+i].action && main[+i].action(); }
    });
    document.body.appendChild(bg);
  }
  const statusPill = s => `<span class="pill ${s === 'New' ? 'blue' : s === 'In Progress' ? 'green' : 'gray'}">${esc(s)}</span>`;
  const phoneUrl = p => { const d = String(p || '').replace(/[^0-9+]/g, ''); return d ? 'tel:' + d : null; };
  const directionsUrl = j => JobLocation.has(j) ? `https://maps.apple.com/?daddr=${j.latitude},${j.longitude}`
    : (j.address ? 'https://maps.apple.com/?daddr=' + encodeURIComponent(j.address) : null);

  function locationBadge(precision, pinMoved) {
    if (pinMoved) return `<span class="pill blue">✋ Pin placed by you</span>`;
    if (!precision) return `<span class="pill orange">📍 Location not verified</span>`;
    const icon = { property: '🏠', street: '🛣️', postcode: '✉️', area: '📍' }[precision];
    return `<span class="pill ${precision === 'property' ? 'green' : 'orange'}">${icon} ${esc(Precision.label[precision])}</span>`;
  }
  function locationStatus(precision, pinMoved) {
    let caption = '';
    if (pinMoved && precision) {
      caption = `<div class="hint" style="margin-top:4px">${{
        property: 'Found as an exact property; you then adjusted the pin.',
        street: "Found as a street-level result. Moving the pin doesn't make it an exact property.",
        postcode: "Found as a postcode area. Moving the pin doesn't make it an exact property.",
        area: "Found as a general area. Moving the pin doesn't make it an exact property."
      }[precision]}</div>`;
    } else if (precision && Precision.notice[precision]) {
      caption = `<div class="hint" style="margin-top:4px;color:var(--orange-t)">${esc(Precision.notice[precision])}</div>`;
    }
    return `<div>${locationBadge(precision, pinMoved)}${caption}</div>`;
  }

  // Swipe left to reveal actions (Edit / Delete), like iOS lists.
  function swipeRow(frontHTML, actions, id, extraClass) {
    return `<div class="swipe${extraClass ? ' ' + extraClass : ''}"${id ? ` data-jid="${esc(id)}"` : ''}><div class="acts-behind">${actions.map((a, i) => `<button data-sw="${i}" style="background:${a.color}">${esc(a.label)}</button>`).join('')}</div>
      <div class="front">${frontHTML}</div></div>`;
  }
  let openSwipe = null;
  function bindSwipes(container, handlers) {
    container.querySelectorAll('.swipe').forEach((sw, idx) => {
      const front = sw.querySelector('.front');
      const behind = sw.querySelector('.acts-behind');
      const width = sw.querySelectorAll('.acts-behind button').length * 80;
      const reveal = on => { behind.style.visibility = on ? 'visible' : 'hidden'; };
      front.addEventListener('transitionend', () => { if (!front.style.transform || front.style.transform === 'translateX(0px)') reveal(false); });
      let x0 = 0, y0 = 0, dx = 0, base = 0, drag = false, decided = false;
      front.addEventListener('touchstart', e => {
        if (openSwipe && openSwipe !== front) { openSwipe.style.transform = ''; openSwipe = null; }
        base = openSwipe === front ? -width : 0; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; drag = true; decided = false;
        front.style.transition = 'none';
      }, { passive: true });
      front.addEventListener('touchmove', e => {
        if (!drag) return;
        const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
        if (!decided) { if (Math.abs(mx) < 8 && Math.abs(my) < 8) return; decided = true; if (Math.abs(my) > Math.abs(mx)) { drag = false; front.style.transition = ''; return; } }
        reveal(true);
        dx = Math.max(-width - 20, Math.min(0, base + mx)); front.style.transform = `translateX(${dx}px)`;
      }, { passive: true });
      const end = () => { if (!drag) return; drag = false; front.style.transition = '';
        if (dx < -width / 2) { front.style.transform = `translateX(${-width}px)`; openSwipe = front; } else { front.style.transform = ''; if (openSwipe === front) openSwipe = null; } };
      front.addEventListener('touchend', end); front.addEventListener('touchcancel', end);
      front.addEventListener('click', e => {
        if (openSwipe === front) { e.stopPropagation(); e.preventDefault(); front.style.transform = ''; openSwipe = null; return; }
        if (e.target.closest('a, button')) return;
        handlers.tap && handlers.tap(idx);
      });
      sw.querySelectorAll('.acts-behind button').forEach(b => b.addEventListener('click', () => {
        front.style.transform = ''; openSwipe = null; handlers.action(idx, +b.dataset.sw);
      }));
    });
  }

  // ---------- Overlays (sheets and pushed pages) ----------
  const stack = [];
  function pushOverlay(kind) {
    const el = document.createElement('div');
    el.className = 'ov ' + kind;
    el.style.zIndex = 100 + stack.length * 10;
    $('overlays').appendChild(el);
    stack.push(el);
    return el;
  }
  function closeOverlay(el) {
    const i = stack.indexOf(el); if (i >= 0) stack.splice(i, 1);
    if (el.cleanup) el.cleanup();
    el.classList.add('closing');
    setTimeout(() => el.remove(), 200);
    refreshAll();
  }
  function refreshAll() {
    renderTimerDynamic();
    renderComingUp();
    renderJobList();
    if (activeTab === 'map') renderMapTab();
    stack.forEach(o => o.refresh && o.refresh());
  }

  // ---------- Leaflet helpers ----------
  const OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const OSM_ATTR = '&copy; OpenStreetMap contributors';
  const SAT = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  const SAT_ATTR = 'Imagery &copy; Esri';
  const hasLeaflet = () => typeof window.L !== 'undefined';
  function markerIcon(color, glyph) {
    return L.divIcon({ className: '', html: `<div class="mk" style="background:${color}">${glyph}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
  }
  function colorFor(precision, pinMoved) { return pinMoved ? '#007aff' : precision === 'property' ? '#34c759' : '#ff9500'; }
  function glyphFor(precision, pinMoved) { return pinMoved ? '✋' : precision === 'property' ? '🏠' : '•'; }
  function miniMap(el, lat, lng, precision, pinMoved) {
    if (!hasLeaflet()) { el.innerHTML = '<div class="pad hint">Map preview unavailable (no connection).</div>'; return null; }
    const m = L.map(el, { zoomControl: false, attributionControl: true, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false, tap: false })
      .setView([lat, lng], 18);
    L.tileLayer(OSM, { maxZoom: 19, attribution: OSM_ATTR }).addTo(m);
    L.marker([lat, lng], { icon: markerIcon(colorFor(precision, pinMoved), glyphFor(precision, pinMoved)) }).addTo(m);
    setTimeout(() => m.invalidateSize(), 50);
    return m;
  }

  // =========================================================================================
  // TIMER TAB (TimerView.swift)
  // =========================================================================================
  const RING = 2 * Math.PI * 52;
  const activeJobID = () => S.shift.isRunning ? S.shift.jobID : S.timerSel;
  const activeJob = () => jobById(activeJobID());
  const activeRate = () => JobRates.logRate(activeJob() ? activeJob().ratePence : null, S.settings.ratePence);

  function renderTimer() {
    $('tab-timer').innerHTML = `
      <div class="large">Timer</div>
      <div class="card">
        <div class="timer-top"><span id="wallclock"></span><span id="tstatus"></span>
          <div class="wt"><div class="wtl">Worked today</div><div class="wtv num" id="tworked">00:00:00</div></div></div>
        <select class="picker" id="tpick" aria-label="Job"></select>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34c759"/><stop offset="1" stop-color="#007aff"/></linearGradient></defs>
            <circle class="track" cx="60" cy="60" r="52"/>
            <circle class="bar" id="rbar" cx="60" cy="60" r="52" stroke="url(#rg)" stroke-dasharray="${RING}" stroke-dashoffset="${RING}"/>
          </svg>
          <div class="inner"><div class="cap">This shift</div><div class="t" id="tclock">00:00:00</div><div class="hint" id="tcap"></div></div>
        </div>
        <div class="metrics">
          <div><div class="l">Est. earnings</div><div class="m" id="test"></div></div>
          <div><div class="l">Breaks</div><div class="m" id="tbreaks"></div></div>
        </div>
        <button class="btn" id="tmain"></button>
        <div id="tbreakwrap"></div>
        <div class="hint" id="tsaved" style="text-align:center;margin-top:10px"></div>
      </div>
      <div id="tbudget"></div>
      <div class="card" id="ttoday"></div>
      <div class="card" id="tcoming"></div>`;
    $('tpick').addEventListener('change', e => { S.timerSel = e.target.value || null; renderTimerDynamic(); });
    $('tmain').addEventListener('click', () => S.shift.isRunning ? stopShift() : startShift());
    renderTimerDynamic();
    renderComingUp();
  }

  function renderTimerDynamic() {
    if (!$('tpick')) return;
    const now = Date.now(), sh = S.shift, job = activeJob();
    // picker
    const sel = $('tpick');
    const opts = `<option value="">${GENERAL}</option>` + [...S.jobs].sort((a, b) => a.customerName.localeCompare(b.customerName))
      .map(j => `<option value="${esc(j.id)}">${esc(jobLabel(j))}</option>`).join('');
    if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
    sel.value = activeJobID() || '';
    sel.disabled = sh.isRunning;
    // header
    const live = sh.isRunning && !sh.isOnBreak;
    const d = new Date(now);
    $('wallclock').innerHTML = `<span class="pill ${live ? 'green' : 'gray'} num">${pad2(d.getHours())}:${pad2(d.getMinutes())}</span>`;
    $('tstatus').innerHTML = !sh.isRunning ? '<span class="pill gray">● Stopped</span>' : sh.isOnBreak ? '<span class="pill orange">● On break</span>' : '<span class="pill green">● Running</span>';
    // ring
    const worked = Shift.worked(sh, now);
    $('tclock').textContent = Duration.clock(worked);
    let allowance = null;
    if (job && job.quotePence !== null && job.quotePence !== undefined && job.ratePence) allowance = Money.allowanceSeconds(job.quotePence, job.ratePence);
    const used = (job ? totalWorked(job) : 0) + worked;
    let frac, caption;
    if (allowance) {
      frac = used / allowance;
      const left = allowance - used;
      caption = left >= 0 ? `${Duration.short(left)} left of budget` : `Over budget by ${Duration.short(left)}`;
    } else {
      frac = (worked % 3600) / 3600;
      caption = job ? 'No quote set for this job' : (sh.isRunning ? 'General time · non-billable' : 'Pick a job and press Start');
    }
    const bar = $('rbar');
    bar.style.strokeDashoffset = RING * (1 - Math.max(0, Math.min(1, frac)));
    bar.setAttribute('stroke', allowance && frac > 1 ? '#ff3b30' : 'url(#rg)');
    $('tcap').textContent = caption;
    // metrics
    $('test').textContent = activeJobID() ? fmt(Money.earningsPence(Math.floor(worked), activeRate())) : 'N/A';
    $('tbreaks').textContent = Duration.short(Shift.breakTime(sh, now));
    const main = $('tmain');
    main.className = 'btn ' + (sh.isRunning ? 'red' : 'green');
    main.innerHTML = sh.isRunning ? '■ Stop' : '▶ Start';
    $('tbreakwrap').innerHTML = sh.isRunning
      ? `<button class="btn tint-orange" id="tbreak" style="margin-top:10px">${sh.isOnBreak ? '▶ End break' : '☕ Take a break'}</button>` : '';
    if ($('tbreak')) $('tbreak').onclick = () => { S.shift = Shift.toggleBreak(S.shift, Date.now()); saveAll(); renderTimerDynamic(); };
    $('tsaved').textContent = S.savedMsg;
    // current job budget card
    $('tbudget').innerHTML = job ? timerBudgetCard(job, sh.isRunning ? worked : 0) : '';
    // today
    const todayLogs = S.logs.filter(l => startOfDay(l.start) === startOfDay(now));
    const liveSecs = sh.isRunning ? worked : 0;
    const secs = todayLogs.reduce((s, l) => s + l.workedSeconds, 0) + liveSecs;
    const livePence = sh.isRunning && sh.jobID ? Money.earningsPence(Math.floor(liveSecs), activeRate()) : 0;
    const pence = todayLogs.reduce((s, l) => s + TM.entryEarnings(entryOf(l)), 0) + livePence;
    $('tworked').textContent = Duration.clock(secs);
    if (comingDay !== startOfDay(now)) renderComingUp();   // "today / tomorrow" labels roll over at midnight
    $('ttoday').innerHTML = `<div class="cap">Today</div><div class="two" style="margin-top:10px">
      <div><div class="hint">Hours worked</div><div class="big">${Duration.hours(secs)}</div></div>
      <div style="text-align:right"><div class="hint">Earnings</div><div class="big" style="color:var(--green-t)">${fmt(pence)}</div></div></div>`;
  }

  function timerBudgetCard(job, liveSeconds) {
    const used = totalWorked(job) + liveSeconds;
    let inner;
    const allowance = (job.quotePence !== null && job.quotePence !== undefined) ? Money.allowanceSeconds(job.quotePence, job.ratePence || 0) : null;
    if (allowance) {
      const f = used / allowance;
      const color = f >= 1 ? 'var(--red)' : f >= 0.75 ? 'var(--orange)' : 'var(--green)';
      const left = allowance - used;
      inner = `<div class="two" style="margin-top:10px">
          <div><div class="hint">Quoted price</div><div class="big">${fmt(job.quotePence)}</div></div>
          <div style="text-align:right"><div class="hint">Time allowance</div><div class="big">${Number((allowance / 3600).toFixed(2))} hrs</div></div></div>
        <div class="progress"><div style="width:${Math.min(100, f * 100)}%;background:${color}"></div></div>
        <div class="two hint"><span>Logged ${(used / 3600).toFixed(2)} hrs</span><b style="color:${color}">${left >= 0 ? Duration.short(left) + ' left' : 'Over by ' + Duration.short(left)}</b></div>`;
    } else {
      inner = `<div class="hint" style="margin-top:8px">No quoted price set. Add one to see how many hours it covers.</div>`;
    }
    return `<div class="card"><div class="cap">Current job</div><div style="font-weight:600;margin-top:4px">${esc(job.customerName)} · ${esc(job.jobDescription)}</div>${inner}</div>`;
  }

  // ---------- Dates: collection / delivery ----------
  // Who moves the item: the business (collect / deliver) or the customer (drops off / picks up)
  const DATE_KINDS = {
    collect: { short: 'Collect', long: 'Collection date', on: 'Collect on', icon: '📥', done: 'Collected', mark: 'Mark as collected' },
    dropoff: { short: 'Drop-off', long: 'Drop-off date (customer brings it)', on: 'Drop-off on', icon: '🚗', done: 'Dropped off', mark: 'Mark as dropped off' },
    deliver: { short: 'Deliver', long: 'Due / delivery date', on: 'Deliver on', icon: '📦', done: 'Delivered', mark: 'Mark as delivered' },
    pickup: { short: 'Pick-up', long: 'Pick-up date (customer collects it)', on: 'Pick-up on', icon: '🚗', done: 'Picked up', mark: 'Mark as picked up' },
    meetCustomer: { short: 'Meeting', card: "Meeting at customer's", long: "Meeting (at customer's address)", on: 'Meeting on', icon: '🤝', done: 'Meeting done', mark: 'Mark meeting as done' },
    meetWorkshop: { short: 'Meeting', card: 'Meeting at workshop', long: 'Meeting (at my workshop)', on: 'Meeting on', icon: '🤝', done: 'Meeting done', mark: 'Mark meeting as done' }
  };
  const dateFields = j => [
    ['meetingDate', DATE_KINDS[j.meetingPlace === 'workshop' ? 'meetWorkshop' : 'meetCustomer']],
    ['collectionDate', DATE_KINDS[j.collectionType === 'dropoff' ? 'dropoff' : 'collect']],
    ['deliveryDate', DATE_KINDS[j.deliveryType === 'pickup' ? 'pickup' : 'deliver']]
  ];
  const kindOf = (j, f) => dateFields(j).find(([x]) => x === f)[1];
  function dayDiff(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const n = new Date();
    return Math.round((new Date(y, m - 1, d) - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
  }
  // Dates are spelled out by hand so they read the same in every browser ("Mon 21 Sep")
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const prettyDay = s => { const d = fromISO(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
  const longDay = s => { const d = fromISO(s); return `${WD[d.getDay()]} ${d.getDate()} ${MONTH[d.getMonth()]} ${d.getFullYear()}`; };
  // Deposit and balance (whole pence)
  const hasDeposit = j => !!(j.depositPence && j.depositPence > 0);
  const balanceOf = j => (j.quotePence === null || j.quotePence === undefined) ? null : Math.max(0, j.quotePence - (hasDeposit(j) ? j.depositPence : 0));
  function depositRow(j) {
    if (!hasDeposit(j)) return '';
    const bal = balanceOf(j);
    return `<div class="daterow" style="color:var(--sub)">💷 Deposit <b>${esc(fmt(j.depositPence))}</b>${j.depositDate ? ' paid ' + esc(prettyDay(j.depositDate)) : ''}${bal !== null ? ` · Balance <b>${esc(fmt(bal))}</b>` : ''}</div>`;
  }
  const timeField = f => f.replace('Date', 'Time');   // meetingDate -> meetingTime, collectionDate -> collectionTime …
  const doneField = f => f.replace('Date', 'Done');
  const isDone = (j, f) => !!j[doneField(f)];
  function setDone(jobId, f, done) {
    const j = jobById(jobId); if (!j) return;
    j[doneField(f)] = done;
    j[doneField(f) + 'At'] = done ? Date.now() : null;
    saveAll(); refreshAll();
    const k = kindOf(j, f);
    toast(done ? `${k.done}: ${j.customerName}` : `${k.done} mark removed`);
  }
  const timeOf = (j, f) => j[timeField(f)] || '';
  const shortWhen = (j, f) => prettyDay(j[f]) + (timeOf(j, f) ? ', ' + timeOf(j, f) : '');
  const longWhen = (j, f) => longDay(j[f]) + (timeOf(j, f) ? ' at ' + timeOf(j, f) : '') +
    (isDone(j, f) ? ` (${kindOf(j, f).done.toLowerCase()})` : '');
  const whenLabel = diff => diff < 0 ? `${-diff} day${diff === -1 ? '' : 's'} overdue` : diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : `in ${diff} days`;
  const dateColor = diff => diff < 0 ? 'var(--red)' : diff <= 1 ? 'var(--orange-t)' : 'var(--sub)';

  function dateRows(j) {
    return dateFields(j).filter(([f]) => j[f]).map(([f, k]) => {
      if (isDone(j, f)) {
        return `<div class="daterow" style="color:var(--green-t)">✅ ${k.done}: <b>${esc(shortWhen(j, f))}</b>
          <button type="button" class="minilink" data-undone="${esc(j.id)}" data-f="${f}">Undo</button></div>`;
      }
      const open = j.status !== 'Completed', diff = dayDiff(j[f]);
      return `<div class="daterow" style="color:${open ? dateColor(diff) : 'var(--sub)'}">${k.icon} ${k.card || k.short}: <b>${esc(shortWhen(j, f))}</b>${open ? ' · ' + whenLabel(diff) : ''}${f === 'meetingDate' && j.meetingNote ? ` <span class="muted">(${esc(j.meetingNote)})</span>` : ''}
        ${open ? `<button type="button" class="minilink" data-done="${esc(j.id)}" data-f="${f}">✓ Mark ${esc(k.done.toLowerCase())}</button>` : ''}
        <button type="button" class="minilink" data-cal="${esc(j.id)}" data-f="${f}">+ Calendar</button></div>`;
    }).join('');
  }

  let comingDay = null;
  function renderComingUp() {
    const box = $('tcoming'); if (!box) return;
    comingDay = startOfDay(Date.now());
    const ev = [];
    S.jobs.forEach(j => {
      if (j.status === 'Completed') return;
      dateFields(j).forEach(([f, k]) => { if (j[f] && !isDone(j, f)) ev.push({ j, f, k, label: k.short, icon: k.icon, diff: dayDiff(j[f]), time: timeOf(j, f) }); });
    });
    ev.sort((a, b) => a.diff - b.diff || (a.time || '99:99').localeCompare(b.time || '99:99'));

  // Shares a file (Save to Files, Print, AirDrop, Mail…) or downloads it if sharing isn't available
  async function shareOrDownload(name, type, content, title) {
    try {
      const file = new File([content], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title });
        return 'shared';
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
    }
    try {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'downloaded';
    } catch (e) { return 'failed'; }
  }
  const brandName = () => (S.settings.businessName || '').trim() || 'TradeMate';
  const icsEscape = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  async function addToCalendar(id, field) {
    const j = jobById(id);
    if (!j || !j[field]) return;
    const [y, m, d] = j[field].split('-').map(Number);
    const ymd = dt => `${dt.getFullYear()}${pad2(dt.getMonth() + 1)}${pad2(dt.getDate())}`;
    const verb = kindOf(j, field).short;
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const desc = [field === 'meetingDate' && j.meetingNote ? 'Job: ' + j.jobDescription : '', j.phone && 'Phone: ' + j.phone, j.address, j.notes].filter(Boolean).join('\n');
    const time = timeOf(j, field);
    let when, alarms;
    if (time) {   // timed event, one hour long, in the phone's own time zone
      const [hh, mm] = time.split(':').map(Number);
      const hms = dt => `${ymd(dt)}T${pad2(dt.getHours())}${pad2(dt.getMinutes())}00`;
      when = [`DTSTART:${hms(new Date(y, m - 1, d, hh, mm))}`, `DTEND:${hms(new Date(y, m - 1, d, hh + 1, mm))}`];
      alarms = [['-P1D', `Tomorrow ${time}: ${verb.toLowerCase()} ${j.customerName}`], ['-PT1H', `In 1 hour: ${verb.toLowerCase()} ${j.customerName}`]];
    } else {      // all-day event
      when = [`DTSTART;VALUE=DATE:${ymd(new Date(y, m - 1, d))}`, `DTEND;VALUE=DATE:${ymd(new Date(y, m - 1, d + 1))}`];
      alarms = [['-PT15H', `Tomorrow: ${verb.toLowerCase()} ${j.customerName}`]];
    }
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', `PRODID:-//${brandName()}//EN`, 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      `UID:${j.id}-${field}@trademate`, `DTSTAMP:${stamp}`,
      ...when,
      `SUMMARY:${icsEscape(`${verb}: ${j.customerName} - ${field === 'meetingDate' && j.meetingNote ? j.meetingNote : j.jobDescription}`)}`,
      `DESCRIPTION:${icsEscape(desc)}`,
      j.address && !(field === 'meetingDate' && j.meetingPlace === 'workshop') ? `LOCATION:${icsEscape(j.address)}` : '',
      ...alarms.flatMap(([trigger, text]) => ['BEGIN:VALARM', `TRIGGER:${trigger}`, 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(text)}`, 'END:VALARM']),
      'END:VEVENT', 'END:VCALENDAR'
    ].filter(Boolean);
    const res = await shareOrDownload(`${verb.toLowerCase()}-${j.customerName.replace(/[^A-Za-z0-9]+/g, '-')}.ics`, 'text/calendar', lines.join('\r\n'), `${verb}: ${j.customerName}`);
    if (res === 'failed') toast("Couldn't create the calendar event");
    else if (res === 'downloaded') toast('Open the downloaded file to add it to Calendar');
  }

  function startShift() {
    S.savedMsg = '';
    S.shift = Shift.start(S.shift, S.timerSel, Date.now());
    // Starting work on a New job moves it to In Progress (Completed jobs are left alone)
    const job = jobById(S.shift.jobID);
    if (job && job.status === 'New') {
      job.status = 'In Progress';
      toast(`${job.customerName} is now In Progress`);
      saveAll(); refreshAll();
      return;
    }
    saveAll(); renderTimerDynamic();
  }
  function stopShift() {
    const r = Shift.stop(S.shift, Date.now());
    S.shift = r.state;
    if (r.done) {
      const job = jobById(r.done.jobID);
      S.logs.push({ id: uid(), start: r.done.start, end: r.done.end, workedSeconds: r.done.workedSeconds, breakSeconds: r.done.breakSeconds,
        ratePence: JobRates.logRate(job ? job.ratePence : null, S.settings.ratePence), isBillable: !!job, notes: '',
        customerNameSnapshot: job ? job.customerName : GENERAL, jobId: job ? job.id : null, isManual: false, editedAt: null });
      S.savedMsg = job ? `Saved ${Duration.short(r.done.workedSeconds)} to ${job.customerName}` : `Saved ${Duration.short(r.done.workedSeconds)} (non-billable)`;

      const files = [...fileIn.files];

    function writeJob() {
      let target = job && jobById(job.id);
      const isNew = !target;
      if (isNew) target = { id: editId, createdAt: Date.now(), address: '', latitude: null, longitude: null, locationPrecision: null, locationPinMoved: false,
                            ratePence: JobRates.initialRate(S.settings.ratePence) };
      target.customerName = f.customerName.trim();
      target.jobDescription = f.jobDescription.trim();
      if (f.status === 'Completed' && target.status !== 'Completed') target.completedAt = Date.now();
      if (f.status !== 'Completed') target.completedAt = null;
      target.status = f.status;
      target.phone = f.phone.trim();
      LocationEditing.apply(location, f.address, target);   // chosen location saved with precision; hand edits clear it
      target.notes = f.notes.trim();
      target.collectionDate = f.hasCollect ? f.collect : null;
      target.deliveryDate = f.hasDeliver ? f.deliver : null;
      target.collectionType = f.collectType;
      target.deliveryType = f.deliverType;
      const doneNow = (was, now, atWas) => now ? (was ? atWas : Date.now()) : null;
      target.collectionDoneAt = f.hasCollect ? doneNow(target.collectionDone, f.collectDone, target.collectionDoneAt) : null;
      target.deliveryDoneAt = f.hasDeliver ? doneNow(target.deliveryDone, f.deliverDone, target.deliveryDoneAt) : null;
      target.meetingDoneAt = f.hasMeeting ? doneNow(target.meetingDone, f.meetingDone, target.meetingDoneAt) : null;
      target.meetingDate = f.hasMeeting ? f.meeting : null;
      target.meetingPlace = f.meetingPlace === 'workshop' ? 'workshop' : 'customer';
      target.meetingTime = f.hasMeeting && /^\d{2}:\d{2}$/.test(f.meetingTime) ? f.meetingTime : null;
      target.meetingNote = f.hasMeeting ? f.meetingNote.trim() : '';
      target.meetingDone = f.hasMeeting && f.meetingDone;
      target.collectionDone = f.hasCollect && f.collectDone;
      target.deliveryDone = f.hasDeliver && f.deliverDone;
      target.collectionTime = f.hasCollect && /^\d{2}:\d{2}$/.test(f.collectTime) ? f.collectTime : null;
      target.deliveryTime = f.hasDeliver && /^\d{2}:\d{2}$/.test(f.deliverTime) ? f.deliverTime : null;
      // Quote and deposit: blank means "not set" (allowed); non-blank text that won't parse
      // is caught before we ever reach here, so these always parse cleanly at this point.
      const q = Money.parsePence(f.quote);
      target.quotePence = f.quote.trim() !== '' && q !== null && q >= 0 ? q : null;
      const dep = Money.parsePence(f.deposit);
      if (f.deposit.trim() !== '' && dep !== null && dep > 0) { target.depositPence = dep; target.depositDate = f.depositDate || todayISO(); }
      else { target.depositPence = null; target.depositDate = null; }
      target.ratePence = Math.max(0, Money.parsePence(f.rate));
      if (isNew) S.jobs.push(target);
      saved = true;
      saveAll(); closeOverlay(ov);
    }
    ov.querySelector('[data-save]').onclick = () => {
      if (!(f.customerName.trim() && f.jobDescription.trim())) return;
      // Non-blank text that doesn't parse as an amount is refused rather than silently
      // dropped to £0.00 or "no quote" — the person gets a chance to fix a typo.
      const badQuote = f.quote.trim() !== '' && Money.parsePence(f.quote) === null;
      const badDeposit = f.deposit.trim() !== '' && Money.parsePence(f.deposit) === null;
      const rateVal = Money.parsePence(f.rate);
      const badRate = f.rate.trim() === '' || rateVal === null || rateVal < 0;
      if (badQuote) { toast('Enter a valid quoted price, or leave it blank.'); return; }
      if (badDeposit) { toast('Enter a valid deposit amount, or leave it blank.'); return; }
      if (badRate) { toast('Enter a valid hourly rate for this job.'); return; }
      if (rateVal === 0) {
        actionSheet('Hourly rate is £0.00', "No labour value will be recorded for time logged to this job while its rate is £0.00. You can still save it this way if that's what you want.", [
          { label: 'Save with £0.00 rate', action: writeJob },
          { label: 'Go back and fix it', role: 'cancel' }
        ]);
        return;
      }
      writeJob();
    };
  }

  // Quote vs Actual panel (JobBudgetView.swift)
  function budgetRows(b) {
    const rows = [];
    const row = (l, v, extra = '') => `<div class="row"><span>${l}</span><span class="v num" ${extra}>${v}</span></div>`;
    rows.push(b.quotePence !== null ? row('Quoted price', fmt(b.quotePence)) : row('Quoted price', 'Not set'));
    rows.push(`<div class="row"><span>Labour recorded</span><b class="num">${fmt(b.recordedLaborPence)}</b></div>`);
    if (!b.rateHistory.length) rows.push(`<div class="row hint">No time recorded on this job yet.</div>`);
    else rows.push(`<div class="row ratehist" style="display:block"><div class="hint" style="font-weight:600;margin-bottom:4px">Rate history</div>
      ${b.rateHistory.map(l => `<div class="line"><span>${fmt(l.ratePence)}/hr</span><span>${Duration.decimalHours(l.workedSeconds)} h</span><span>${fmt(l.laborPence)}</span></div>`).join('')}
      <div class="hint" style="font-size:11px;margin-top:4px">Each time entry keeps the rate it was charged at.</div></div>`);
    if (b.runningShiftLaborPence > 0) rows.push(row('Current shift (not yet saved)', fmt(b.runningShiftLaborPence)));
    if (b.variancePence !== null) {
      const c = b.variancePence >= 0 ? 'var(--green-t)' : 'var(--red)';
      rows.push(`<div class="row"><span>Variance</span><span style="text-align:right;color:${c}"><b class="num">${Money.formatSigned(b.variancePence, cur())}</b>
        ${b.varianceBasisPoints !== null ? `<div style="font-size:11px">${Money.percent(Math.abs(b.varianceBasisPoints))} ${b.variancePence >= 0 ? 'under quote' : 'over quote'}</div>` : ''}</span></div>`);
    }
    if (b.jobRatePence !== null) {
      rows.push(row('Current job rate', fmt(b.jobRatePence) + '/hr'));
      if (b.historicalRatesDiffer) rows.push(`<div class="row hint">The current rate (${fmt(b.jobRatePence)}/hr) sets the time allowance and applies to new time. Time already logged stays at the rates shown in the rate history.</div>`);
    }
    if (b.allowanceSeconds !== null) rows.push(row('Time allowance', Duration.decimalHours(b.allowanceSeconds) + ' h'));
    rows.push(row('Time used', Duration.decimalHours(b.workedSeconds) + ' h'));
    if (b.remainingSeconds !== null) rows.push(`<div class="row"><span>${b.remainingSeconds >= 0 ? 'Time remaining' : 'Time over'}</span>
      <b class="num" style="color:${b.remainingSeconds >= 0 ? 'var(--text)' : 'var(--red)'}">${Duration.short(b.remainingSeconds)}</b></div>`);
    if (b.usedBasisPoints !== null) {
      const u = b.usedBasisPoints, c = u > 10000 ? 'var(--red)' : u >= 7500 ? 'var(--orange)' : 'var(--green)';
      rows.push(row('Budget used', Money.percent(u)));
      rows.push(`<div class="row" style="display:block"><div class="progress" style="margin:0"><div style="width:${Math.min(100, u / 100)}%;background:${c}"></div></div></div>`);
    } else if (b.quotePence !== null && b.jobRatePence === null) {
      rows.push(`<div class="row hint">Set a labour rate for this job to see its time allowance.</div>`);
    }
    return rows.join('');
  }

  // =========================================================================================
  // ADDRESS FINDER (AddressSearchView.swift) — free map data stands in for Apple's search
  // =========================================================================================
  async function fetchJson(url, ms = 9000) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
    try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  }
  const fromNominatim = item => { const a = item.address || {}; return { houseNumber: a.house_number, street: a.road || a.pedestrian || a.footway || a.path,
    subLocality: a.village || a.hamlet || a.suburb || a.neighbourhood, locality: a.town || a.city || a.county, postcode: a.postcode, country: a.country,
    latitude: parseFloat(item.lat), longitude: parseFloat(item.lon) }; };
  const fromPhoton = ft => { const p = ft.properties || {}, g = (ft.geometry || {}).coordinates || [0, 0];
    return { houseNumber: p.housenumber, street: p.street || (p.osm_key === 'highway' ? p.name : null), subLocality: p.locality || p.district,
      locality: p.city || p.county, postcode: p.postcode, country: p.country, latitude: g[1], longitude: g[0] }; };
  function findPostcode(q) { const m = String(q).match(/([A-Za-z]{1,2}\d[A-Za-z\d]?)\s*(\d[A-Za-z]{2})/); return m ? (m[1] + ' ' + m[2]).toUpperCase() : null; }

  async function searchAddress(raw) {
    const q = raw.trim();
    if (q.length < 3) return [];
    const places = []; let attempts = 0, failures = 0, lastNom = 0;
    const nomWait = async () => { const gap = Date.now() - lastNom; if (lastNom && gap < 1100) await new Promise(r => setTimeout(r, 1100 - gap)); lastNom = Date.now(); };
    const run = async fn => { attempts++; try { places.push(...(await fn())); } catch (e) { failures++; } };
    const hasProperty = () => places.some(p => Place.precision(p) === 'property');
    const nominatim = (params, uk) => async () => { await nomWait();
      const d = await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&accept-language=en&limit=10' + (uk ? '&countrycodes=gb' : '') + '&' + params);
      return (d || []).map(fromNominatim); };
    // 1. Photon (good with house numbers), UK area
    await run(async () => { const d = await fetchJson('https://photon.komoot.io/api/?limit=10&lang=en&bbox=-8.7,49.8,1.9,60.9&q=' + encodeURIComponent(q));
      return ((d && d.features) || []).map(fromPhoton); });
    // 2. Nominatim free text, UK
    if (!hasProperty()) await run(nominatim('q=' + encodeURIComponent(q), true));
    // 3. A house number was typed but no exact property yet: structured search (street and town separate)
    const number = AddressText.typedHouseNumber(q);
    if (!hasProperty() && number) {
      const pc = findPostcode(q);
      const body = q.replace(/^\d+[A-Za-z]?[,\s]+/, '').replace(pc ? new RegExp(pc.replace(' ', '\\s*'), 'i') : /$^/, '').replace(/[,\s]+$/, '').trim();
      const bits = body.split(',').map(s => s.trim()).filter(Boolean);
      const words = body.split(/\s+/).filter(Boolean);
      const STREETWORD = /^(close|road|rd|street|st|lane|ln|avenue|ave|drive|dr|way|court|crescent|place|terrace|gardens?|hill|park|grove|rise|view|walk|green|row|square|mews)$/i;
      const guesses = [];
      if (bits.length > 1) guesses.push([number + ' ' + bits[0], bits.slice(1).join(', ')]);
      if (bits.length === 1 && words.length > 1 && !STREETWORD.test(words[words.length - 1])) guesses.push([number + ' ' + words.slice(0, -1).join(' '), words[words.length - 1]]);
      for (const [street, city] of guesses) {
        if (hasProperty()) break;
        const p = new URLSearchParams({ street }); if (city) p.set('city', city); if (pc) p.set('postalcode', pc);
        await run(nominatim(p.toString(), true));
      }
    }
    // 4. Nothing in the UK: search worldwide
    if (!places.length) await run(nominatim('q=' + encodeURIComponent(q), false));
    // 5. Postcode centre only as a last resort
    const pc = findPostcode(q);
    if (!places.length && pc) await run(async () => {
      const d = await fetchJson('https://api.postcodes.io/postcodes/' + encodeURIComponent(pc.replace(' ', '')));
      if (d.status !== 200 || !d.result) return [];
      const r = d.result;
      return [{ houseNumber: null, street: null, subLocality: r.admin_ward || r.parish, locality: r.admin_district, postcode: r.postcode, country: 'United Kingdom', latitude: r.latitude, longitude: r.longitude }];
    });
    if (!places.length && failures === attempts) throw new Error("Address search isn't available right now. Check your connection and try again.");
    return Candidates.make(places, q);
  }

  function openAddressSearch(initialQuery, onSave) {
    const ov = pushOverlay('sheet');
    let query = initialQuery || '', results = [], selected = null, searching = false, message = null, token = 0, timer = null, mini = null;
    ov.innerHTML = `<div class="navbar"><button class="linkbtn" data-x>Cancel</button><div class="title">Find address</div><span></span></div>
      <div class="bigsearch"><span style="font-size:20px">🔍</span><input id="as-q" type="search" autocomplete="street-address" autocapitalize="words"
        placeholder="House number, street, town or postcode" enterkeyhint="search"></div>
      <div class="body" id="as-body"></div>`;
    const input = ov.querySelector('#as-q');
    input.value = query;
    ov.querySelector('[data-x]').onclick = () => closeOverlay(ov);
    ov.cleanup = () => { if (mini) mini.remove(); };
    input.addEventListener('input', () => { query = input.value; selected = null; schedule(); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });

    function schedule() {
      clearTimeout(timer);
      const q = query.trim();
      if (q.length < 3) { results = []; searching = false; message = q ? 'Keep typing: house number, street and town work best.' : null; render(); return; }
      timer = setTimeout(async () => {
        const my = ++token; searching = true; message = null; render();
        try { const found = await searchAddress(q); if (my !== token) return; results = found; message = found.length ? null : 'No matching addresses. Try adding the town or postcode.'; }
        catch (e) { if (my !== token) return; results = []; message = e.message; }
        searching = false; render();
      }, 400);
    }
    const saveTitle = p => ({ property: 'Save this property', street: 'Save street location', postcode: 'Save postcode location', area: 'Save area location' }[p]);
    function save(c) { onSave(c); closeOverlay(ov); }
    function render() {
      if (mini) { mini.remove(); mini = null; }
      const box = ov.querySelector('#as-body');
      if (!selected) {
        box.innerHTML = `${searching ? '<div class="pad muted">Searching…</div>' : message ? `<div class="pad muted">${esc(message)}</div>` : ''}
          ${results.length ? `<div class="group">${results.map((c, i) => {
            const exact = Precision.isExact(c.precision), diff = Candidates.isDifferentHouse(c, query);
            return `<div class="result ${exact ? 'exact' : ''}" data-i="${i}" ${i ? 'style="border-top:.5px solid var(--sep)"' : ''}>
              <div class="ic">${exact ? '🏠' : '📍'}</div>
              <div style="flex:1"><div class="addr">${esc(c.formattedAddress)}</div><div style="margin-top:6px">${locationBadge(c.precision, false)}</div>
                ${diff ? '<div class="hint" style="color:var(--orange-t);margin-top:4px">Different house number from your search</div>' : ''}</div>
              <div class="chev"></div></div>`; }).join('')}</div>
            <div class="sf">Results come from OpenStreetMap in this web test. The iPhone app uses Apple's address search, which may find different houses.</div>` : ''}`;
        box.querySelectorAll('.result').forEach(r => r.onclick = () => { selected = results[+r.dataset.i]; input.blur(); render(); });
      } else {
        const c = selected, diff = Candidates.isDifferentHouse(c, query);
        box.innerHTML = `<div class="minimap" id="as-mini"></div>
          <div style="margin:0 16px 12px"><div style="font-size:20px;font-weight:600">${esc(c.formattedAddress)}</div><div style="margin-top:8px">${locationBadge(c.precision, false)}</div></div>
          ${Precision.notice[c.precision] ? `<div class="notice">⚠️ ${esc(Precision.notice[c.precision])}</div>` : '<div class="sf" style="margin:0 16px 12px">Check this is the right house before saving.</div>'}
          ${diff ? '<div class="sf" style="margin:0 16px 12px;color:var(--orange-t)">This house number is different from the one you searched for.</div>' : ''}
          <div style="margin:0 16px"><button class="btn ${Precision.isExact(c.precision) ? 'green' : 'orange'}" id="as-save">${saveTitle(c.precision)}</button>
          <button class="linkbtn" id="as-back" style="width:100%;margin-top:6px">Back to results</button></div>`;
        mini = miniMap(box.querySelector('#as-mini'), c.latitude, c.longitude, c.precision, false);
        box.querySelector('#as-back').onclick = () => { selected = null; render(); };
        box.querySelector('#as-save').onclick = () => {
          if (Ranking.requiresConfirmation(c)) {
            actionSheet(Precision.notice[c.precision], `It will be saved as a ${Precision.label[c.precision].toLowerCase()}, not an exact property. You can move the pin onto the right house afterwards.`,
              [{ label: saveTitle(c.precision), action: () => save(c) }, { label: 'Keep searching', role: 'cancel' }]);
          } else save(c);
        };
      }
    }
    render(); schedule();
    setTimeout(() => input.focus(), 300);
  }
